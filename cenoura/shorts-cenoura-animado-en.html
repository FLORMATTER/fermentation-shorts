<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts animado — Cenoura fermentada</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#faf6f0; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .5s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.1); z-index:40; }
  #progress { height:100%; width:0; background:#ba7517; transition:width .2s linear; }

  .tag {
    position:absolute; top:26px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; opacity:.45; z-index:30; color:#412402;
  }
  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.84); color:#fff;
    padding:14px 22px 17px; font-size:15px; font-weight:700;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.7; margin-top:4px; }

  .wm { position:absolute; top:22px; right:18px; font-size:10px; font-weight:800;
        letter-spacing:.1em; opacity:.3; z-index:35; text-transform:uppercase; color:#412402; }

  .ui { position:absolute; bottom:86px; left:0; right:0; display:flex;
        justify-content:center; gap:10px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.78); color:#fff; font-size:12px;
    font-weight:700; font-family:inherit; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; }
  .cover.hide { display:none; }
  .cover button { width:80px; height:80px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:28px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }

  @keyframes chop { 0%,100%{transform:rotate(-13deg)} 50%{transform:rotate(6deg)} }
  @keyframes rise { 0%{transform:translateY(0);opacity:0} 30%{opacity:.85} 100%{transform:translateY(-92px);opacity:0} }
  @keyframes tick { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
</style>
</head>
<body>

<div id="stage">

  <div class="tag" id="tag">SCENE 1 / 7</div>
  <div class="wm">@yourchannel</div>

    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pause</button>
    <button onclick="next()">▶</button>

  <div class="cover" id="cover"><button onclick="play()">▶</button></div>

<script>
const scenes = [
  { id:'s0', ms:4400, tag:'SCENE 1 / 7', cap:'I am going to ferment carrot', sub:'and I come back here in 5 days', color:'#ba7517' },
  { id:'s1', ms:4400, tag:'SCENE 2 / 7', cap:'First: peel and cut', sub:'into sticks, all the same size', color:'#d85a30' },
  { id:'s2', ms:4600, tag:'SCENE 3 / 7', cap:'Salt is 2% of the weight', sub:'200 g of carrot = 4 g of salt', color:'#3b6d11' },
  { id:'s3', ms:4600, tag:'SCENE 4 / 7', cap:'Carrot ferments fast', sub:'in 5 to 7 days it is ready', color:'#ba7517' },
  { id:'s4', ms:5000, tag:'SCENE 5 / 7', cap:'Press everything into the jar', sub:'the liquid must cover everything', color:'#ba7517' },
  { id:'s5', ms:4600, tag:'SCENE 6 / 7', cap:'Now we just wait', sub:'5 days, stirring every day', color:'#5f5e5a' },
  { id:'s6', ms:5000, tag:'SCENE 7 / 7', cap:'It is ready', sub:'crunchy, a little sour and preserved', color:'#3b6d11' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 80;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Watch';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
</body>
</html>
