<svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" width="680" height="900" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!-- gradientes -->
    <radialGradient id="pBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fdf9f3"/>
      <stop offset="100%" stop-color="#f2e9dc"/>
    </radialGradient>

    <radialGradient id="pRepolho" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#f2f8e2"/>
      <stop offset="45%" stop-color="#dcecb8"/>
      <stop offset="80%" stop-color="#b8d182"/>
      <stop offset="100%" stop-color="#8bab56"/>
    </radialGradient>
    <radialGradient id="pBeterraba" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="32%" stop-color="#d63a68"/>
      <stop offset="75%" stop-color="#8e1a51"/>
      <stop offset="100%" stop-color="#4d0729"/>
    </radialGradient>
    <radialGradient id="pCenoura" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="45%" stop-color="#f0952e"/>
      <stop offset="100%" stop-color="#a85a0c"/>
    </radialGradient>
    <radialGradient id="pRabanete" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ff9db0"/>
      <stop offset="40%" stop-color="#e8435c"/>
      <stop offset="100%" stop-color="#8a0f1e"/>
    </radialGradient>
    <radialGradient id="pPepino" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#c8e89a"/>
      <stop offset="45%" stop-color="#7fb03f"/>
      <stop offset="100%" stop-color="#3f6b1e"/>
    </radialGradient>
    <linearGradient id="pLeaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3f6b1e"/>
      <stop offset="60%" stop-color="#68a02f"/>
      <stop offset="100%" stop-color="#a3d45c"/>
    </linearGradient>

    <linearGradient id="pJarLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d59a" stop-opacity=".35"/>
      <stop offset="45%" stop-color="#d9b96b" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#a8863a" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="pJarGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="82%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".85"/>
    </linearGradient>
    <clipPath id="pJarClip">
      <path d="M-96,196 L-96,-16 Q-96,-40 -74,-40 L74,-40 Q96,-40 96,-16 L96,196 Z"/>
    </clipPath>

    <radialGradient id="pArrow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7d8c46" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7d8c46" stop-opacity="0"/>
    </radialGradient>

    <filter id="pSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8a7452" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="680" height="900" fill="url(#pBg)"/>

  <!-- moldura -->
  <rect x="18" y="18" width="644" height="864" rx="18" fill="none" stroke="#c9b48c" stroke-width="2"/>
  <rect x="26" y="26" width="628" height="848" rx="14" fill="none" stroke="#ddcdae" stroke-width="1"/>

  <!-- ══════ CABEÇALHO ══════ -->
  <text x="340" y="76" text-anchor="middle" font-size="13" font-weight="800" fill="#9c8a68" letter-spacing="5">GUIA ILUSTRADO</text>
  <text x="340" y="118" text-anchor="middle" font-size="36" font-weight="900" fill="#3d3527" letter-spacing="1">FERMENTAÇÃO</text>
  <text x="340" y="154" text-anchor="middle" font-size="30" font-weight="900" fill="#7d8c46" letter-spacing="6">DE LEGUMES</text>

  <!-- linha decorativa -->
  <line x1="180" y1="174" x2="290" y2="174" stroke="#c9b48c" stroke-width="2"/>
  <circle cx="340" cy="174" r="5" fill="#7d8c46"/>
  <line x1="390" y1="174" x2="500" y2="174" stroke="#c9b48c" stroke-width="2"/>

  <text x="340" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#9c8a68">Sal + tempo + paciência = conserva natural</text>

  <!-- ══════ FAIXA DOS LEGUMES ══════ -->
  <g transform="translate(0,232)">
    <rect x="40" y="0" width="600" height="164" rx="14" fill="#ffffff" opacity=".55"/>
    <text x="340" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#a89877" letter-spacing="3">OS 5 LEGUMES MAIS FÁCEIS</text>

    <!-- repolho -->
    <g transform="translate(118,98)">
      <ellipse cx="0" cy="52" rx="40" ry="10" fill="#c9b48c" opacity=".28"/>
      <ellipse cx="0" cy="6" rx="42" ry="40" fill="url(#pRepolho)"/>
      <path d="M0,-30 Q16,-10 0,6 Q-16,-10 0,-30Z" fill="#c3d894" opacity=".7"/>
      <path d="M-34,6 Q-16,-6 0,6 Q-16,18 -34,6Z" fill="#c3d894" opacity=".7"/>
      <path d="M34,6 Q16,-6 0,6 Q16,18 34,6Z" fill="#c3d894" opacity=".7"/>
      <text x="0" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#4d4632">Repolho</text>
      <text x="0" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#8bab56">2% · 7 dias</text>
    </g>

    <!-- beterraba -->
    <g transform="translate(232,98)">
      <ellipse cx="0" cy="52" rx="36" ry="9" fill="#c9b48c" opacity=".28"/>
      <g stroke="url(#pLeaf)" fill="none" stroke-linecap="round" stroke-width="8">
        <path d="M-4,-32 Q-22,-52 -20,-76"/>
        <path d="M0,-33 Q4,-56 -2,-80"/>
        <path d="M4,-32 Q22,-52 22,-74"/>
      </g>
      <ellipse cx="0" cy="8" rx="34" ry="38" fill="url(#pBeterraba)"/>
      <path d="M0,46 Q1,64 0,76" stroke="#5c0a34" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-12" cy="-6" rx="10" ry="8" fill="#ffffff" opacity=".22" transform="rotate(-25 -12 -6)"/>
      <text x="0" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#4d4632">Beterraba</text>
      <text x="0" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#c4457b">2% · 9 dias</text>
    </g>

    <!-- cenoura -->
    <g transform="translate(340,98)">
      <ellipse cx="0" cy="52" rx="34" ry="9" fill="#c9b48c" opacity=".28"/>
      <g stroke="url(#pLeaf)" fill="none" stroke-linecap="round" stroke-width="7">
        <path d="M-3,-34 Q-14,-52 -12,-70"/>
        <path d="M0,-35 Q2,-54 -1,-72"/>
        <path d="M3,-34 Q14,-52 13,-68"/>
      </g>
      <path d="M0,-34 Q24,-10 12,40 Q4,60 0,60 Q-4,60 -12,40 Q-24,-10 0,-34Z" fill="url(#pCenoura)"/>
      <g stroke="#c47a1a" stroke-width="1.6" opacity=".6" fill="none">
        <path d="M-9,-4 L9,-4"/>
        <path d="M-11,14 L11,14"/>
        <path d="M-9,30 L9,30"/>
      </g>
      <text x="0" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#4d4632">Cenoura</text>
      <text x="0" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#e08a22">2% · 6 dias</text>
    </g>

    <!-- rabanete -->
    <g transform="translate(448,98)">
      <ellipse cx="0" cy="52" rx="34" ry="9" fill="#c9b48c" opacity=".28"/>
      <g stroke="url(#pLeaf)" fill="none" stroke-linecap="round" stroke-width="7">
        <path d="M-3,-32 Q-18,-50 -17,-70"/>
        <path d="M0,-33 Q3,-54 -1,-74"/>
        <path d="M3,-32 Q18,-50 17,-68"/>
      </g>
      <ellipse cx="0" cy="8" rx="30" ry="36" fill="url(#pRabanete)"/>
      <path d="M0,44 Q1,60 0,70" stroke="#8a0f1e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-10" cy="-6" rx="8" ry="7" fill="#ffffff" opacity=".28" transform="rotate(-25 -10 -6)"/>
      <text x="0" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#4d4632">Rabanete</text>
      <text x="0" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#c1272d">2% · 6 dias</text>
    </g>

    <!-- pepino -->
    <g transform="translate(556,98)">
      <ellipse cx="0" cy="52" rx="32" ry="9" fill="#c9b48c" opacity=".28"/>
      <g transform="rotate(-14)">
        <rect x="-22" y="-38" width="44" height="76" rx="22" fill="url(#pPepino)"/>
        <g fill="#a8d46a" opacity=".75">
          <circle cx="-9" cy="-18" r="2.6"/>
          <circle cx="7" cy="-6" r="2.6"/>
          <circle cx="-6" cy="8" r="2.6"/>
          <circle cx="10" cy="22" r="2.4"/>
          <circle cx="-11" cy="26" r="2.2"/>
        </g>
      </g>
      <text x="0" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#4d4632">Pepino</text>
      <text x="0" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#5f9a2a">3% · 5 dias</text>
    </g>
  </g>

  <!-- ══════ OS 4 PASSOS ══════ -->
  <g transform="translate(0,428)">
    <text x="340" y="0" text-anchor="middle" font-size="11" font-weight="800" fill="#a89877" letter-spacing="3">O PROCESSO EM 4 PASSOS</text>

    <!-- ─── PASSO 1: CORTAR ─── -->
    <g transform="translate(58,40)">
      <rect x="0" y="0" width="264" height="152" rx="12" fill="#ffffff" opacity=".72" filter="url(#pSoft)"/>
      <circle cx="26" cy="26" r="14" fill="#7d8c46"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">1</text>
      <text x="50" y="31" font-size="15" font-weight="900" fill="#3d3527">CORTAR FINO</text>

      <!-- tábua + fatias -->
      <g transform="translate(132,88)">
        <rect x="-84" y="-26" width="168" height="46" rx="8" fill="#e5d6c0" stroke="#cdb9a0" stroke-width="2"/>
        <g fill="#b8d182" stroke="#8bab56" stroke-width="1.3">
          <rect x="-70" y="-22" width="10" height="30" rx="5" transform="rotate(-7 -65 -7)"/>
          <rect x="-52" y="-25" width="10" height="34" rx="5" transform="rotate(4 -47 -8)"/>
          <rect x="-34" y="-20" width="10" height="28" rx="5" transform="rotate(-5 -29 -6)"/>
          <rect x="-16" y="-26" width="10" height="36" rx="5" transform="rotate(6 -11 -8)"/>
          <rect x="2" y="-21" width="10" height="30" rx="5" transform="rotate(-4 7 -6)"/>
          <rect x="20" y="-24" width="10" height="32" rx="5" transform="rotate(5 25 -8)"/>
          <rect x="38" y="-20" width="10" height="28" rx="5" transform="rotate(-6 43 -6)"/>
        </g>
        <!-- faca -->
        <g transform="translate(62,-46) rotate(14)">
          <rect x="-4" y="-30" width="8" height="22" rx="4" fill="#4a4a48"/>
          <path d="M-5,-8 L5,-8 L7,18 L-7,18Z" fill="#cfcdc6"/>
        </g>
      </g>
      <text x="132" y="140" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a8069">3 mm · igual pra todos</text>
    </g>

    <!-- ─── PASSO 2: SALGAR ─── -->
    <g transform="translate(358,40)">
      <rect x="0" y="0" width="264" height="152" rx="12" fill="#ffffff" opacity=".72" filter="url(#pSoft)"/>
      <circle cx="26" cy="26" r="14" fill="#ba7517"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">2</text>
      <text x="50" y="31" font-size="15" font-weight="900" fill="#3d3527">PESAR 2% DE SAL</text>

      <!-- balança -->
      <g transform="translate(132,82)">
        <ellipse cx="0" cy="30" rx="72" ry="16" fill="#e2d5bb"/>
        <rect x="-66" y="14" width="132" height="18" rx="7" fill="#f0e7d3" stroke="#cdb9a0" stroke-width="2"/>
        <ellipse cx="0" cy="14" rx="66" ry="14" fill="#faf4e6" stroke="#cdb9a0" stroke-width="2"/>
        <ellipse cx="0" cy="10" rx="48" ry="12" fill="#dcecb8"/>
        <rect x="-40" y="36" width="80" height="24" rx="5" fill="#3d3527"/>
        <text x="0" y="54" text-anchor="middle" font-size="16" font-weight="900" fill="#a8d46a" font-family="monospace">12,5 g</text>
        <!-- saco de sal -->
        <g transform="translate(-72,-10) rotate(26)">
          <path d="M-18,-24 L18,-24 L20,20 Q0,26 -20,20Z" fill="#ffffff" stroke="#cfc7b6" stroke-width="1.6"/>
          <rect x="-14" y="-30" width="28" height="8" rx="4" fill="#e8e4d8" stroke="#cfc7b6" stroke-width="1.4"/>
        </g>
        <!-- grãozinhos -->
        <g fill="#ffffff" stroke="#d8d0bd" stroke-width=".9">
          <circle cx="-46" cy="-18" r="2.4"/>
          <circle cx="-30" cy="-26" r="2.1"/>
          <circle cx="-14" cy="-16" r="2.3"/>
        </g>
      </g>
      <text x="132" y="140" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a8069">sal SEM iodo · 500 g = 12,5 g</text>
    </g>

    <!-- ─── PASSO 3: MASSAGEAR ─── -->
    <g transform="translate(58,208)">
      <rect x="0" y="0" width="264" height="152" rx="12" fill="#ffffff" opacity=".72" filter="url(#pSoft)"/>
      <circle cx="26" cy="26" r="14" fill="#d85a30"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">3</text>
      <text x="50" y="31" font-size="15" font-weight="900" fill="#3d3527">MASSAGEAR</text>

      <!-- bacia com mãos -->
      <g transform="translate(132,90)">
        <ellipse cx="0" cy="14" rx="66" ry="34" fill="#f2e9dc" stroke="#d8cbb0" stroke-width="2"/>
        <ellipse cx="0" cy="14" rx="54" ry="26" fill="#dcecb8"/>
        <g>
          <circle cx="-24" cy="6" r="14" fill="#c8dc9c"/>
          <circle cx="22" cy="4" r="14" fill="#c8dc9c"/>
          <circle cx="0" cy="22" r="13" fill="#d4e4ac"/>
        </g>
        <!-- mão esquerda -->
        <g transform="translate(-40,-24)" style="animation:floatUpDown 1.6s ease-in-out infinite">
          <ellipse cx="-14" cy="-12" rx="6.5" ry="11" fill="#6b4636" transform="rotate(-28 -14 -12)"/>
          <ellipse cx="-13.5" cy="-17" rx="3.2" ry="3.6" fill="#e8c9b8" opacity=".92"/>
          <ellipse cx="-19" cy="0" rx="6" ry="10" fill="#6b4636" transform="rotate(-16 -19 0)"/>
          <ellipse cx="-18.5" cy="-4" rx="3" ry="3.4" fill="#e8c9b8" opacity=".92"/>
          <ellipse cx="0" cy="0" rx="22" ry="19" fill="#6b4636"/>
          <ellipse cx="8" cy="-17" rx="7.5" ry="6" fill="#6b4636" transform="rotate(20 8 -17)"/>
          <ellipse cx="10" cy="-21" rx="3.6" ry="3" fill="#e8c9b8" opacity=".92"/>
        </g>
        <!-- mão direita -->
        <g transform="translate(40,-24)" style="animation:floatUpDown 1.6s ease-in-out .8s infinite">
          <ellipse cx="14" cy="-12" rx="6.5" ry="11" fill="#6b4636" transform="rotate(28 14 -12)"/>
          <ellipse cx="13.5" cy="-17" rx="3.2" ry="3.6" fill="#e8c9b8" opacity=".92"/>
          <ellipse cx="19" cy="0" rx="6" ry="10" fill="#6b4636" transform="rotate(16 19 0)"/>
          <ellipse cx="18.5" cy="-4" rx="3" ry="3.4" fill="#e8c9b8" opacity=".92"/>
          <ellipse cx="0" cy="0" rx="22" ry="19" fill="#6b4636"/>
          <ellipse cx="-8" cy="-17" rx="7.5" ry="6" fill="#6b4636" transform="rotate(-20 -8 -17)"/>
          <ellipse cx="-10" cy="-21" rx="3.6" ry="3" fill="#e8c9b8" opacity=".92"/>
        </g>
        <!-- gotas -->
        <g fill="#8ec9e8">
          <circle cx="-28" cy="34" r="3.6"/>
          <circle cx="4" cy="42" r="3.2"/>
          <circle cx="30" cy="32" r="3.4"/>
        </g>
      </g>
      <text x="132" y="140" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a8069">até soltar água · 3 a 10 min</text>
    </g>

    <!-- ─── PASSO 4: PRENSAR ─── -->
    <g transform="translate(358,208)">
      <rect x="0" y="0" width="264" height="152" rx="12" fill="#ffffff" opacity=".72" filter="url(#pSoft)"/>
      <circle cx="26" cy="26" r="14" fill="#1d9e75"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">4</text>
      <text x="50" y="31" font-size="15" font-weight="900" fill="#3d3527">PRENSAR NO POTE</text>

      <!-- pote -->
      <g transform="translate(132,86)">
        <g clip-path="url(#pJarClip)" transform="scale(.62)">
          <rect x="-96" y="-40" width="192" height="236" fill="#fdfcf6"/>
          <g fill="#c8dc9c" stroke="#a8c47c" stroke-width="2">
            <rect x="-72" y="10" width="22" height="72" rx="10" transform="rotate(-8 -61 46)"/>
            <rect x="-36" y="0" width="22" height="84" rx="10" transform="rotate(6 -25 42)"/>
            <rect x="0" y="8" width="22" height="76" rx="10" transform="rotate(-3 11 46)"/>
            <rect x="36" y="-4" width="22" height="86" rx="10" transform="rotate(8 47 39)"/>
          </g>
          <rect x="-96" y="16" width="192" height="180" fill="url(#pJarLiquid)"/>
        </g>
        <rect x="-60" y="-25" width="120" height="146" rx="8" fill="none" stroke="#b89a5c" stroke-width="3"/>
        <rect x="-60" y="-25" width="120" height="15" rx="5" fill="#e8d59a" stroke="#b89a5c" stroke-width="3"/>
        <!-- mão prensando -->
        <g transform="translate(0,-30)">
          <ellipse cx="-16" cy="-10" rx="7" ry="12" fill="#6b4636" transform="rotate(-30 -16 -10)"/>
          <ellipse cx="-15.5" cy="-16" rx="3.4" ry="3.8" fill="#e8c9b8" opacity=".92"/>
          <ellipse cx="0" cy="-22" rx="32" ry="21" fill="#6b4636"/>
          <ellipse cx="16" cy="-11" rx="7" ry="12" fill="#6b4636" transform="rotate(30 16 -11)"/>
          <ellipse cx="15.5" cy="-17" rx="3.4" ry="3.8" fill="#e8c9b8" opacity=".92"/>
        </g>
        <!-- pedrinha de peso -->
        <ellipse cx="0" cy="-56" rx="16" ry="9" fill="#a89b84"/>
      </g>
      <text x="132" y="140" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a8069">tudo submerso · sem ar</text>
    </g>

    <!-- setas conectoras -->
    <g opacity=".5">
      <path d="M326,116 L354,116" stroke="#7d8c46" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M347,110 L354,116 L347,122" fill="none" stroke="#7d8c46" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M190,196 L190,204" stroke="#7d8c46" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M184,199 L190,206 L196,199" fill="none" stroke="#7d8c46" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M490,196 L490,204" stroke="#7d8c46" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M484,199 L490,206 L496,199" fill="none" stroke="#7d8c46" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ══════ LINHA DO TEMPO ══════ -->
  <g transform="translate(0,828)">
    <text x="340" y="-18" text-anchor="middle" font-size="11" font-weight="800" fill="#a89877" letter-spacing="3">TEMPO NA SALMOURA</text>
    <line x1="80" y1="14" x2="600" y2="14" stroke="#ddcdae" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="14" x2="600" y2="14" stroke="#7d8c46" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <g fill="#7d8c46">
      <circle cx="80" cy="14" r="7"/>
      <circle cx="340" cy="14" r="7"/>
      <circle cx="600" cy="14" r="7"/>
    </g>
    <text x="80" y="-2" text-anchor="middle" font-size="11" font-weight="800" fill="#6b6448">DIA 0</text>
    <text x="340" y="-2" text-anchor="middle" font-size="11" font-weight="800" fill="#6b6448">DIA 3</text>
    <text x="600" y="-2" text-anchor="middle" font-size="11" font-weight="800" fill="#6b6448">DIA 7</text>
    <text x="80" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#9c8a68">fecha</text>
    <text x="340" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#9c8a68">prova</text>
    <text x="600" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#9c8a68">geladeira</text>
  </g>

  <!-- rodapé -->
  <text x="340" y="882" text-anchor="middle" font-size="10" font-weight="600" fill="#b8a988">Se aparecer mofo colorido ou peludo: JOGUE FORA. Bolha e cheiro azedo são normais.</text>
</svg>
