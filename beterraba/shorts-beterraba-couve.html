<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animação — Fermentação de Beterraba com Couve</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fbf5f7; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .45s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#8e1a51; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:78px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.55);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:13px 22px 16px; font-size:15.5px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:11.5px; font-weight:500; opacity:.72; margin-top:3px; }

  @keyframes chopHand {
    0%   { transform: translateY(-18px) rotate(-16deg) }
    50%  { transform: translateY(9px) rotate(4deg) }
    100% { transform: translateY(-18px) rotate(-16deg) }
  }
  @keyframes tearLeaf {
    0%,100% { transform: translate(0,0) rotate(0deg) }
    50%     { transform: translate(7px,-4px) rotate(5deg) }
  }
  @keyframes tearLeafR {
    0%,100% { transform: translate(0,0) rotate(0deg) }
    50%     { transform: translate(-7px,-4px) rotate(-5deg) }
  }
  @keyframes massageL {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(12px,-6px) scale(.93,1.05) }
  }
  @keyframes massageR {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(-12px,-6px) scale(.93,1.05) }
  }
  @keyframes risF {
    0%   { transform: translateY(0); opacity: 0 }
    30%  { opacity: .85 }
    100% { transform: translateY(-88px); opacity: 0 }
  }
  @keyframes risSlow {
    0%   { transform: translateY(0) scale(.7); opacity: 0 }
    25%  { opacity: .75 }
    100% { transform: translateY(-108px) scale(1.15); opacity: 0 }
  }
  @keyframes bleedDown {
    0%   { transform: translateY(0) scaleY(.35); opacity: 0 }
    25%  { opacity: .75 }
    100% { transform: translateY(96px) scaleY(1.7); opacity: 0 }
  }
  @keyframes spinFlat { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  @keyframes spinRev { 0%{transform:rotate(0deg)} 100%{transform:rotate(-360deg)} }
  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-7px) }
  }
  @keyframes fadeSlide { 0%{opacity:0;transform:translateY(9px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes pulseRing {
    0%   { transform: scale(.55); opacity: .7 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes clockTick { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(26deg)} }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">BETERRABA + COUVE 1 / 8</div>
  <div class="wm">@seucanal</div>

  <!-- ══════════ CENA 1 — OS DOIS INGREDIENTES ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bBody" cx="34%" cy="28%" r="80%">
        <stop offset="0%"  stop-color="#ff8fa3"/>
        <stop offset="32%" stop-color="#d63a68"/>
        <stop offset="72%" stop-color="#8e1a51"/>
        <stop offset="100%" stop-color="#4d0729"/>
      </radialGradient>
      <linearGradient id="bLeaf" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"  stop-color="#2f4d16"/>
        <stop offset="55%" stop-color="#4a7a1e"/>
        <stop offset="100%" stop-color="#7dab35"/>
      </linearGradient>
      <linearGradient id="kaleLeaf" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"  stop-color="#26401a"/>
        <stop offset="50%" stop-color="#3f6b26"/>
        <stop offset="100%" stop-color="#66943c"/>
      </linearGradient>
      <radialGradient id="floorG" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#cfa3b4" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#cfa3b4" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="405" height="720" fill="#fdf7f9"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b09aa4" font-family="system-ui" letter-spacing="2">OS DOIS INGREDIENTES</text>
    <ellipse cx="202" cy="520" rx="180" ry="60" fill="url(#floorG)"/>

    <!-- beterraba (esquerda) -->
    <g transform="translate(126,378)"><g style="animation:floatUpDown 3.2s ease-in-out infinite">
      <g stroke="url(#bLeaf)" fill="none" stroke-linecap="round" stroke-width="11">
        <path d="M-7,-58 Q-44,-104 -42,-160"/>
        <path d="M0,-60 Q8,-116 -3,-176"/>
        <path d="M7,-58 Q46,-102 46,-156"/>
      </g>
      <g stroke="#8fc245" fill="none" stroke-linecap="round" stroke-width="2.8" opacity=".85">
        <path d="M-7,-58 Q-44,-104 -42,-160"/>
        <path d="M0,-60 Q8,-116 -3,-176"/>
        <path d="M7,-58 Q46,-102 46,-156"/>
      </g>
      <path d="M-10,-48 L-8,-20 L-2,-20 L-4,-48Z" fill="#d63a68"/>
      <path d="M3,-50 L2,-20 L9,-20 L9,-50Z" fill="#b0305e"/>
      <ellipse cx="0" cy="26" rx="66" ry="64" fill="url(#bBody)"/>
      <path d="M-3,88 Q2,110 0,130" stroke="#5c0a34" stroke-width="8" fill="none" stroke-linecap="round"/>
      <ellipse cx="-24" cy="-4" rx="22" ry="17" fill="#ffffff" opacity=".17" transform="rotate(-24 -24 -4)"/>
      <ellipse cx="-17" cy="-14" rx="10" ry="7" fill="#ffffff" opacity=".22" transform="rotate(-24 -17 -14)"/>
      <text x="0" y="150" text-anchor="middle" font-size="16" font-weight="900" fill="#8e1a51" font-family="system-ui">BETERRABA</text>
      <text x="0" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#b09aa4" font-family="system-ui">300 g</text>
    </g></g>

    <!-- couve (direita) -->
    <g transform="translate(288,378)"><g style="animation:floatUpDown 3.2s ease-in-out .6s infinite">
      <!-- folhas grandes e onduladas -->
      <g style="animation:tearLeaf 2.6s ease-in-out infinite">
        <path d="M0,30 Q-62,-20 -54,-96 Q-26,-84 -14,-52 Q-24,-86 -6,-118 Q6,-88 0,-52 Q14,-88 38,-104 Q44,-30 0,30Z"
              fill="url(#kaleLeaf)" stroke="#1f3315" stroke-width="2"/>
        <g stroke="#a3d45c" stroke-width="2" fill="none" opacity=".55">
          <path d="M0,26 Q-22,-24 -34,-80"/>
          <path d="M0,26 Q-2,-30 -6,-106"/>
          <path d="M0,26 Q18,-26 32,-88"/>
        </g>
      </g>
      <g style="animation:tearLeafR 2.6s ease-in-out .4s infinite" opacity=".9">
        <path d="M0,44 Q48,4 42,-58 Q22,-48 12,-24 Q18,-52 4,-74 Q-6,-50 0,-24 Q-12,-52 -30,-64 Q-34,-6 0,44Z"
              fill="#4a7a1e" stroke="#1f3315" stroke-width="1.8"/>
        <g stroke="#8fc245" stroke-width="1.7" fill="none" opacity=".5">
          <path d="M0,40 Q16,0 26,-46"/>
          <path d="M0,40 Q0,-8 -3,-68"/>
        </g>
      </g>
      <!-- talo -->
      <path d="M-5,32 L-3,72 Q0,80 3,72 L5,32Z" fill="#c8dc9c"/>
      <text x="0" y="122" text-anchor="middle" font-size="16" font-weight="900" fill="#3b6d11" font-family="system-ui">COUVE</text>
      <text x="0" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#b09aa4" font-family="system-ui">200 g</text>
    </g></g>

    <g style="animation:fadeSlide .6s ease-out .25s both">
      <rect x="34" y="556" width="337" height="76" rx="6" fill="#8e1a51" opacity=".95"/>
      <text x="202" y="584" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" font-family="system-ui">TOTAL: 500 g</text>
      <text x="202" y="613" text-anchor="middle" font-size="15" font-weight="800" fill="#fbdce8" font-family="system-ui">A BETERRABA TINGE. A COUVE SEGURA.</text>
    </g>
  </svg>

  <!-- ══════════ CENA 2 — LIMPAR A COUVE ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="kaleLeaf2" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"  stop-color="#26401a"/>
        <stop offset="55%" stop-color="#3f6b26"/>
        <stop offset="100%" stop-color="#66943c"/>
      </linearGradient>
      <linearGradient id="waterJet" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8ec9e8" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#c9e6f6" stop-opacity=".3"/>
      </linearGradient>
    </defs>

    <rect width="405" height="720" fill="#e9f0ee"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#7d8f94" font-family="system-ui" letter-spacing="2">LAVANDO A COUVE · TIRA O TALO GROSSO</text>
    <ellipse cx="202" cy="516" rx="172" ry="44" fill="#a8b8bc" opacity=".4"/>

    <!-- pia -->
    <ellipse cx="202" cy="508" rx="168" ry="42" fill="#d6e2e6"/>
    <ellipse cx="202" cy="502" rx="150" ry="32" fill="#c2d3d8"/>

    <!-- jato de água -->
    <g>
      <rect x="272" y="230" width="18" height="112" rx="9" fill="url(#waterJet)"/>
      <rect x="276" y="230" width="10" height="104" rx="5" fill="#c9e6f6" opacity=".8"/>
    </g>

    <!-- folha de couve na água -->
    <g transform="translate(180,404)"><g style="animation:tearLeaf 2.2s ease-in-out infinite">
      <path d="M0,26 Q-56,-18 -48,-86 Q-24,-76 -12,-46 Q-22,-78 -6,-106 Q6,-78 0,-46 Q12,-78 34,-94 Q40,-26 0,26Z"
            fill="url(#kaleLeaf2)" stroke="#1f3315" stroke-width="2"/>
      <g stroke="#a3d45c" stroke-width="1.9" fill="none" opacity=".55">
        <path d="M0,22 Q-20,-22 -30,-72"/>
        <path d="M0,22 Q-2,-28 -6,-96"/>
        <path d="M0,22 Q16,-24 28,-80"/>
      </g>
    </g></g>

    <!-- gotas escorrendo da couve (para BAIXO) -->
    <g>
      <circle cx="150" cy="446" r="4.6" fill="#8ec9e8" opacity=".85" style="animation:risSlow 1.6s linear infinite"/>
      <circle cx="188" cy="456" r="5.2" fill="#8ec9e8" opacity=".85" style="animation:risSlow 1.6s linear infinite .5s"/>
      <circle cx="226" cy="448" r="4.2" fill="#8ec9e8" opacity=".85" style="animation:risSlow 1.6s linear infinite 1s"/>
    </g>

    <!-- mão de criança segurando a folha -->
    <g transform="translate(276,368)"><g style="animation:massageL 1.4s ease-in-out infinite">
      <ellipse cx="-20" cy="-20" rx="10" ry="18" fill="#6b4636" transform="rotate(-30 -20 -20)"/>
      <ellipse cx="-19.5" cy="-27" rx="5" ry="5.8" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="-26" cy="-2" rx="9.5" ry="17" fill="#6b4636" transform="rotate(-16 -26 -2)"/>
      <ellipse cx="-25.5" cy="-9" rx="4.8" ry="5.4" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="-24" cy="18" rx="8.5" ry="15" fill="#6b4636" transform="rotate(-6 -24 18)"/>
      <ellipse cx="-23.5" cy="11" rx="4.4" ry="5" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="0" rx="30" ry="37" fill="#6b4636"/>
      <ellipse cx="0" cy="0" rx="30" ry="37" fill="none" stroke="#4e3125" stroke-width="1.5"/>
      <ellipse cx="13" cy="-30" rx="11" ry="9.5" fill="#6b4636" transform="rotate(18 13 -30)"/>
      <ellipse cx="16" cy="-36" rx="5.5" ry="4.8" fill="#e8c9b8" opacity=".92"/>
    </g></g>

    <g style="animation:fadeSlide .6s ease-out .25s both">
      <rect x="34" y="556" width="337" height="76" rx="6" fill="#2b6a80" opacity=".95"/>
      <text x="202" y="584" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" font-family="system-ui">LAVE E TIRE OS TALOS DUROS</text>
      <text x="202" y="613" text-anchor="middle" font-size="15" font-weight="800" fill="#d5eef7" font-family="system-ui">TALO GROSSO NÃO FERMENTA BEM</text>
    </g>
  </svg>

  <!-- ══════════ CENA 3 — CORTAR OS DOIS ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bCubeTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e07ba5"/>
        <stop offset="100%" stop-color="#b8336a"/>
      </linearGradient>
      <linearGradient id="bCubeFace" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#c4457b"/>
        <stop offset="100%" stop-color="#8e1a51"/>
      </linearGradient>
    </defs>

    <rect width="405" height="720" fill="#f7eff3"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b09aa4" font-family="system-ui" letter-spacing="2">CORTANDO OS DOIS · TAMANHO PARECIDO</text>
    <ellipse cx="202" cy="540" rx="170" ry="44" fill="#c9a7b8" opacity=".35"/>

    <!-- tábua -->
    <rect x="40" y="360" width="325" height="164" rx="14" fill="#e5d6c0" stroke="#cdb9a0" stroke-width="3"/>

    <!-- coluna esquerda: cubos de beterraba -->
    <g transform="translate(118,442)">
      <ellipse cx="0" cy="-72" rx="70" ry="14" fill="#c9a7b8" opacity=".3"/>
      <g>
        <polygon points="-56,-30 -40,-39 -24,-30 -40,-21" fill="url(#bCubeTop)"/>
        <polygon points="-56,-30 -40,-21 -40,4 -56,-5" fill="url(#bCubeFace)"/>
        <polygon points="-24,-30 -40,-21 -40,4 -24,-5" fill="#7d1245"/>
      </g>
      <g>
        <polygon points="-22,-12 -6,-21 10,-12 -6,-3" fill="url(#bCubeTop)"/>
        <polygon points="-22,-12 -6,-3 -6,22 -22,13" fill="url(#bCubeFace)"/>
        <polygon points="10,-12 -6,-3 -6,22 10,13" fill="#7d1245"/>
      </g>
      <g>
        <polygon points="14,-34 30,-43 46,-34 30,-25" fill="url(#bCubeTop)"/>
        <polygon points="14,-34 30,-25 30,0 14,-9" fill="url(#bCubeFace)"/>
        <polygon points="46,-34 30,-25 30,0 46,-9" fill="#7d1245"/>
      </g>
      <g>
        <polygon points="-14,8 2,-1 18,8 2,17" fill="url(#bCubeTop)"/>
        <polygon points="-14,8 2,17 2,42 -14,33" fill="url(#bCubeFace)"/>
        <polygon points="18,8 2,17 2,42 18,33" fill="#7d1245"/>
      </g>
      <text x="0" y="76" text-anchor="middle" font-size="14" font-weight="900" fill="#8e1a51" font-family="system-ui">CUBOS DE 2 CM</text>
    </g>

    <!-- coluna direita: tiras de couve -->
    <g transform="translate(288,442)">
      <ellipse cx="0" cy="-72" rx="60" ry="14" fill="#c9a7b8" opacity=".3"/>
      <g stroke="#1f3315" stroke-width="1.8">
        <path d="M-34,-28 Q0,-38 34,-26 Q36,-6 34,10 Q0,20 -34,12 Q-36,-8 -34,-28Z" fill="#4a7a1e"/>
        <path d="M-30,-12 Q0,-20 30,-10" stroke="#8fc245" stroke-width="2" fill="none" opacity=".6"/>
      </g>
      <g stroke="#1f3315" stroke-width="1.8">
        <path d="M-32,-4 Q0,-14 32,-2 Q34,18 32,34 Q0,44 -32,36 Q-34,16 -32,-4Z" fill="#3f6b26"/>
        <path d="M-28,12 Q0,4 28,14" stroke="#8fc245" stroke-width="2" fill="none" opacity=".6"/>
      </g>
      <g stroke="#1f3315" stroke-width="1.8">
        <path d="M-30,20 Q0,10 30,22 Q32,42 30,58 Q0,68 -30,60 Q-32,40 -30,20Z" fill="#26401a"/>
        <path d="M-26,36 Q0,28 26,38" stroke="#8fc245" stroke-width="2" fill="none" opacity=".6"/>
      </g>
      <text x="0" y="76" text-anchor="middle" font-size="14" font-weight="900" fill="#3b6d11" font-family="system-ui">TIRAS GROSSAS</text>
    </g>

    <!-- faca + mão -->
    <g transform="translate(268,258)"><g style="animation:chopHand .95s ease-in-out infinite">
      <rect x="-6" y="-88" width="12" height="48" rx="5" fill="#4a4a48"/>
      <path d="M-7,-40 L7,-40 L10,24 L-10,24Z" fill="#cfcdc6"/>
      <path d="M-7,-40 L7,-40 L8,-4 L-8,-4Z" fill="#eceae4"/>
      <ellipse cx="-15" cy="-98" rx="8.5" ry="14" fill="#6b4636" transform="rotate(-30 -15 -98)"/>
      <ellipse cx="-14.5" cy="-105" rx="4.5" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="-106" rx="8.5" ry="14" fill="#6b4636" transform="rotate(-12 0 -106)"/>
      <ellipse cx="0" cy="-113" rx="4.5" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="15" cy="-99" rx="8.5" ry="14" fill="#6b4636" transform="rotate(18 15 -99)"/>
      <ellipse cx="16.5" cy="-106" rx="4.5" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="-84" rx="22" ry="17" fill="#6b4636"/>
      <ellipse cx="0" cy="-84" rx="22" ry="17" fill="none" stroke="#4e3125" stroke-width="1.5"/>
    </g></g>

    <g style="animation:fadeSlide .6s ease-out .25s both">
      <rect x="34" y="556" width="337" height="76" rx="6" fill="#6d0f3f" opacity=".95"/>
      <text x="202" y="584" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" font-family="system-ui">CORTE OS DOIS JUNTOS</text>
      <text x="202" y="613" text-anchor="middle" font-size="15" font-weight="800" fill="#fbdce8" font-family="system-ui">BETERRABA EM CUBO, COUVE EM TIRA</text>
    </g>
  </svg>

  <!-- ══════════ CENA 4 — O SAL (2%) ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="sGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ba7517" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#ba7517" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="405" height="720" fill="#fbf5f7"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b09aa4" font-family="system-ui" letter-spacing="2">2% DE SAL · 500 g = 10 g</text>

    <g transform="translate(202,326)">
      <ellipse cx="0" cy="120" rx="140" ry="72" fill="url(#sGlow)"/>
      <ellipse cx="0" cy="70" rx="118" ry="26" fill="#d8c8ce"/>
      <rect x="-110" y="44" width="220" height="28" rx="10" fill="#f3eaee" stroke="#d0bcc3" stroke-width="2"/>
      <ellipse cx="0" cy="44" rx="110" ry="23" fill="#fdf6f8" stroke="#d0bcc3" stroke-width="2"/>

      <!-- tigela com os dois -->
      <g>
        <ellipse cx="0" cy="36" rx="80" ry="21" fill="#fbf5f7"/>

  <div class="ui">
    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pausar</button>
    <button onclick="next()">▶</button>
  </div>

  <div class="cover" id="cover">
    <button onclick="play()">▶</button>
    <p>Beterraba + couve · 8 cenas · 52s</p>
  </div>
</div>

<script>
const scenes = [
  { id:'s0', ms:6000, tag:'BETERRABA + COUVE 1 / 8', cap:'Os dois ingredientes', sub:'300 g de beterraba + 200 g de couve', color:'#8e1a51' },
  { id:'s1', ms:6000, tag:'BETERRABA + COUVE 2 / 8', cap:'Lava e tira os talos', sub:'talo grosso não fermenta bem', color:'#2b6a80' },
  { id:'s2', ms:6500, tag:'BETERRABA + COUVE 3 / 8', cap:'Corta os dois juntos', sub:'beterraba em cubo, couve em tira', color:'#6d0f3f' },
  { id:'s3', ms:6000, tag:'BETERRABA + COUVE 4 / 8', cap:'500 g = 10 g de sal', sub:'sal sem iodo. só isso.', color:'#ba7517' },
  { id:'s4', ms:7000, tag:'BETERRABA + COUVE 5 / 8', cap:'As mãos ficam rosa', sub:'é normal. sai em 2 dias.', color:'#d85a30' },
  { id:'s5', ms:7000, tag:'BETERRABA + COUVE 6 / 8', cap:'Camadas alternadas', sub:'1 dedo de beterraba, 1 de couve', color:'#0f6e56' },
  { id:'s6', ms:7000, tag:'BETERRABA + COUVE 7 / 8', cap:'Uma ajuda a outra', sub:'a couve absorve a cor da beterraba', color:'#3b6d11' },
  { id:'s7', ms:6500, tag:'BETERRABA + COUVE 8 / 8', cap:'10 a 14 dias', sub:'prova no dia 7. se gostar, para.', color:'#2c2c2a' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pausar';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Assistir';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>
