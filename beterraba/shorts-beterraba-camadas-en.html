<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts animado — Beterraba girando (fermentação em camadas)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdf7fa; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .45s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.1); z-index:40; }
  #progress { height:100%; width:0; background:#993556; transition:width .2s linear; }

  .tag {
    position:absolute; top:26px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; opacity:.45; z-index:30; color:#4b1528;
  }
  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.85); color:#fff;
    padding:14px 22px 17px; font-size:15px; font-weight:700;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; }

  .wm { position:absolute; top:22px; right:18px; font-size:10px; font-weight:800;
        letter-spacing:.1em; opacity:.3; z-index:35; text-transform:uppercase; color:#4b1528; }

  .ui { position:absolute; bottom:86px; left:0; right:0; display:flex;
        justify-content:center; gap:10px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.78); color:#fff; font-size:12px;
    font-weight:700; font-family:inherit; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; }
  .cover.hide { display:none; }
  .cover button { width:80px; height:80px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:28px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }

  @keyframes spin3d {
    0%   { transform: rotateY(0deg) }
    100% { transform: rotateY(360deg) }
  }
  @keyframes layerUp {
    0%,100% { transform: translateY(0); opacity: 1 }
    50%     { transform: translateY(-34px); opacity: .85 }
  }
  @keyframes layerDown {
    0%,100% { transform: translateY(0); opacity: 1 }
    50%     { transform: translateY(34px); opacity: .85 }
  }
  @keyframes bubbleUp {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    25%  { opacity: .95 }
    100% { transform: translateY(-120px) scale(1.15); opacity: 0 }
  }
  @keyframes swirl {
    0%   { transform: rotate(0deg) scale(1) }
    50%  { transform: rotate(180deg) scale(1.05) }
    100% { transform: rotate(360deg) scale(1) }
  }
  @keyframes arrowSlide {
    0%,100% { transform: translateX(0); opacity: .9 }
    50%     { transform: translateX(14px); opacity: .45 }
  }
  @keyframes fadeCycle {
    0%,100% { opacity: 1 }
    50%     { opacity: .35 }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">SCENE 1 / 6</div>
  <div class="wm">@yourchannel</div>

  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">

    <rect width="405" height="720" fill="#fbeaf0"/>
    <text x="202" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#72243e" font-family="system-ui">cut into sticks</text>
    <g transform="translate(202,340)">
      <g style="animation:layerUp 2.4s ease-in-out infinite">

          <circle cx="0" cy="-86" r="6"/><circle cx="61" cy="-61" r="6"/>
          <circle cx="86" cy="0" r="6"/><circle cx="61" cy="61" r="6"/>
          <circle cx="0" cy="86" r="6"/><circle cx="-61" cy="61" r="6"/>
          <circle cx="-86" cy="0" r="6"/><circle cx="-61" cy="-61" r="6"/>

      </g>
      <g style="animation:swirl 2.4s linear infinite reverse">
        <g fill="#d4537e" opacity=".65">
          <circle cx="0" cy="-48" r="7"/><circle cx="34" cy="-34" r="7"/>
          <circle cx="48" cy="0" r="7"/><circle cx="34" cy="34" r="7"/>
          <circle cx="0" cy="48" r="7"/><circle cx="-34" cy="34" r="7"/>
          <circle cx="-48" cy="0" r="7"/><circle cx="-34" cy="-34" r="7"/>

      </g>
      <circle cx="0" cy="0" r="30" fill="#993556"/>

    <text x="202" y="108" text-anchor="middle" font-size="17" font-weight="800" fill="#72243e" font-family="system-ui">the bacteria work</text>
    <g transform="translate(202,336)">

          <circle cx="108" cy="0" r="5.5"/><circle cx="76" cy="76" r="5.5"/>
          <circle cx="0" cy="108" r="5.5"/><circle cx="-76" cy="76" r="5.5"/>
          <circle cx="-108" cy="0" r="5.5"/><circle cx="-76" cy="-76" r="5.5"/>

      </g>
      <g style="animation:swirl 5.5s linear infinite reverse">
        <g fill="#1d9e75" opacity=".8">
          <circle cx="0" cy="-66" r="6.5"/><circle cx="47" cy="-47" r="6.5"/>
          <circle cx="66" cy="0" r="6.5"/><circle cx="47" cy="47" r="6.5"/>
          <circle cx="0" cy="66" r="6.5"/><circle cx="-47" cy="47" r="6.5"/>
          <circle cx="-66" cy="0" r="6.5"/><circle cx="-47" cy="-47" r="6.5"/>
        </g>
      </g>
      <g style="animation:swirl 3.2s linear infinite">
        <g fill="#0f6e56" opacity=".85">
          <circle cx="0" cy="-30" r="7.5"/><circle cx="21" cy="-21" r="7.5"/>
          <circle cx="30" cy="0" r="7.5"/><circle cx="21" cy="21" r="7.5"/>
          <circle cx="0" cy="30" r="7.5"/><circle cx="-21" cy="21" r="7.5"/>
          <circle cx="-30" cy="0" r="7.5"/><circle cx="-21" cy="-21" r="7.5"/>

    <text x="202" y="580" text-anchor="middle" font-size="16" font-weight="600" fill="#993556" font-family="system-ui">they eat the sugar and release acid</text>
  </svg>

  <svg class="scene" id="s4" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fdf7fa"/>
    <text x="202" y="108" text-anchor="middle" font-size="17" font-weight="800" fill="#72243e" font-family="system-ui">the colour spreads</text>
    <g transform="translate(202,340)">
      <path d="M-92,120 L-92,-56 Q-92,-80 -66,-80 L66,-80 Q92,-80 92,-56 L92,120 Z"

      <g>
        <path d="M-92,90 L-92,20 Q-92,4 -76,4 L76,4 Q92,4 92,20 L92,90 Z" fill="#f4c0d1">
          <animate attributeName="opacity" values="0;0.35;0.7;0.95" dur="5s" repeatCount="indefinite"/>

      </g>
      <g>

        <path d="M-92,34 L-92,0 Q-92,-16 -76,-16 L76,-16 Q92,-16 92,0 L92,34 Z" fill="#993556">
          <animate attributeName="opacity" values="0;0.2;0.55;0.85" dur="5s" begin="2s" repeatCount="indefinite"/>
        </path>

        <path d="M-34,-42 L-10,-42 L-14,58 L-30,58Z" transform="rotate(5 -22 8)"/>
        <path d="M4,-32 L28,-32 L24,50 L8,50Z" transform="rotate(-4 16 9)"/>

    <text x="202" y="596" text-anchor="middle" font-size="16" font-weight="600" fill="#993556" font-family="system-ui">from light pink to deep purple</text>

  <svg class="scene" id="s5" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fbeaf0"/>
    <text x="202" y="104" text-anchor="middle" font-size="17" font-weight="800" fill="#72243e" font-family="system-ui">just right</text>
    <g transform="translate(202,330)">
      <rect x="-96" y="-140" width="192" height="280" rx="18" fill="#fdf7fa" stroke="#993556" stroke-width="4"/>
      <rect x="-84" y="-128" width="168" height="70" rx="10" fill="#f4c0d1" opacity=".7"/>
      <rect x="-84" y="-48" width="168" height="70" rx="10" fill="#d4537e" opacity=".75"/>
      <rect x="-84" y="32" width="168" height="70" rx="10" fill="#993556" opacity=".8"/>
      <g style="animation:bubbleUp 2s ease-out infinite">
        <circle cx="-50" cy="90" r="6" fill="#fff" opacity=".9"/>
        <circle cx="-10" cy="100" r="5" fill="#fff" opacity=".9"/>
        <circle cx="34" cy="92" r="5.5" fill="#fff" opacity=".9"/>
      </g>
      <g style="animation:bubbleUp 2s ease-out .7s infinite">
        <circle cx="-30" cy="106" r="5.5" fill="#fff" opacity=".75"/>
        <circle cx="16" cy="112" r="6.5" fill="#fff" opacity=".75"/>
      </g>
      <g style="animation:bubbleUp 2s ease-out 1.3s infinite">
        <circle cx="-4" cy="118" r="5" fill="#fff" opacity=".6"/>
      </g>
      <path d="M118,86 L152,86" stroke="#3b6d11" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="158" cy="86" r="7" fill="#639922" style="animation:fadeCycle 1.6s ease-in-out infinite"/>
    </g>
    <text x="202" y="592" text-anchor="middle" font-size="16" font-weight="600" fill="#993556" font-family="system-ui">a little sour, crunchy, with bubbles</text>
  </svg>

  <div class="cap" id="cap">The beet from the inside<small>what happens over the 7 days</small></div>

  <div class="ui">
    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pause</button>
    <button onclick="next()">▶</button>
  </div>

  <div class="cover" id="cover"><button onclick="play()">▶</button></div>
</div>

<script>
const scenes = [
  { id:'s0', ms:4200, tag:'SCENE 1 / 6', cap:'The beet from the inside', sub:'what happens over the 7 days', color:'#993556' },
  { id:'s1', ms:5000, tag:'SCENE 2 / 6', cap:'4 layers, from the outside in', sub:'skin, flesh, colour and sugar', color:'#72243e' },
  { id:'s2', ms:5000, tag:'SCENE 3 / 6', cap:'The salt pulls the water from inside', sub:'and it turns into its own brine', color:'#993556' },
  { id:'s3', ms:5200, tag:'SCENE 4 / 6', cap:'The bacteria eat the sugar', sub:'and turn it into lactic acid', color:'#0f6e56' },
  { id:'s4', ms:5400, tag:'SCENE 5 / 6', cap:'The colour spreads through the brine', sub:'from light pink to deep purple', color:'#993556' },
  { id:'s5', ms:5200, tag:'SCENE 6 / 6', cap:'It is ready', sub:'a little sour, crunchy, with bubbles', color:'#72243e' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Watch';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
</body>
</html>
