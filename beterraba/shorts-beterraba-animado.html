<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts animado — Beterraba fermentada</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdf7fa; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .5s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.1); z-index:40; }
  #progress { height:100%; width:0; background:#993556; transition:width .2s linear; }

  .tag {
    position:absolute; top:26px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; opacity:.45; z-index:30; color:#4b1528;
  }
  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.84); color:#fff;
    padding:14px 22px 17px; font-size:15px; font-weight:700;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.7; margin-top:4px; }

  .wm { position:absolute; top:22px; right:18px; font-size:10px; font-weight:800;
        letter-spacing:.1em; opacity:.3; z-index:35; text-transform:uppercase; color:#4b1528; }

  .ui { position:absolute; bottom:86px; left:0; right:0; display:flex;
        justify-content:center; gap:10px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.78); color:#fff; font-size:12px;
    font-weight:700; font-family:inherit; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; }
  .cover.hide { display:none; }
  .cover button { width:80px; height:80px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:28px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }

  @keyframes chop { 0%,100%{transform:rotate(-13deg)} 50%{transform:rotate(6deg)} }
  @keyframes rise { 0%{transform:translateY(0);opacity:0} 30%{opacity:.85} 100%{transform:translateY(-92px);opacity:0} }
  @keyframes bleed { 0%{transform:scale(.7);opacity:0} 40%{opacity:.6} 100%{transform:scale(1.5);opacity:0} }
  @keyframes tick { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  @keyframes drop { 0%{transform:translateY(-14px);opacity:0} 100%{transform:translateY(0);opacity:1} }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">CENA 1 / 7</div>
  <div class="wm">@seucanal</div>

  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fbeaf0"/>
    <circle cx="202" cy="300" r="140" fill="#f4c0d1" opacity=".55"/>
    <g transform="translate(202,300)">
      <ellipse cx="0" cy="6" rx="86" ry="96" fill="#993556"/>
      <ellipse cx="-14" cy="-24" rx="42" ry="46" fill="#d4537e" opacity=".55"/>
      <path d="M-4,-96 Q-8,-124 -22,-138" stroke="#72243e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M4,-96 Q10,-126 26,-136" stroke="#72243e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M-26,-138 L-30,-152 M-22,-138 L-14,-152 M-24,-138 L-24,-154"
            stroke="#639922" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M26,-136 L22,-150 M30,-136 L38,-150 M28,-136 L28,-152"
            stroke="#97c459" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-60,-30 Q-68,30 -54,72" stroke="#4b1528" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"/>
      <path d="M-20,20 Q0,40 24,16" stroke="#4b1528" stroke-width="3" fill="none" opacity=".3" stroke-linecap="round"/>
      <ellipse cx="-30" cy="-40" rx="14" ry="30" fill="#fff" opacity=".22"/>
    </g>
    <g transform="translate(300,192)">
      <rect x="-5" y="0" width="10" height="50" rx="4" fill="#5f5e5a" style="animation:chop 1.1s ease-in-out infinite"/>
      <path d="M-4,50 L4,50 L6,118 L-6,118Z" fill="#b4b2a9" style="animation:chop 1.1s ease-in-out infinite"/>
    </g>
  </svg>

  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fbeaf0"/>
    <ellipse cx="202" cy="530" rx="170" ry="40" fill="#ed93b1" opacity=".3"/>
    <g transform="translate(140,290)">
      <ellipse cx="0" cy="0" rx="52" ry="46" fill="#d4537e"/>
      <ellipse cx="0" cy="-6" rx="42" ry="36" fill="#fbeaf0"/>
      <path d="M-4,-72 Q-8,-96 -22,-108" stroke="#72243e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M4,-72 Q10,-98 24,-108" stroke="#72243e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g style="animation:chop 1.4s ease-in-out infinite">
        <rect x="-24" y="-30" width="48" height="8" rx="3" fill="#993556"/>
      </g>
      <circle cx="0" cy="16" r="10" fill="#993556" opacity=".45" style="animation:bleed 1.8s ease-out infinite"/>
    </g>
    <g transform="translate(292,290)">
      <rect x="-17" y="-92" width="34" height="176" rx="12" fill="#993556"/>
      <ellipse cx="0" cy="-84" rx="15" ry="8" fill="#f4c0d1"/>
      <path d="M-17,-30 L17,-30 M-17,0 L17,0 M-17,30 L17,30 M-17,60 L17,60"
            stroke="#d4537e" stroke-width="3" opacity=".55"/>
      <path d="M-9,-92 L-9,84" stroke="#fff" stroke-width="5" opacity=".25" stroke-linecap="round"/>
      <circle cx="0" cy="92" r="6" fill="#993556" opacity=".4"/>
    </g>
    <g style="animation:drop 1.4s ease-out infinite">
      <circle cx="196" cy="120" r="4" fill="#d4537e" opacity=".7"/>
      <circle cx="214" cy="108" r="3.4" fill="#d4537e" opacity=".7"/>
      <circle cx="182" cy="106" r="3" fill="#d4537e" opacity=".7"/>
    </g>
  </svg>

  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fdf7fa"/>
    <ellipse cx="202" cy="530" rx="150" ry="34" fill="#f4c0d1" opacity=".45"/>
    <g transform="translate(120,300)">
      <ellipse cx="0" cy="0" rx="46" ry="52" fill="#993556"/>
      <ellipse cx="-10" cy="-14" rx="20" ry="24" fill="#d4537e" opacity=".5"/>
      <text x="0" y="112" text-anchor="middle" font-size="22" font-weight="800" fill="#72243e" font-family="system-ui">300 g</text>
    </g>
    <g transform="translate(202,300)">
      <path d="M-12,0 L12,0" stroke="#5f5e5a" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(288,300)">
      <path d="M-46,-38 L46,-38 L40,84 Q0,98 -40,84Z" fill="#fff" stroke="#993556" stroke-width="3.5"/>
      <rect x="-40" y="-28" width="80" height="13" rx="4" fill="#f4c0d1"/>
      <text x="0" y="24" text-anchor="middle" font-size="30" font-weight="800" fill="#72243e" font-family="system-ui">6 g</text>
      <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#72243e" font-family="system-ui">de sal</text>
    </g>
  </svg>

  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fbeaf0"/>
    <circle cx="202" cy="280" r="126" fill="#ed93b1" opacity=".4"/>
    <g transform="translate(202,280)">
      <path d="M-104,-60 Q0,-96 104,-60 L96,-30 Q0,-62 -96,-30Z" fill="#993556"/>
      <path d="M-96,-30 Q0,-62 96,-30 L88,10 Q0,-20 -88,10Z" fill="#d4537e"/>
      <path d="M-88,10 Q0,-20 88,10 L78,50 Q0,22 -78,50Z" fill="#993556"/>
      <circle cx="-52" cy="-56" r="13" fill="#d4537e" style="animation:bleed 2.2s ease-out infinite"/>
      <circle cx="30" cy="-40" r="10" fill="#d4537e" style="animation:bleed 2.2s ease-out .8s infinite"/>
      <circle cx="70" cy="-14" r="12" fill="#d4537e" style="animation:bleed 2.2s ease-out 1.5s infinite"/>
    </g>
    <text x="202" y="452" text-anchor="middle" font-size="24" font-weight="800" fill="#72243e" font-family="system-ui">Tinge tudo de roxo</text>
    <text x="202" y="484" text-anchor="middle" font-size="15" font-weight="600" fill="#993556" font-family="system-ui">a cor sai na água e vira salmoura</text>
  </svg>

  <svg class="scene" id="s4" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fbeaf0"/>
    <g transform="translate(202,300)">
      <path d="M-104,110 L-104,-40 Q-104,-58 -86,-58 L86,-58 Q104,-58 104,-40 L104,110 Z"
            fill="#fff" stroke="#993556" stroke-width="4"/>
      <rect x="-104" y="-58" width="208" height="24" rx="6" fill="#f4c0d1" stroke="#993556" stroke-width="4"/>
      <path d="M-104,40 L-104,-14 Q-104,-30 -86,-30 L86,-30 Q104,-30 104,-14 L104,40 Z" fill="#993556" opacity=".9"/>
      <g fill="#d4537e">
        <path d="M-88,-6 L-66,-6 L-70,64 L-84,64Z" transform="rotate(-8 -77 29)"/>
        <path d="M-56,-16 L-34,-16 L-38,74 L-52,74Z" transform="rotate(5 -45 29)"/>
        <path d="M-20,-8 L2,-8 L-2,68 L-16,68Z" transform="rotate(-3 -9 30)"/>
        <path d="M14,-18 L36,-18 L32,76 L18,76Z" transform="rotate(7 25 29)"/>
        <path d="M48,-4 L70,-4 L66,66 L52,66Z" transform="rotate(-6 59 31)"/>
      </g>
      <g style="animation:rise 2.1s ease-out infinite">
        <circle cx="-58" cy="26" r="5" fill="#fff" opacity=".7"/>
        <circle cx="-20" cy="36" r="4" fill="#fff" opacity=".7"/>
        <circle cx="22" cy="30" r="4.5" fill="#fff" opacity=".7"/>
        <circle cx="58" cy="38" r="3.6" fill="#fff" opacity=".7"/>
      </g>
      <g style="animation:rise 2.1s ease-out .7s infinite">
        <circle cx="-38" cy="40" r="4" fill="#fff" opacity=".6"/>
        <circle cx="4" cy="44" r="5" fill="#fff" opacity=".6"/>
        <circle cx="44" cy="40" r="3.4" fill="#fff" opacity=".6"/>
      </g>
    </g>
  </svg>

  <svg class="scene" id="s5" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#f1efe8"/>
    <circle cx="202" cy="300" r="132" fill="#d3d1c7" opacity=".4"/>
    <g transform="translate(202,300)">
      <g style="animation:tick 2.4s ease-in-out infinite">
        <circle cx="0" cy="0" r="96" fill="#fff" stroke="#5f5e5a" stroke-width="4"/>
        <path d="M0,-96 L0,0 L64,72" stroke="#5f5e5a" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M0,0 L-56,-62" stroke="#888780" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <circle cx="0" cy="0" r="7" fill="#5f5e5a"/>
      </g>
    </g>
    <g transform="translate(202,466)">
      <rect x="-116" y="-32" width="232" height="64" rx="12" fill="#fbeaf0" stroke="#993556" stroke-width="3"/>
      <text x="0" y="9" text-anchor="middle" font-size="21" font-weight="800" fill="#72243e" font-family="system-ui">7 A 10 DIAS</text>
    </g>
  </svg>

  <svg class="scene" id="s6" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fbeaf0"/>
    <circle cx="202" cy="278" r="130" fill="#f4c0d1" opacity=".55"/>
    <g transform="translate(202,278)">
      <circle cx="0" cy="0" r="82" fill="#fff" stroke="#993556" stroke-width="4"/>
      <path d="M-32,4 L-8,30 L34,-24" stroke="#72243e" stroke-width="11" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(202,444)">
      <text x="0" y="0" text-anchor="middle" font-size="25" font-weight="800" fill="#4b1528" font-family="system-ui">Roxa e azedinha</text>
      <text x="0" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#993556" font-family="system-ui">fica linda em cima da salada</text>
    </g>
  </svg>

  <div class="cap" id="cap">Vou fermentar beterraba<small>e volto em 7 dias</small></div>

  <div class="ui">
    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pausar</button>
    <button onclick="next()">▶</button>
  </div>

  <div class="cover" id="cover"><button onclick="play()">▶</button></div>
</div>

<script>
const scenes = [
  { id:'s0', ms:4400, tag:'CENA 1 / 7', cap:'Vou fermentar beterraba', sub:'e volto em 7 dias', color:'#993556' },
  { id:'s1', ms:4400, tag:'CENA 2 / 7', cap:'Primeiro: descascar', sub:'cuidado, ela tinge a mão', color:'#d4537e' },
  { id:'s2', ms:4600, tag:'CENA 3 / 7', cap:'Sal é 2% do peso', sub:'300 g de beterraba = 6 g de sal', color:'#72243e' },
  { id:'s3', ms:4800, tag:'CENA 4 / 7', cap:'A cor sai na água', sub:'é isso que tinge a salmoura', color:'#993556' },
  { id:'s4', ms:5000, tag:'CENA 5 / 7', cap:'Prensa tudo no pote', sub:'o líquido precisa cobrir tudo', color:'#993556' },
  { id:'s5', ms:4600, tag:'CENA 6 / 7', cap:'Agora é só esperar', sub:'de 7 a 10 dias — ela é mais lenta', color:'#5f5e5a' },
  { id:'s6', ms:5000, tag:'CENA 7 / 7', cap:'Ficou pronta', sub:'crocante, azedinha e roxa', color:'#72243e' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 80;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pausar';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Assistir';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

</body>
</html>
