<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animação — Fermentação de Couve-flor</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#f4f1e8; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#8a9a3b; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; }

  @keyframes splitApart {
    0%   { transform: translate(0,0) rotate(0deg) }
    50%  { transform: translate(-38px,-8px) rotate(-14deg) }
    100% { transform: translate(0,0) rotate(0deg) }
  }
  @keyframes splitApartR {
    0%   { transform: translate(0,0) rotate(0deg) }
    50%  { transform: translate(38px,-8px) rotate(14deg) }
    100% { transform: translate(0,0) rotate(0deg) }
  }
  @keyframes massageL {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(12px,-6px) scale(.93,1.05) }
  }
  @keyframes massageR {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(-12px,-6px) scale(.93,1.05) }
  }
  @keyframes pressDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(15px) }
  }
  @keyframes rub {
    0%,100% { transform: translateX(-10px) rotate(-4deg) }
    50%     { transform: translateX(10px) rotate(4deg) }
  }
  @keyframes riseF {
    0%   { transform: translateY(0); opacity: 0 }
    30%  { opacity: .85 }
    100% { transform: translateY(-88px); opacity: 0 }
  }
  @keyframes riseSlow {
    0%   { transform: translateY(0) scale(.7); opacity: 0 }
    25%  { opacity: .75 }
    100% { transform: translateY(-108px) scale(1.15); opacity: 0 }
  }
  @keyframes spin3d {
    0%   { transform: rotateY(0deg) }
    100% { transform: rotateY(360deg) }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.6); opacity: .75 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-7px) }
  }
  @keyframes fadeSlide { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes clockTick { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(28deg)} }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">COUVE-FLOR 1 / 7</div>
  <div class="wm">@seucanal</div>

  <!-- ══════════ CENA 1 — A COUVE-FLOR INTEIRA ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#eef3e2"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#8a9270" font-family="system-ui" letter-spacing="2">VISTA DE CIMA · A COUVE-FLOR</text>
    <ellipse cx="202" cy="500" rx="170" ry="46" fill="#c3c9a8" opacity=".4"/>

    <g transform="translate(202,378)"><g style="animation:floatUpDown 3s ease-in-out infinite">
      <!-- folhas verdes por baixo -->
      <path d="M-88,30 Q-104,-8 -78,-30 Q-58,-14 -60,26Z" fill="#6f8f3c"/>
      <path d="M88,30 Q104,-8 78,-30 Q58,-14 60,26Z" fill="#6f8f3c"/>
      <path d="M-46,44 Q-52,6 -28,-12 Q-12,10 -18,44Z" fill="#82a44a"/>
      <path d="M46,44 Q52,6 28,-12 Q12,10 18,44Z" fill="#82a44a"/>

      <!-- massa de floretes (nuvem de círculos) -->
      <g>
        <circle cx="-58" cy="34" r="34" fill="#f6f4e8"/>
        <circle cx="58" cy="34" r="34" fill="#f6f4e8"/>
        <circle cx="-46" cy="-4" r="38" fill="#faf8ee"/>
        <circle cx="46" cy="-4" r="38" fill="#faf8ee"/>
        <circle cx="-30" cy="44" r="36" fill="#f2efe0"/>
        <circle cx="30" cy="44" r="36" fill="#f2efe0"/>
        <circle cx="0" cy="-28" r="36" fill="#fdfbf4"/>
        <circle cx="0" cy="14" r="40" fill="#faf8ee"/>
        <circle cx="-74" cy="6" r="22" fill="#efeadd"/>
        <circle cx="74" cy="6" r="22" fill="#efeadd"/>
      </g>
      <!-- sombrinhas das ramificações -->
      <g fill="none" stroke="#ded8c4" stroke-width="1.6" opacity=".9">
        <path d="M-30,-6 Q-14,10 0,-2"/>
        <path d="M30,-6 Q14,10 0,-2"/>
        <path d="M-16,26 Q0,36 16,26"/>
        <path d="M-38,-18 Q-18,-4 0,-14"/>
        <path d="M38,-18 Q18,-4 0,-14"/>
      </g>
      <!-- talo -->
      <path d="M-16,68 L-13,110 Q0,118 13,110 L16,68Z" fill="#cfe0a8"/>
      <path d="M-10,74 L-8,106" stroke="#a8c47c" stroke-width="2" fill="none"/>
    </g></g>

    <g style="animation:fadeSlide .6s ease-out .25s both">
      <rect x="34" y="576" width="337" height="52" rx="6" fill="#5c7a29" opacity=".95"/>
      <text x="202" y="598" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="system-ui">COUVE-FLOR EM CONSERVA</text>
      <text x="202" y="619" text-anchor="middle" font-size="16" font-weight="800" fill="#eaf3de" font-family="system-ui">SÓ O FLORETE. SEM AS FOLHAS.</text>
    </g>
  </svg>

  <!-- ══════════ CENA 2 — SEPARANDO OS FLORETES ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#e9efe0"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#869175" font-family="system-ui" letter-spacing="2">QUEBRANDO COM A MÃO · NÃO COM A FACA</text>
    <ellipse cx="202" cy="520" rx="164" ry="42" fill="#c3c9a8" opacity=".4"/>

    <g transform="translate(202,400)">
      <!-- cabeça inteira -->
      <g>
        <circle cx="-26" cy="6" r="30" fill="#f6f4e8"/>
        <circle cx="26" cy="6" r="30" fill="#f6f4e8"/>
        <circle cx="0" cy="-20" r="32" fill="#faf8ee"/>
        <circle cx="0" cy="20" r="31" fill="#f2efe0"/>
        <circle cx="0" cy="0" r="30" fill="#fdfbf4"/>
      </g>
      <!-- florinhas se separando (esquerda e direita) -->
      <g style="animation:splitApart 2.2s ease-in-out infinite">
        <circle cx="-84" cy="-14" r="19" fill="#faf8ee" stroke="#e6e2d2" stroke-width="1.4"/>
        <circle cx="-92" cy="8" r="13" fill="#f4f1e4"/>
      </g>
      <g style="animation:splitApartR 2.2s ease-in-out infinite">
        <circle cx="84" cy="-14" r="19" fill="#faf8ee" stroke="#e6e2d2" stroke-width="1.4"/>
        <circle cx="92" cy="8" r="13" fill="#f4f1e4"/>
      </g>
      <!-- uma florinha caindo -->
      <circle cx="-30" cy="86" r="15" fill="#faf8ee" stroke="#e6e2d2" stroke-width="1.4" style="animation:floatUpDown 1.6s ease-in-out infinite"/>
    </g>

    <!-- mãos de criança quebrando -->
    <g transform="translate(122,352)"><g style="animation:massageL 1.4s ease-in-out infinite">
      <ellipse cx="18" cy="-18" rx="10" ry="17" fill="#6b4636" transform="rotate(28 18 -18)"/>
      <ellipse cx="17.5" cy="-25" rx="5" ry="5.5" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="24" cy="0" rx="9.5" ry="15" fill="#6b4636" transform="rotate(16 24 0)"/>
      <ellipse cx="23.5" cy="-7" rx="4.8" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="0" rx="29" ry="25" fill="#6b4636"/>
      <ellipse cx="0" cy="0" rx="29" ry="25" fill="none" stroke="#4e3125" stroke-width="1.5"/>
      <ellipse cx="-12" cy="-21" rx="10.5" ry="8.5" fill="#6b4636" transform="rotate(-20 -12 -21)"/>
      <ellipse cx="-15" cy="-27" rx="5.2" ry="4.2" fill="#e8c9b8" opacity=".92"/>
    </g></g>
    <g transform="translate(282,352)"><g style="animation:massageR 1.4s ease-in-out infinite">
      <ellipse cx="-18" cy="-18" rx="10" ry="17" fill="#6b4636" transform="rotate(-28 -18 -18)"/>
      <ellipse cx="-17.5" cy="-25" rx="5" ry="5.5" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="-24" cy="0" rx="9.5" ry="15" fill="#6b4636" transform="rotate(-16 -24 0)"/>
      <ellipse cx="-23.5" cy="-7" rx="4.8" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="0" rx="29" ry="25" fill="#6b4636"/>
      <ellipse cx="0" cy="0" rx="29" ry="25" fill="none" stroke="#4e3125" stroke-width="1.5"/>
      <ellipse cx="12" cy="-21" rx="10.5" ry="8.5" fill="#6b4636" transform="rotate(20 12 -21)"/>
      <ellipse cx="15" cy="-27" rx="5.2" ry="4.2" fill="#e8c9b8" opacity=".92"/>
    </g></g>

    <g style="animation:fadeSlide .6s ease-out .25s both">
      <rect x="34" y="576" width="337" height="52" rx="6" fill="#5c7a29" opacity=".95"/>
      <text x="202" y="598" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="system-ui">QUEBRA COM A MÃO</text>
      <text x="202" y="619" text-anchor="middle" font-size="16" font-weight="800" fill="#eaf3de" font-family="system-ui">PEDAÇOS PEQUENOS E IGUAIS</text>
    </g>
  </svg>

  <!-- ══════════ CENA 3 — MEDINDO E SALGANDO ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#ede9dc"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#94907c" font-family="system-ui" letter-spacing="2">REGRA DOS 2,5% DE SAL</text>

    <!-- balança -->
    <g transform="translate(202,300)">
      <ellipse cx="0" cy="66" rx="112" ry="24" fill="#d8d3c0"/>
      <rect x="-104" y="42" width="208" height="26" rx="10" fill="#e8e4d2" stroke="#c2bda6" stroke-width="2"/>
      <ellipse cx="0" cy="42" rx="104" ry="22" fill="#f4f1e4" stroke="#c2bda6" stroke-width="2"/>
      <!-- tigela com floretes -->
      <g>
        <ellipse cx="0" cy="34" rx="76" ry="20" fill="#faf8ee"/>
        <circle cx="-44" cy="24" r="20" fill="#faf8ee" stroke="#e6e2d2" stroke-width="1.3"/>
        <circle cx="-6" cy="14" r="22" fill="#fdfbf4"/>
        <circle cx="34" cy="24" r="20" fill="#faf8ee" stroke="#e6e2d2" stroke-width="1.3"/>
        <circle cx="-24" cy="34" r="19" fill="#f2efe0"/>
        <circle cx="22" cy="36" r="18" fill="#f6f4e8"/>
      </g>
      <!-- visor digital -->
      <rect x="-62" y="76" width="124" height="36" rx="6" fill="#2c2c2a"/>
      <text x="0" y="102" text-anchor="middle" font-size="24" font-weight="900" fill="#c0dd97" font-family="monospace">500 g</text>
      <rect x="-16" y="120" width="32" height="14" rx="4" fill="#c2bda6"/>
    </g>

    <!-- mão jogando o sal -->
    <g transform="translate(320,236)"><g style="animation:rub 1.3s ease-in-out infinite">
      <ellipse cx="-18" cy="-16" rx="9" ry="15" fill="#6b4636" transform="rotate(-30 -18 -16)"/>
      <ellipse cx="-17.5" cy="-23" rx="4.6" ry="5" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="-24" cy="0" rx="8.5" ry="14" fill="#6b4636" transform="rotate(-16 -24 0)"/>
      <ellipse cx="-23.5" cy="-6" rx="4.4" ry="4.8" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="0" rx="27" ry="22" fill="#6b4636"/>
      <ellipse cx="0" cy="0" rx="27" ry="22" fill="none" stroke="#4e3125" stroke-width="1.5"/>
      <ellipse cx="11" cy="-19" rx="10" ry="8" fill="#6b4636" transform="rotate(20 11 -19)"/>
      <ellipse cx="14" cy="-25" rx="5" ry="4" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="-18" rx="17" ry="7" fill="#fff"/>
    </g></g>
    <!-- cristais caindo -->
    <g>
      <circle cx="300" cy="272" r="3" fill="#fff" stroke="#cfc7b6" stroke-width="1" style="animation:riseF 1.1s ease-out infinite"/>
      <circle cx="318" cy="280" r="2.6" fill="#fff" stroke="#cfc7b6" stroke-width="1" style="animation:riseF 1.1s ease-out .35s infinite"/>
      <circle cx="334" cy="272" r="3" fill="#fff" stroke="#cfc7b6" stroke-width="1" style="animation:riseF 1.1s ease-out .7s infinite"/>
    </g>

    <g style="animation:fadeSlide .6s ease-out .25s both">
      <rect x="34" y="576" width="337" height="52" rx="6" fill="#ba7517" opacity=".95"/>
      <text x="202" y="598" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="system-ui">500 g = 12,5 g DE SAL</text>
      <text x="202" y="619" text-anchor="middle" font-size="16" font-weight="800" fill="#faeeda" font-family="system-ui">NÃO USE SAL COM IODO</text>
    </g>
  </svg>

  <!-- ══════════ CENA 4 — MASSAGEANDO ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#f0e9d8"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#9c9179" font-family="system-ui" letter-spacing="2">A CENA MAIS IMPORTANTE · 8 MIN</text>
    <ellipse cx="202" cy="512" rx="172" ry="46" fill="#c8bda2" opacity=".4"/>

    <g transform="translate(202,392)">
      <!-- bacia com floretes -->
      <ellipse cx="0" cy="10" rx="104" ry="58" fill="#faf8ee" opacity=".95"/>
      <ellipse cx="0" cy="10" rx="90" ry="48" fill="#f2efe0"/>
      <g>
        <circle cx="-46" cy="4" r="24" fill="#fdfbf4"/>
        <circle cx="44" cy="0" r="24" fill="#fdfbf4"/>
        <circle cx="0" cy="-18" r="22" fill="#faf8ee"/>
        <circle cx="-14" cy="24" r="22" fill="#f6f4e8"/>
        <circle cx="20" cy="26" r="21" fill="#f6f4e8"/>
      </g>

      <!-- as duas mãos massageando -->
      <g transform="translate(-72,-50)"><g style="animation:massageL 1.05s ease-in-out infinite">
        <ellipse cx="-24" cy="-22" rx="11" ry="18" fill="#6b4636" transform="rotate(-28 -24 -22)"/>
        <ellipse cx="-23" cy="-29" rx="5.2" ry="5.8" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="-30" cy="-2" rx="10" ry="17" fill="#6b4636" transform="rotate(-16 -30 -2)"/>
        <ellipse cx="-29" cy="-9" rx="5" ry="5.4" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="-27" cy="18" rx="9" ry="15" fill="#6b4636" transform="rotate(-6 -27 18)"/>
        <ellipse cx="-26" cy="11" rx="4.6" ry="5" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="#6b4636"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="none" stroke="#4e3125" stroke-width="1.5"/>
        <ellipse cx="14" cy="-28" rx="12" ry="10" fill="#6b4636" transform="rotate(20 14 -28)"/>
        <ellipse cx="17" cy="-34" rx="6" ry="5" fill="#e8c9b8" opacity=".92"/>
      </g></g>
      <g transform="translate(72,-50)"><g style="animation:massageR 1.05s ease-in-out .5s infinite">
        <ellipse cx="24" cy="-22" rx="11" ry="18" fill="#6b4636" transform="rotate(28 24 -22)"/>
        <ellipse cx="23" cy="-29" rx="5.2" ry="5.8" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="30" cy="-2" rx="10" ry="17" fill="#6b4636" transform="rotate(16 30 -2)"/>
        <ellipse cx="29" cy="-9" rx="5" ry="5.4" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="27" cy="18" rx="9" ry="15" fill="#6b4636" transform="rotate(6 27 18)"/>
        <ellipse cx="26" cy="11" rx="4.6" ry="5" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="#6b4636"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="none" stroke="#4e3125" stroke-width="1.5"/>
        <ellipse cx="-14" cy="-28" rx="12" ry="10" fill="#6b4636" transform="rotate(-20 -14 -28)"/>
        <ellipse cx="-17" cy="-34" rx="6" ry="5" fill="#e8c9b8" opacity=".92"/>
      </g></g>

      <!-- gotas saindo -->
      <g style="animation:riseF 1.5s ease-out infinite">
        <circle cx="-58" cy="66" r="6" fill="#8ec9e8" opacity=".85"/>
        <circle cx="-14" cy="80" r="5.2" fill="#8ec9e8" opacity=".85"/>
        <circle cx="28" cy="72" r="5.6" fill="#8ec9e8" opacity=".85"/>
        <circle cx="62" cy="84" r="4.6" fill="#8ec9e8" opacity=".85"/>
      </g>
      <g style="animation:riseF 1.5s ease-out .55s infinite">
        <circle cx="-34" cy="84" r="5.2" fill="#8ec9e8" opacity=".72"/>
        <circle cx="10" cy="94" r="6" fill="#8ec9e8" opacity=".72"/>
      </g>
    </g>

    <g style="animation:fadeSlide .6s ease-out .25s both">
      <rect x="34" y="576" width="337" height="52" rx="6" fill="#d85a30" opacity=".95"/>
      <text x="202" y="598" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="system-ui">MASSAGEIA SEM PARAR</text>
      <text x="202" y="619" text-anchor="middle" font-size="16" font-weight="800" fill="#faece7" font-family="system-ui">ATÉ O LÍQUIDO COBRIR TUDO</text>
    </g>
  </svg>

  <!-- ══════════ CENA 5 — NO POTE ══════════ -->
  <svg class="scene" id="s4" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#e4eae0"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#83917f" font-family="system-ui" letter-spacing="2">PRENSANDO BEM NO POTE</text>
    <ellipse cx="202" cy="536" rx="140" ry="26" fill="#9fb0a8" opacity=".4"/>

    <g transform="translate(202,398)">
      <path d="M-92,152 L-92,-16 Q-92,-36 -74,-36 L74,-36 Q92,-36 92,-16 L92,152 Z"
            fill="#f4faf8" stroke="#1d9e75" stroke-width="4"/>
      <rect x="-92" y="-36" width="184" height="22" rx="6" fill="#9fe1cb" stroke="#1d9e75" stroke-width="4"/>

      <!-- floretes dentro do pote -->
      <g>
        <circle cx="-56" cy="100" r="22" fill="#faf8ee"/>
        <circle cx="-14" cy="110" r="23" fill="#fdfbf4"/>
        <circle cx="34" cy="102" r="22" fill="#faf8ee"/>
        <circle cx="-40" cy="62" r="22" fill="#fdfbf4"/>

    <button onclick="toggle()" id="btnPlay">⏸ Pausar</button>

    <button onclick="play()">▶</button>
    <p>Couve-flor · 7 cenas · 45s</p>

<script>
const scenes = [
  { id:'s0', ms:5500, tag:'COUVE-FLOR 1 / 7', cap:'Couve-flor em conserva', sub:'só o florete, sem as folhas', color:'#5c7a29' },
  { id:'s1', ms:6000, tag:'COUVE-FLOR 2 / 7', cap:'Quebrando com a mão', sub:'pedaços pequenos e iguais', color:'#5c7a29' },
  { id:'s2', ms:6500, tag:'COUVE-FLOR 3 / 7', cap:'500 g = 12,5 g de sal', sub:'2,5% do peso, sem iodo', color:'#ba7517' },
  { id:'s3', ms:7000, tag:'COUVE-FLOR 4 / 7', cap:'Massageia sem parar', sub:'até o líquido cobrir tudo', color:'#d85a30' },
  { id:'s4', ms:6000, tag:'COUVE-FLOR 5 / 7', cap:'Prensa pra ficar submerso', sub:'florete fora da água = mofo', color:'#0f6e56' },
  { id:'s5', ms:6500, tag:'COUVE-FLOR 6 / 7', cap:'O sal vira conserva', sub:'bolha = está funcionando', color:'#3b6d11' },
  { id:'s6', ms:6000, tag:'COUVE-FLOR 7 / 7', cap:'7 a 10 dias', sub:'prova no dia 7. se gostar, para.', color:'#2c2c2a' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pausar';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Assistir';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>
