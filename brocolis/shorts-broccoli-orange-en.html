<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation — Fermented broccoli and orange (the sulfur smell is normal)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdfaf5; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#4f8f34; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; text-align:center; line-height:1.6; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; letter-spacing:.01em; }

  @keyframes floatSoft {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-6px) }
  }
  @keyframes swayLeaf {
    0%,100% { transform: rotate(-6deg) }
    50%     { transform: rotate(6deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes slideUp {
    0%   { transform: translateY(24px); opacity: 0 }
    100% { transform: translateY(0); opacity: 1 }
  }
  @keyframes riseSlow {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    30%  { opacity: .8 }
    100% { transform: translateY(-104px) scale(1.3); opacity: 0 }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">BROCCOLI 1 / 8</div>
  <div class="wm">@yourchannel</div>

  <!-- ══════════ CENA 1 — O CHEIRO ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s0Brine" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#efe3b4"/><stop offset="100%" stop-color="#d8c88a"/>
      </linearGradient>
      <linearGradient id="s0Glass" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".78"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".58"/>
      </linearGradient>
    </defs>
    <rect width="405" height="720" fill="#f6f9f2"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#87a37a" font-family="system-ui" letter-spacing="2">BROCCOLI + ORANGE</text>
    <ellipse cx="202" cy="502" rx="168" ry="42" fill="#dfe8d8" opacity=".6"/>

    <g transform="translate(202,352)">
      <g style="animation:floatSoft 3.4s ease-in-out infinite">
        <rect x="-76" y="-140" width="152" height="280" rx="26" fill="url(#s0Glass)" stroke="#d6ddcc" stroke-width="2.2"/>
        <rect x="-70" y="-46" width="140" height="180" rx="22" fill="url(#s0Brine)" opacity=".95"/>
        <rect x="-82" y="-152" width="164" height="16" rx="8" fill="#c8c0a8"/>
        <rect x="-58" y="-120" width="12" height="228" rx="6" fill="#ffffff" opacity=".32"/>

        <!-- florets -->
        <g>
          <g transform="translate(-32,26)">
            <path d="M0,58 Q-4,20 -2,-4 L2,-4 Q4,20 0,58Z" fill="#8fbf6a"/>
            <g fill="#4f8f34">
              <circle cx="-20" cy="-16" r="16"/><circle cx="0" cy="-26" r="18"/>
              <circle cx="20" cy="-14" r="16"/><circle cx="-10" cy="-2" r="14"/>
              <circle cx="10" cy="0" r="14"/><circle cx="0" cy="-10" r="15"/>
            </g>
            <g fill="#3d7327" opacity=".5">
              <circle cx="-22" cy="-22" r="5"/><circle cx="-2" cy="-36" r="6"/><circle cx="18" cy="-20" r="5"/>
            </g>
          </g>
          <g transform="translate(34,50)">
            <path d="M0,44 Q-3,14 -2,-4 L2,-4 Q3,14 0,44Z" fill="#8fbf6a"/>
            <g fill="#5a9a3c">
              <circle cx="-17" cy="-14" r="14"/><circle cx="0" cy="-23" r="16"/>
              <circle cx="17" cy="-12" r="14"/><circle cx="-8" cy="0" r="12"/><circle cx="9" cy="1" r="12"/>
            </g>
            <g fill="#3d7327" opacity=".5">
              <circle cx="-18" cy="-19" r="4.5"/><circle cx="0" cy="-32" r="5.5"/>
            </g>
          </g>
        </g>

        <!-- orange slice -->
        <g transform="translate(6,-16) rotate(-12)">
          <circle r="40" fill="#e8842a"/>
          <circle r="33" fill="#f7c48a"/>
          <g stroke="#e8842a" stroke-width="2.6" opacity=".9">
            <path d="M0,-31 L0,31"/><path d="M-27,-16 L27,16"/><path d="M-27,16 L27,-16"/>
          </g>
          <circle r="33" fill="none" stroke="#d1701c" stroke-width="3"/>
        </g>

        <!-- bubbles -->
        <g fill="#fffdf0" opacity=".85">
          <circle cx="-24" cy="110" r="4" style="animation:riseSlow 2.8s ease-out infinite"/>
          <circle cx="18" cy="116" r="3.4" style="animation:riseSlow 2.8s ease-out infinite; animation-delay:.9s"/>
          <circle cx="-2" cy="114" r="3" style="animation:riseSlow 2.8s ease-out infinite; animation-delay:1.8s"/>
        </g>
      </g>
    </g>

    <text x="202" y="546" text-anchor="middle" font-size="24" font-weight="900" fill="#22331c" font-family="system-ui" letter-spacing="-.6" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.3s">IT WILL SMELL LIKE SULFUR</text>
    <text x="202" y="576" text-anchor="middle" font-size="12" font-weight="800" fill="#4f8f34" font-family="system-ui" letter-spacing="2.2" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.55s">AND THAT IS COMPLETELY NORMAL</text>
    <text x="202" y="606" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7d8a74" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.8s">Broccoli is a sulfur vegetable. The smell fades.</text>
  </svg>

  <!-- ══════════ CENA 2 — NÃO É REPOLHO ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fdfaf5"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">THE FIRST DIFFERENCE</text>
    <ellipse cx="202" cy="470" rx="170" ry="44" fill="#e9e2d4" opacity=".5"/>

    <!-- repolho: solta muita água -->
    <g transform="translate(106,338)"><g style="animation:floatSoft 3.3s ease-in-out infinite">
      <circle r="62" fill="#7aa844"/>
      <circle r="50" fill="#8fbf5a" opacity=".55"/>
      <g fill="none" stroke="#4f7a2a" stroke-width="1.6" opacity=".5">
        <circle r="40"/><circle r="26"/>
      </g>
      <ellipse cx="-22" cy="-22" rx="16" ry="11" fill="#d4eaa8" opacity=".5" transform="rotate(-28 -22 -22)"/>
      <!-- gotas caindo -->
      <g fill="#9dc6dd">
        <ellipse cx="-44" cy="76" rx="5" ry="8" style="animation:riseSlow 2s ease-out infinite"/>
        <ellipse cx="0" cy="82" rx="4.4" ry="7" style="animation:riseSlow 2s ease-out infinite; animation-delay:.6s"/>
        <ellipse cx="44" cy="76" rx="5" ry="8" style="animation:riseSlow 2s ease-out infinite; animation-delay:1.2s"/>
      </g>
    </g></g>
    <text x="106" y="442" text-anchor="middle" font-size="12" font-weight="900" fill="#3d3222" font-family="system-ui" letter-spacing="1.2">CABBAGE</text>
    <text x="106" y="464" text-anchor="middle" font-size="11" font-weight="700" fill="#2f7d9a" font-family="system-ui">makes its own water</text>

    <!-- brócolis: quase nada -->
    <g transform="translate(298,340)"><g style="animation:floatSoft 3.3s ease-in-out infinite; animation-delay:.4s">
      <path d="M0,66 Q-4,22 -2,-4 L2,-4 Q4,22 0,66Z" fill="#8fbf6a"/>
      <g fill="#4f8f34">
        <circle cx="-26" cy="-20" r="20"/><circle cx="0" cy="-34" r="23"/>
        <circle cx="26" cy="-18" r="20"/><circle cx="-13" cy="-2" r="17"/>
        <circle cx="13" cy="0" r="17"/><circle cx="0" cy="-12" r="19"/>
      </g>
      <g fill="#3d7327" opacity=".5">
        <circle cx="-28" cy="-28" r="6"/><circle cx="-2" cy="-46" r="7"/><circle cx="24" cy="-26" r="6"/>
      </g>
      <!-- gota unica -->
      <g fill="#9dc6dd" opacity=".7">
        <ellipse cx="0" cy="80" rx="3.6" ry="6" style="animation:riseSlow 2.6s ease-out infinite"/>
      </g>
    </g></g>
    <text x="298" y="442" text-anchor="middle" font-size="12" font-weight="900" fill="#3d3222" font-family="system-ui" letter-spacing="1.2">BROCCOLI</text>
    <text x="298" y="464" text-anchor="middle" font-size="11" font-weight="700" fill="#b04a1e" font-family="system-ui">almost no water</text>

    <text x="202" y="540" text-anchor="middle" font-size="24" font-weight="900" fill="#2f2a22" font-family="system-ui" letter-spacing="-.5" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.3s">BROCCOLI IS NOT CABBAGE</text>
    <text x="202" y="572" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a8272" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.6s">Cabbage makes its own brine. Broccoli barely</text>
    <text x="202" y="592" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a8272" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.7s">makes any. So here you have to add water.</text>
    <text x="202" y="622" text-anchor="middle" font-size="12" font-weight="800" fill="#4f8f34" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.85s">Salt alone will not do it.</text>
  </svg>

  <!-- ══════════ CENA 3 — A SALMOURA ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s2Jug" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".8"/>
        <stop offset="50%" stop-color="#ffffff" stop-opacity=".25"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".6"/>
      </linearGradient>
    </defs>
    <rect width="405" height="720" fill="#f7f9f4"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#87a37a" font-family="system-ui" letter-spacing="2">STEP 1 · THE BRINE</text>
    <ellipse cx="202" cy="486" rx="166" ry="42" fill="#dfe8d8" opacity=".6"/>

    <!-- jarra medidora -->
    <g transform="translate(160,330)">
      <g style="animation:floatSoft 3.4s ease-in-out infinite">
        <path d="M-56,-96 L56,-96 L50,104 Q0,116 -50,104Z" fill="url(#s2Jug)" stroke="#d6ddcc" stroke-width="2.2"/>
        <path d="M-52,-24 L52,-24 L48,102 Q0,114 -48,102Z" fill="#cfe0ea" opacity=".85"/>
        <g stroke="#a8bcc8" stroke-width="1.6" opacity=".8">
          <path d="M44,-72 L58,-72"/><path d="M44,-40 L58,-40"/><path d="M44,-8 L58,-8"/><path d="M44,24 L58,24"/>
        </g>
        <path d="M56,-60 Q80,-56 78,-36 Q76,-20 56,-18" fill="none" stroke="#d6ddcc" stroke-width="2.2"/>
      </g>
    </g>

    <!-- colher de sal -->
    <g transform="translate(292,300)">
      <g style="animation:swayLeaf 3s ease-in-out infinite">
        <path d="M-14,-42 L14,-30 L8,10 Q0,22 -8,10Z" fill="#e8e2d0" stroke="#cfc6ad" stroke-width="1.8"/>
        <ellipse cx="0" cy="-6" rx="9" ry="12" fill="#ffffff"/>
        <g fill="#ffffff">
          <circle cx="-4" cy="-8" r="3"/><circle cx="3" cy="-6" r="2.6"/><circle cx="0" cy="-2" r="2.4"/>
        </g>
      </g>
    </g>

    <g style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">
      <rect x="96" y="462" width="212" height="32" rx="16" fill="#4f8f34"/>
      <text x="202" y="483" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff" font-family="system-ui" letter-spacing="2">2.5% BRINE</text>
    </g>

    <text x="202" y="540" text-anchor="middle" font-size="20" font-weight="900" fill="#22331c" font-family="system-ui" letter-spacing="-.4" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">1 LITER WATER + 25 g SALT</text>
    <text x="202" y="572" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7d8a74" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.65s">Not 2%. Broccoli is a brassica, like cauliflower —</text>
    <text x="202" y="592" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7d8a74" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.75s">and brassicas need a little more salt.</text>
    <text x="202" y="622" text-anchor="middle" font-size="12" font-weight="800" fill="#b04a1e" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.9s">Non-iodized. Stir until it disappears.</text>
  </svg>

  <!-- ══════════ CENA 4 — CORTE GRANDE ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fdfaf5"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">STEP 2 · THE CUT</text>

    <rect x="60" y="200" width="285" height="176" rx="16" fill="#f4efe2"/>
    <rect x="60" y="200" width="285" height="176" rx="16" fill="none" stroke="#e2d9c4" stroke-width="2"/>

    <!-- floretos grandes -->
    <g>
      <g transform="translate(126,290)"><g style="animation:floatSoft 3s ease-in-out infinite">
        <path d="M0,48 Q-3,16 -2,-4 L2,-4 Q3,16 0,48Z" fill="#8fbf6a"/>
        <g fill="#4f8f34">
          <circle cx="-17" cy="-14" r="14"/><circle cx="0" cy="-23" r="16"/><circle cx="17" cy="-12" r="14"/>
        </g>
      </g></g>
      <g transform="translate(202,300)"><g style="animation:floatSoft 3s ease-in-out infinite; animation-delay:.3s">
        <path d="M0,48 Q-3,16 -2,-4 L2,-4 Q3,16 0,48Z" fill="#8fbf6a"/>
        <g fill="#5a9a3c">
          <circle cx="-17" cy="-14" r="14"/><circle cx="0" cy="-23" r="16"/><circle cx="17" cy="-12" r="14"/>
        </g>
      </g></g>
      <g transform="translate(278,290)"><g style="animation:floatSoft 3s ease-in-out infinite; animation-delay:.6s">
        <path d="M0,48 Q-3,16 -2,-4 L2,-4 Q3,16 0,48Z" fill="#8fbf6a"/>
        <g fill="#4f8f34">
          <circle cx="-17" cy="-14" r="14"/><circle cx="0" cy="-23" r="16"/><circle cx="17" cy="-12" r="14"/>
        </g>
      </g></g>
    </g>

    <!-- faca -->
    <g transform="translate(202,168)"><g style="animation:swayLeaf 3.6s ease-in-out infinite">
      <path d="M-96,0 L34,0 L34,10 L-96,10Z" fill="#c8ced4"/>
      <path d="M34,-2 L74,-2 L74,12 L34,12Z" fill="#8a8f96"/>
      <path d="M-96,0 L34,0 L34,3 L-96,3Z" fill="#e6eaee"/>
    </g></g>

    <g style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">
      <rect x="130" y="400" width="144" height="32" rx="16" fill="#4f8f34"/>
      <text x="202" y="421" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff" font-family="system-ui" letter-spacing="1.6">1-INCH PIECES</text>
    </g>

    <text x="202" y="486" text-anchor="middle" font-size="24" font-weight="900" fill="#22331c" font-family="system-ui" letter-spacing="-.5" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">DO NOT SHRED IT</text>
    <text x="202" y="518" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a8272" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.65s">Cut small and it turns to mush in two days — and</text>
    <text x="202" y="538" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a8272" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.75s">mushy broccoli never comes back.</text>

    <g style="animation:slideUp .6s ease both; animation-delay:.9s">
      <rect x="46" y="566" width="313" height="62" rx="14" fill="#ffffff" stroke="#d8e6cc" stroke-width="2"/>
      <text x="202" y="592" text-anchor="middle" font-size="12.5" font-weight="900" fill="#4f8f34" font-family="system-ui">KEEP THE STEMS</text>
      <text x="202" y="613" text-anchor="middle" font-size="11" font-weight="600" fill="#7d8a74" font-family="system-ui">They are the part that stays crunchy.</text>
    </g>
  </svg>

  <!-- ══════════ CENA 5 — CASCA E SUCO ══════════ -->
  <svg class="scene" id="s4" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fdf6ee"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#c09a72" font-family="system-ui" letter-spacing="2">THE ORANGE · 2 PARTS</text>
    <ellipse cx="202" cy="452" rx="170" ry="44" fill="#f4e2cc" opacity=".6"/>

    <!-- metade esquerda: casca -->
    <g transform="translate(104,300)"><g style="animation:floatSoft 3.2s ease-in-out infinite">
      <path d="M0,-70 A70,70 0 0,1 0,70 L0,-70Z" fill="#e8842a"/>
      <path d="M0,-62 A62,62 0 0,1 0,62 L0,-62Z" fill="#f2a04e"/>
      <g fill="#d1701c" opacity=".5">
        <circle cx="22" cy="-30" r="3.4"/><circle cx="34" cy="4" r="3"/><circle cx="24" cy="36" r="3.4"/>
        <circle cx="10" cy="-52" r="3"/><circle cx="12" cy="52" r="3"/>
      </g>
      <circle cx="-6" cy="0" r="5" fill="#f7c48a"/>
    </g></g>
    <text x="104" y="404" text-anchor="middle" font-size="12" font-weight="900" fill="#b04a1e" font-family="system-ui" letter-spacing="1.2">THE PEEL</text>
    <text x="104" y="426" text-anchor="middle" font-size="11" font-weight="700" fill="#4f8f34" font-family="system-ui">the bacteria like it</text>

    <!-- metade direita: gomos -->
    <g transform="translate(300,300)"><g style="animation:floatSoft 3.2s ease-in-out infinite; animation-delay:.4s">
      <path d="M0,-70 A70,70 0 0,0 0,70 L0,-70Z" fill="#e8842a"/>
      <g fill="#f7c48a">
        <path d="M-4,-58 A58,58 0 0,0 -4,-20 Z"/>
        <path d="M-4,-14 A58,58 0 0,0 -4,22 Z"/>
        <path d="M-4,28 A58,58 0 0,0 -4,58 Z"/>
      </g>
      <g fill="#e8842a" opacity=".85">
        <path d="M-4,-58 L-4,-20 L-40,-39Z"/>
        <path d="M-4,-14 L-4,22 L-46,4Z"/>
        <path d="M-4,28 L-4,58 L-40,43Z"/>

<script>
const scenes = [
  { id:'s0', ms:5500, tag:'BROCCOLI 1 / 8', cap:'Fermented broccoli and orange', sub:'and why the sulfur smell is normal', color:'#4f8f34' },
  { id:'s1', ms:7000, tag:'BROCCOLI 2 / 8', cap:'Broccoli needs a brine', sub:'unlike cabbage, it makes almost no water', color:'#4f8f34' },
  { id:'s2', ms:6500, tag:'BROCCOLI 3 / 8', cap:'2.5% brine, not 2%', sub:'1 liter water + 25 g non-iodized salt', color:'#4f8f34' },
  { id:'s3', ms:6500, tag:'BROCCOLI 4 / 8', cap:'Cut 1-inch pieces', sub:'the stems are the crunchy part', color:'#5a9a3c' },
  { id:'s4', ms:7000, tag:'BROCCOLI 5 / 8', cap:'Zest yes, juice only a little', sub:'the peel is fine. the sugar is the risk.', color:'#e8842a' },
  { id:'s5', ms:7000, tag:'BROCCOLI 6 / 8', cap:'Half an orange, that is all', sub:'more sugar = more fizz, less ferment', color:'#b04a1e' },
  { id:'s6', ms:7000, tag:'BROCCOLI 7 / 8', cap:'White film is fine. Fuzz is not.', sub:'and never start from frozen broccoli', color:'#c2551f' },
  { id:'s7', ms:6500, tag:'BROCCOLI 8 / 8', cap:'Ready in 5 to 10 days', sub:'taste on day 3, then into the fridge', color:'#22331c' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Watch';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
