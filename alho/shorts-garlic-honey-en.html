<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation — Fermented Garlic in Honey (EN)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdf8ee; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#c08a2e; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; text-align:center; line-height:1.6; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; letter-spacing:.01em; }

  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-7px) rotate(1.5deg) }
  }
  @keyframes peelTwist {
    0%,100% { transform: translate(0,0) rotate(0deg) }
    35%     { transform: translate(-4px,2px) rotate(-11deg) }
    70%     { transform: translate(2px,-1px) rotate(9deg) }
  }
  @keyframes peelStrip {
    0%   { transform: translate(0,0) rotate(0deg) scaleY(1); opacity: 0 }
    20%  { opacity: .95 }
    100% { transform: translate(-34px,74px) rotate(-38deg) scaleY(1.3); opacity: 0 }
  }
  @keyframes pressDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(16px) }
  }
  @keyframes honeyPour {
    0%   { transform: translateY(-16px) rotate(-26deg); opacity: 0 }
    22%  { opacity: 1 }
    60%  { transform: translateY(6px) rotate(-6deg) }
    100% { transform: translateY(2px) rotate(-10deg); opacity: 1 }
  }
  @keyframes honeyStream {
    0%   { transform: scaleY(.2); opacity: 0 }
    25%  { opacity: .9 }
    100% { transform: scaleY(1); opacity: .9 }
  }
  @keyframes riseF {
    0%   { transform: translateY(0) scale(.7); opacity: 0 }
    25%  { opacity: .9 }
    100% { transform: translateY(-96px) scale(1.2); opacity: 0 }
  }
  @keyframes riseSlow {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    30%  { opacity: .8 }
    100% { transform: translateY(-118px) scale(1.3); opacity: 0 }
  }
  @keyframes spin3d {
    0%   { transform: rotateY(0deg) }
    100% { transform: rotateY(360deg) }
  }
  @keyframes spinFlat {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(360deg) }
  }
  @keyframes spinRev {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(-360deg) }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.6); opacity: .75 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes clockTick {
    0%,100% { transform: rotate(0deg) }
    50%     { transform: rotate(30deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes slideUp {
    0%   { transform: translateY(24px); opacity: 0 }
    100% { transform: translateY(0); opacity: 1 }
  }
  @keyframes shimmer {
    0%,100% { opacity: .35 }
    50%     { opacity: .75 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes drawLine {
    0%   { stroke-dashoffset: 301 }
    100% { stroke-dashoffset: 0 }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">GARLIC 1 / 8</div>
  <div class="wm">@yourhandle</div>

  <!-- ══════════ SCENE 1 — THE GARLIC HEAD ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="gBulb" cx="38%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#fffdf6"/>
        <stop offset="55%" stop-color="#f0e6d0"/>
        <stop offset="100%" stop-color="#d3c1a0"/>
      </radialGradient>
      <radialGradient id="gClove" cx="35%" cy="28%" r="75%">
        <stop offset="0%" stop-color="#fffef9"/>
        <stop offset="60%" stop-color="#f3ead6"/>
        <stop offset="100%" stop-color="#d8c7a6"/>
      </radialGradient>
      <linearGradient id="gHon" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f9d47a"/>
        <stop offset="55%" stop-color="#eeb545"/>
        <stop offset="100%" stop-color="#c98722"/>
      </linearGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf8ee"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">FERMENTED GARLIC IN HONEY</text>
    <ellipse cx="202" cy="516" rx="168" ry="44" fill="#e2d5b8" opacity=".45"/>

    <g transform="translate(202,372)"><g style="animation:floatUpDown 3.4s ease-in-out infinite">
      <!-- whole garlic head (bulb = cluster of cloves) -->
      <g>
        <circle cx="-52" cy="56" r="30" fill="#e8dcc2"/>
        <circle cx="52" cy="56" r="30" fill="#e8dcc2"/>
        <circle cx="-66" cy="14" r="28" fill="#eadfc7"/>
        <circle cx="66" cy="14" r="28" fill="#eadfc7"/>
        <circle cx="-30" cy="74" r="30" fill="#e4d7bb"/>
        <circle cx="30" cy="74" r="30" fill="#e4d7bb"/>
        <circle cx="0" cy="-30" r="34" fill="url(#gClove)"/>
        <circle cx="-46" cy="4" r="34" fill="url(#gClove)"/>
        <circle cx="46" cy="4" r="34" fill="url(#gClove)"/>
        <circle cx="-24" cy="40" r="34" fill="url(#gClove)"/>
        <circle cx="24" cy="40" r="34" fill="url(#gClove)"/>
        <circle cx="0" cy="58" r="32" fill="#f6efdd"/>
      </g>
      <!-- clove seams -->
      <g fill="none" stroke="#c9b593" stroke-width="1.5" opacity=".75">
        <path d="M-24,-24 Q-16,20 -20,52"/>
        <path d="M24,-24 Q16,20 20,52"/>
        <path d="M-48,-6 Q-30,26 -26,54"/>
        <path d="M48,-6 Q30,26 26,54"/>
        <path d="M0,-40 L0,64"/>
      </g>
      <!-- papery skin highlight -->
      <g fill="none" stroke="#fffdf8" stroke-width="2" opacity=".55">
        <path d="M-40,-14 Q-30,10 -34,34"/>
        <path d="M18,-26 Q8,4 12,30"/>
      </g>
      <!-- dried stalk on top -->
      <path d="M0,-64 Q-2,-88 0,-100" stroke="#b9a179" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M0,-64 Q-2,-88 0,-100" stroke="#d9c6a4" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- little roots at base -->
      <g stroke="#c2ac84" stroke-width="1.6" stroke-linecap="round" opacity=".8">
        <path d="M-16,86 Q-20,98 -22,108"/>
        <path d="M0,92 Q0,104 1,112"/>
        <path d="M16,86 Q20,98 23,108"/>
      </g>
    </g></g>

    <text x="202" y="584" text-anchor="middle" font-size="27" font-weight="900" fill="#3d3222" font-family="system-ui" letter-spacing="-.5" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.25s">FERMENTED GARLIC</text>
    <text x="202" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#b8862b" font-family="system-ui" letter-spacing="3" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">IN RAW HONEY</text>
    <text x="202" y="638" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7a5e" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.7s">No salt. No vinegar. Just two things.</text>
  </svg>

  <!-- ══════════ SCENE 2 — PEEL THE CLOVES ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="gClove2" cx="34%" cy="26%" r="78%">
        <stop offset="0%" stop-color="#fffef9"/>
        <stop offset="58%" stop-color="#f4ebd8"/>
        <stop offset="100%" stop-color="#d5c3a0"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf8ee"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">STEP 1 · SPLIT AND PEEL</text>
    <ellipse cx="202" cy="486" rx="172" ry="48" fill="#ece0c8" opacity=".55"/>

    <!-- separated cloves scattered -->
    <g transform="translate(202,352)">
      <g style="animation:floatUpDown 3s ease-in-out infinite">
        <g transform="rotate(-16)"><ellipse cx="-96" cy="46" rx="17" ry="30" fill="url(#gClove2)"/><ellipse cx="-96" cy="18" rx="13" ry="20" fill="#fbf6e8"/></g>
        <g transform="rotate(12)"><ellipse cx="86" cy="58" rx="16" ry="28" fill="url(#gClove2)"/><ellipse cx="86" cy="32" rx="12" ry="19" fill="#fbf6e8"/></g>
        <g transform="rotate(-6)"><ellipse cx="-58" cy="76" rx="15" ry="26" fill="#eee2c8"/><ellipse cx="-58" cy="52" rx="11" ry="17" fill="#f9f4e6"/></g>
        <g transform="rotate(20)"><ellipse cx="56" cy="82" rx="15" ry="25" fill="#eee2c8"/><ellipse cx="56" cy="59" rx="11" ry="17" fill="#f9f4e6"/></g>
      </g>

      <!-- the clove being peeled, in focus -->
      <g style="animation:peelTwist 2.1s ease-in-out infinite">
        <ellipse cx="0" cy="18" rx="26" ry="44" fill="url(#gClove2)"/>
        <ellipse cx="0" cy="-18" rx="19" ry="28" fill="#fcf8ec"/>
        <!-- papery skin strip coming off -->
        <path d="M-16,-30 Q-30,-14 -24,26 Q-14,18 -18,-14Z" fill="#e6d7b6" opacity=".95" style="animation:peelStrip 2.1s ease-in infinite"/>
      </g>

      <!-- fingers holding the clove -->
      <g style="animation:peelTwist 2.1s ease-in-out infinite">
        <ellipse cx="-46" cy="6" rx="15" ry="10" fill="#f0b58e" transform="rotate(-24 -46 6)"/>
        <ellipse cx="-40" cy="30" rx="14" ry="9.5" fill="#eaaa80" transform="rotate(-14 -40 30)"/>
        <ellipse cx="46" cy="6" rx="15" ry="10" fill="#f0b58e" transform="rotate(24 46 6)"/>
        <ellipse cx="40" cy="30" rx="14" ry="9.5" fill="#eaaa80" transform="rotate(14 40 30)"/>
        <ellipse cx="-14" cy="52" rx="19" ry="13" fill="#f2b992" transform="rotate(-10 -14 52)"/>
        <ellipse cx="14" cy="52" rx="19" ry="13" fill="#f2b992" transform="rotate(10 14 52)"/>
      </g>
    </g>

    <text x="202" y="584" text-anchor="middle" font-size="21" font-weight="900" fill="#3d3222" font-family="system-ui" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">PEEL EVERY CLOVE</text>
    <text x="202" y="610" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b8862b" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.45s">Smash with the flat blade first</text>
    <text x="202" y="634" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7a5e" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.6s">the skin slides right off</text>
  </svg>

  <!-- ══════════ SCENE 3 — DRY THEM FULLY ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fdf8ee"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">STEP 2 · THE MOST IMPORTANT ONE</text>

    <!-- towel -->
    <path d="M46,300 Q202,268 358,300 Q372,420 358,470 Q202,498 46,470 Q32,420 46,300Z" fill="#ffffff"/>
    <path d="M46,300 Q202,268 358,300 Q372,420 358,470 Q202,498 46,470 Q32,420 46,300Z" fill="none" stroke="#e5ddcc" stroke-width="1.6"/>
    <g stroke="#eee6d6" stroke-width="1.4" opacity=".9">
      <path d="M80,318 Q86,400 80,462"/>
      <path d="M120,308 Q126,400 120,472"/>
      <path d="M160,302 Q166,400 160,478"/>
      <path d="M244,302 Q238,400 244,478"/>
      <path d="M284,308 Q278,400 284,472"/>
      <path d="M324,318 Q318,400 324,462"/>
    </g>

    <!-- cloves drying on the towel -->
    <g>
      <g transform="translate(120,392) rotate(-22)"><ellipse rx="16" ry="28" fill="#f4ebd8"/><ellipse cy="-20" rx="12" ry="18" fill="#fdfaf1"/></g>
      <g transform="translate(168,410) rotate(8)"><ellipse rx="16" ry="27" fill="#f0e6d0"/><ellipse cy="-19" rx="12" ry="17" fill="#fdfaf1"/></g>
      <g transform="translate(216,392) rotate(-8)"><ellipse rx="16" ry="28" fill="#f4ebd8"/><ellipse cy="-20" rx="12" ry="18" fill="#fdfaf1"/></g>
      <g transform="translate(264,410) rotate(16)"><ellipse rx="15" ry="26" fill="#f0e6d0"/><ellipse cy="-18" rx="11" ry="16" fill="#fdfaf1"/></g>
      <g transform="translate(144,450) rotate(4)"><ellipse rx="14" ry="25" fill="#eee2c8"/><ellipse cy="-17" rx="10" ry="15" fill="#fbf6e8"/></g>
      <g transform="translate(238,452) rotate(-14)"><ellipse rx="14" ry="25" fill="#eee2c8"/><ellipse cy="-17" rx="10" ry="15" fill="#fbf6e8"/></g>
    </g>

    <!-- hand patting dry -->
    <g style="animation:pressDown 1.9s ease-in-out infinite">
      <ellipse cx="196" cy="360" rx="66" ry="40" fill="#f2b992"/>
      <ellipse cx="196" cy="360" rx="66" ry="40" fill="none" stroke="#d38f66" stroke-width="1.5"/>
      <ellipse cx="150" cy="330" rx="15" ry="11" fill="#f0b58e" transform="rotate(-30 150 330)"/>
      <ellipse cx="196" cy="322" rx="15" ry="11" fill="#f0b58e"/>
      <ellipse cx="242" cy="330" rx="15" ry="11" fill="#f0b58e" transform="rotate(30 242 330)"/>
      <ellipse cx="144" cy="356" rx="13" ry="10" fill="#eda87e" transform="rotate(-16 144 356)"/>
      <ellipse cx="248" cy="356" rx="13" ry="10" fill="#eda87e" transform="rotate(16 248 356)"/>
    </g>

    <!-- water drops flying off -->
    <g fill="#9dc6dd" opacity=".85">
      <circle cx="150" cy="300" r="4" style="animation:riseF 1.4s ease-out infinite"/>
      <circle cx="200" cy="296" r="3.4" style="animation:riseF 1.4s ease-out infinite; animation-delay:.35s"/>
      <circle cx="248" cy="302" r="4.2" style="animation:riseF 1.4s ease-out infinite; animation-delay:.7s"/>
    </g>

    <rect x="40" y="500" width="325" height="114" rx="14" fill="#fdf0e2" stroke="#f0c9a0" stroke-width="2"/>
    <text x="202" y="526" text-anchor="middle" font-size="13" font-weight="900" fill="#c2551f" font-family="system-ui" letter-spacing="1.4">⚠ WATER = MOLD</text>
    <text x="202" y="550" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a4a26" font-family="system-ui">Dry the cloves with a clean towel.</text>
    <text x="202" y="570" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a4a26" font-family="system-ui">Even one drop of water can spoil</text>
    <text x="202" y="590" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a4a26" font-family="system-ui">the whole jar.</text>

    <text x="202" y="636" text-anchor="middle" font-size="13" font-weight="800" fill="#3d3222" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.3s">Bone dry. No exceptions.</text>
  </svg>

  <!-- ══════════ SCENE 4 — HONEY IN THE JAR ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gHonJar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f9d47a"/>
        <stop offset="55%" stop-color="#eeb545"/>
        <stop offset="100%" stop-color="#c98722"/>
      </linearGradient>
      <linearGradient id="gGlass" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
        <stop offset="22%" stop-color="#ffffff" stop-opacity=".06"/>
        <stop offset="78%" stop-color="#ffffff" stop-opacity=".04"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".38"/>
      </linearGradient>
      <clipPath id="clJar"><path d="M128,300 Q128,286 142,286 L262,286 Q276,286 276,300 L276,556 Q276,580 252,580 L152,580 Q128,580 128,556Z"/></clipPath>
    </defs>
    <rect width="405" height="720" fill="#fdf8ee"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">STEP 3 · CLOVES IN, HONEY OVER</text>

    <g transform="translate(0,-30)">
    <!-- jar body -->
    <path d="M128,300 Q128,286 142,286 L262,286 Q276,286 276,300 L276,556 Q276,580 252,580 L152,580 Q128,580 128,556Z" fill="#f5f0e4" opacity=".7"/>

    <g clip-path="url(#clJar)">
      <!-- honey filling -->
      <rect x="128" y="330" width="148" height="252" fill="url(#gHonJar)"/>
      <!-- honey surface -->
      <path d="M128,332 Q202,322 276,332 L276,342 L128,342Z" fill="#fbe7ab" opacity=".95"/>
      <!-- cloves inside, suspended -->
      <g>
        <g transform="translate(164,392) rotate(-18)"><ellipse rx="14" ry="25" fill="#f8f1de"/><ellipse cy="-17" rx="10" ry="15" fill="#fffdf6"/></g>
        <g transform="translate(240,404) rotate(14)"><ellipse rx="14" ry="25" fill="#f4ecd6"/><ellipse cy="-17" rx="10" ry="15" fill="#fffdf6"/></g>
        <g transform="translate(176,462) rotate(10)"><ellipse rx="14" ry="25" fill="#f6efdb"/><ellipse cy="-17" rx="10" ry="15" fill="#fffdf6"/></g>
        <g transform="translate(238,470) rotate(-12)"><ellipse rx="14" ry="25" fill="#f2e9d1"/><ellipse cy="-17" rx="10" ry="15" fill="#fffdf6"/></g>
        <g transform="translate(202,522) rotate(6)"><ellipse rx="14" ry="25" fill="#f7f0dd"/><ellipse cy="-17" rx="10" ry="15" fill="#fffdf6"/></g>
        <g transform="translate(160,540) rotate(-24)"><ellipse rx="13" ry="23" fill="#f4ebd8"/><ellipse cy="-15" rx="9" ry="13" fill="#fffdf6"/></g>
      </g>
      <!-- bubbles trapped in the honey -->
      <g fill="#fdf0c4" opacity=".85">
        <circle cx="150" cy="420" r="4"/>
        <circle cx="258" cy="450" r="3.4"/>
        <circle cx="196" cy="500" r="4.6"/>
        <circle cx="230" cy="368" r="3"/>
        <circle cx="168" cy="500" r="3.2"/>
      </g>
      <!-- glass shine -->
      <rect x="128" y="286" width="148" height="296" fill="url(#gGlass)"/>
    </g>

    <!-- jar outline + neck -->
    <path d="M128,300 Q128,286 142,286 L262,286 Q276,286 276,300 L276,556 Q276,580 252,580 L152,580 Q128,580 128,556Z" fill="none" stroke="#cbbfa6" stroke-width="2.4"/>
    <rect x="136" y="262" width="132" height="26" rx="7" fill="#efe7d6" stroke="#cbbfa6" stroke-width="2.2"/>
    <rect x="176" y="244" width="52" height="20" rx="6" fill="#e6dbc4" stroke="#cbbfa6" stroke-width="2"/>

    <button onclick="play()">▶</button>
    <p>Garlic in honey · 8 scenes · 55s<br>English version</p>

<script>
const scenes = [
  { id:'s0', ms:5500, tag:'GARLIC 1 / 8', cap:'Fermented garlic in honey', sub:'No salt. No vinegar. Just two things.', color:'#b8862b' },
  { id:'s1', ms:6000, tag:'GARLIC 2 / 8', cap:'Peel every clove', sub:'smash with the flat blade first', color:'#b8862b' },
  { id:'s2', ms:7000, tag:'GARLIC 3 / 8', cap:'Dry them completely', sub:'water is the #1 enemy here', color:'#c2551f' },
  { id:'s3', ms:7000, tag:'GARLIC 4 / 8', cap:'Cover with raw honey', sub:'at least 2 cm above the cloves', color:'#c08a2e' },
  { id:'s4', ms:6500, tag:'GARLIC 5 / 8', cap:'Flip the jar every day', sub:'twice a day for the first week', color:'#9a6a12' },
  { id:'s5', ms:7500, tag:'GARLIC 6 / 8', cap:'The garlic turns amber', sub:'bubbles = it is working', color:'#0f6e56' },
  { id:'s6', ms:6500, tag:'GARLIC 7 / 8', cap:'3 to 4 weeks minimum', sub:'under 1 year old, never', color:'#3d3222' },
  { id:'s7', ms:6500, tag:'GARLIC 8 / 8', cap:'Ready to eat', sub:'and you get garlic honey too', color:'#3d3222' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Play';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
