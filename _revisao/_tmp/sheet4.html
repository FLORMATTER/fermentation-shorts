<!DOCTYPE html><html><head><meta charset="utf-8"><style>

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow:hidden; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh;
  }

  /* ══ THE FRAME — native 1080x1920, full bleed, NO rounded corners, NO shadow ══
     This IS the recording canvas: exactly what YouTube wants for a Short.
     In an OBS Browser Source set to 1080x1920 the scale below resolves to 1
     and you record pixel for pixel. On a normal monitor it only shrinks so
     you can preview it. Nothing else changes. */
  #stage {
    position:relative; width:1080px; height:1920px;
    background:#f7f0f4; overflow:hidden;
    transform-origin:center center;
    flex:none;
  }

  /* the inner SVGs keep the series' 405x720 coordinate space and are drawn
     into the full 1080x1920 frame — vector, so it stays razor sharp.
     405x720 and 1080x1920 are the same 9:16 ratio: nothing is stretched. */
  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:11px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#a01e52; transition:width .2s linear; }

  .tag {
    position:absolute; top:59px; left:0; right:0; text-align:center;
    font-size:27px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:48px; right:43px; font-size:24px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:219px; left:0; right:0; display:flex;
        justify-content:center; gap:24px; z-index:40; opacity:0; transition:opacity .3s; }
  /* controls appear on mouse move and fade out by themselves, so a hands-off
     recording never has buttons on top of the drawing */
  #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:31px;
    font-weight:700; font-family:inherit; padding:21px 40px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.62);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:43px; }
  .cover.hide { display:none; }
  .cover button { width:208px; height:208px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:72px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:13px; }
  .cover p { color:#fff; font-size:32px; font-weight:700; letter-spacing:.08em; opacity:.9;
             text-transform:uppercase; text-align:center; line-height:1.7; }
  .cover p b { color:#f0a8c8; }
  .cover .hint { font-size:24px; font-weight:600; opacity:.55; letter-spacing:.04em; text-transform:none; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:37px 59px 45px; font-size:43px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:32px; font-weight:500; opacity:.72; margin-top:11px; letter-spacing:.01em; }

  /* ══ keyframes — declared once, shared by every inline SVG scene ══ */
  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-8px) rotate(1.4deg) }
  }
  @keyframes holdSteady {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-5px) }
  }
  @keyframes chopDown {
    0%   { transform: translateY(-20px) rotate(-15deg) }
    50%  { transform: translateY(8px) rotate(5deg) }
    100% { transform: translateY(-20px) rotate(-15deg) }
  }
  @keyframes pressDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(15px) }
  }
  @keyframes pourSalt {
    0%,100% { transform: translateY(-14px) rotate(-20deg) }
    34%     { transform: translateY(4px) rotate(-4deg) }
    64%     { transform: translateY(1px) rotate(1deg) }
  }
  @keyframes saltFall {
    0%   { transform: translateY(0) translateX(0); opacity: 0 }
    15%  { opacity: .95 }
    100% { transform: translateY(118px) translateX(6px); opacity: 0 }
  }
  @keyframes liquidRise {
    0%   { transform: translateY(56px); opacity: 0 }
    100% { transform: translateY(0); opacity: .82 }
  }
  @keyframes bubbleRise {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    28%  { opacity: .9 }
    100% { transform: translateY(-96px) scale(1.25); opacity: 0 }
  }
  @keyframes soakStain {
    0%   { opacity: 0; transform: scaleX(.7) }
    100% { opacity: .9; transform: scaleX(1) }
  }
  @keyframes spin3d {
    0%   { transform: rotateY(0deg) }
    100% { transform: rotateY(360deg) }
  }
  @keyframes spinFlat {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(360deg) }
  }
  @keyframes spinRev {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(-360deg) }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.6); opacity: .7 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes clockTick {
    0%,100% { transform: rotate(0deg) }
    50%     { transform: rotate(30deg) }
  }
  @keyframes floatJar {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-9px) rotate(1.2deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes drawLine {
    0%   { stroke-dashoffset: 301 }
    100% { stroke-dashoffset: 0 }
  }

*{animation-delay:-1s!important;animation-play-state:paused!important}
body{background:#2b2b2b;margin:0;padding:16px;font-family:system-ui}
.row{display:flex;gap:14px;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:6px}
.lbl{color:#9ad;font-size:13px;font-weight:700;letter-spacing:.1em}
.box{position:relative;width:405px;height:720px;background:#fdf8ee;overflow:hidden}
.box svg{position:absolute;inset:0;width:100%;height:100%;opacity:1!important;visibility:visible!important}
/* faixa da legenda: y=647..720 no espaco 405x720 */
.box::after{content:'';position:absolute;left:0;right:0;top:647px;height:73px;
  background:rgba(255,0,0,.18);border-top:1px dashed red;z-index:9}
</style></head><body><div class="row"><div class="cell"><div class="lbl">CENA 4</div><div class="box"><svg class="scene" id="s4" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bBowl4" cx="40%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f6eef3"/>
        <stop offset="100%" stop-color="#e2d4dd"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#f7f0f4"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#a8899a" font-family="system-ui" letter-spacing="2">STEP 4 · THE SALT</text>
    <ellipse cx="202" cy="514" rx="164" ry="42" fill="#e6d2dd" opacity=".55"/>

    <path d="M78,392 Q202,380 326,392 Q316,504 202,522 Q88,504 78,392Z" fill="url(#bBowl4)" stroke="#d8c6d2" stroke-width="2"/>
    <ellipse cx="202" cy="392" rx="124" ry="30" fill="#fdf8fb" stroke="#d8c6d2" stroke-width="2"/>

    <!-- beet wedges and garlic in the bowl -->
    <g>
      <g transform="translate(146,404) rotate(-12)"><polygon points="0,-22 18,15 -18,15" fill="#a52a5a"/><polygon points="0,-22 18,15 0,15" fill="#c94d78" opacity=".5"/></g>
      <g transform="translate(216,400) rotate(10)"><ellipse rx="12" ry="19" fill="#f8f1de"/><ellipse cy="-12" rx="9" ry="13" fill="#fffdf6"/></g>
      <g transform="translate(176,428) rotate(8)"><polygon points="0,-22 18,15 -18,15" fill="#96284f"/><polygon points="0,-22 18,15 0,15" fill="#c94d78" opacity=".45"/></g>
      <g transform="translate(242,424) rotate(-8)"><ellipse rx="12" ry="19" fill="#f4ecd6"/><ellipse cy="-12" rx="9" ry="13" fill="#fffdf6"/></g>
      <g transform="translate(206,452) rotate(-14)"><polygon points="0,-20 16,13 -16,13" fill="#b3255c"/><polygon points="0,-20 16,13 0,13" fill="#c94d78" opacity=".45"/></g>
    </g>

    <!-- white hand pouring salt -->
    <g transform="translate(300,286)">
      <g style="animation:pourSalt 2.4s ease-in-out infinite">
        <ellipse cx="0" cy="0" rx="34" ry="27" fill="#f7e0cf" transform="rotate(-16)"/>
        <ellipse cx="0" cy="0" rx="34" ry="27" fill="none" stroke="#d6a98c" stroke-width="1.6" transform="rotate(-16)"/>
        <ellipse cx="-28" cy="-20" rx="13" ry="9" fill="#f2d4bf" transform="rotate(-42 -28 -20)"/>
        <ellipse cx="-28" cy="-26" rx="5.6" ry="4.6" fill="#fef6f0" opacity=".95"/>
        <ellipse cx="-8" cy="-26" rx="13" ry="9" fill="#f2d4bf" transform="rotate(-24 -8 -26)"/>
        <ellipse cx="-8" cy="-32" rx="5.6" ry="4.6" fill="#fef6f0" opacity=".95"/>
        <ellipse cx="12" cy="-24" rx="13" ry="9" fill="#f2d4bf" transform="rotate(-6 12 -24)"/>
        <ellipse cx="12" cy="-30" rx="5.6" ry="4.6" fill="#fef6f0" opacity=".95"/>
        <ellipse cx="30" cy="-12" rx="13" ry="9" fill="#f2d4bf" transform="rotate(14 30 -12)"/>
        <ellipse cx="30" cy="-18" rx="5.6" ry="4.6" fill="#fef6f0" opacity=".95"/>
        <ellipse cx="-10" cy="-8" rx="19" ry="7" fill="#fff" opacity=".97"/>
        <ellipse cx="-10" cy="-12" rx="14" ry="6" fill="#fff"/>
        <ellipse cx="-10" cy="-15" rx="8" ry="3.6" fill="#fff"/>
      </g>
    </g>

    <!-- salt crystals falling -->
    <g fill="#fff" stroke="#c9a8bc" stroke-width="1.2">
      <rect x="284" y="292" width="8" height="8" rx="1.8" style="animation:saltFall 1.5s ease-in infinite"/>
      <rect x="296" y="292" width="7" height="7" rx="1.6" style="animation:saltFall 1.5s ease-in .2s infinite"/>
      <rect x="306" y="294" width="8" height="8" rx="1.8" style="animation:saltFall 1.5s ease-in .42s infinite"/>
      <rect x="290" y="296" width="7" height="7" rx="1.6" style="animation:saltFall 1.5s ease-in .65s infinite"/>
      <rect x="300" y="297" width="8" height="8" rx="1.8" style="animation:saltFall 1.5s ease-in .88s infinite"/>
      <rect x="280" y="300" width="7" height="7" rx="1.6" style="animation:saltFall 1.5s ease-in 1.1s infinite"/>
      <rect x="310" y="298" width="6" height="6" rx="1.4" style="animation:saltFall 1.5s ease-in 1.3s infinite"/>
    </g>

    <text x="202" y="552" text-anchor="middle" font-size="22" font-weight="900" fill="#3d1f33" font-family="system-ui" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">2% SALT, NOT MORE</text>
    <text x="202" y="578" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a01e52" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.45s">20 g of salt for every 1 kg of beet and garlic</text>

    <g>
      <rect x="34" y="594" width="337" height="52" rx="13" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
      <text x="202" y="616" text-anchor="middle" font-size="12.5" font-weight="900" fill="#3d1f33" font-family="system-ui">NO IODINE</text>
      <text x="202" y="634" text-anchor="middle" font-size="11" font-weight="600" fill="#8a7284" font-family="system-ui">Iodized salt stops the ferment. Use coarse salt.</text>
    </g>
  </svg></div></div><div class="cell"><div class="lbl">CENA 5</div><div class="box"><svg class="scene" id="s5" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bWedge5" cx="38%" cy="26%" r="74%">
        <stop offset="0%" stop-color="#e0709e"/>
        <stop offset="55%" stop-color="#a52a5a"/>
        <stop offset="100%" stop-color="#6d1436"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fbf1f6"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#a8899a" font-family="system-ui" letter-spacing="2">WHAT HAPPENS INSIDE</text>

    <!-- spinning beet wedge -->
    <g transform="translate(202,258)"><g style="animation:spin3d 5.5s linear infinite">
      <polygon points="0,-58 46,-14 26,54 -26,54 -46,-14" fill="url(#bWedge5)"/>
      <polygon points="0,-58 46,-14 0,4 -46,-14" fill="#c94d78" opacity=".55"/>
      <polygon points="0,4 26,54 -26,54" fill="#8f2450" opacity=".7"/>
      <ellipse cx="-12" cy="-20" rx="10" ry="7" fill="#f0a8c8" opacity=".35"/>
    </g></g>

    <!-- bacteria rings -->
    <g transform="translate(202,258)">
      <g style="animation:spinFlat 6.2s linear infinite">
        <circle r="108" fill="none" stroke="#e6cad9" stroke-width="1.4" stroke-dasharray="4 8"/>
        <circle cx="0" cy="-108" r="7" fill="#a01e52"/>
        <circle cx="94" cy="55" r="5.4" fill="#c94d78"/>
        <circle cx="-80" cy="74" r="5" fill="#8f2450"/>
      </g>
      <g style="animation:spinRev 4.2s linear infinite">
        <circle r="80" fill="none" stroke="#eedae6" stroke-width="1.2" stroke-dasharray="3 7"/>
        <circle cx="0" cy="80" r="6" fill="#0f6e56"/>
        <circle cx="-68" cy="-42" r="5" fill="#2b7d5f"/>
      </g>
      <g style="animation:spinFlat 2.8s linear infinite">
        <circle r="53" fill="none" stroke="#f2e2ec" stroke-width="1" stroke-dasharray="3 6"/>
        <circle cx="53" cy="0" r="5.6" fill="#c2551f"/>
      </g>
      <circle r="126" fill="none" stroke="#a01e52" stroke-width="1.6" opacity=".45" style="animation:pulseRing 2.8s ease-out infinite"/>
    </g>

    <!-- before / after -->
    <g transform="translate(0,404)">
      <g style="animation:fadeSlide .6s ease both; animation-delay:.2s">
        <rect x="38" y="0" width="156" height="96" rx="13" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
        <text x="116" y="26" text-anchor="middle" font-size="11" font-weight="900" fill="#a8899a" font-family="system-ui" letter-spacing="1.2">DAY 1</text>
        <g transform="translate(116,58)">
          <polygon points="0,-18 14,11 -14,11" fill="#c94d78" opacity=".75"/>
          <ellipse cx="24" cy="4" rx="9" ry="14" fill="#f8f1de"/>
        </g>
        <text x="116" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8a7284" font-family="system-ui">pale · sharp garlic</text>
      </g>

      <g style="animation:fadeSlide .6s ease both; animation-delay:.45s">
        <rect x="211" y="0" width="156" height="96" rx="13" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
        <text x="289" y="26" text-anchor="middle" font-size="11" font-weight="900" fill="#a01e52" font-family="system-ui" letter-spacing="1.2">WEEK 2</text>
        <g transform="translate(289,58)">
          <polygon points="0,-18 14,11 -14,11" fill="#7a1030"/>
          <ellipse cx="24" cy="4" rx="9" ry="14" fill="#e8dcc2"/>
        </g>
        <text x="289" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8a7284" font-family="system-ui">deep purple · mellow</text>
      </g>

      <path d="M196,48 L208,48" stroke="#c9a8bc" stroke-width="2.4" stroke-linecap="round"/>
      <polygon points="208,48 200,43 200,53" fill="#c9a8bc"/>
    </g>

    <text x="202" y="540" text-anchor="middle" font-size="17" font-weight="900" fill="#3d1f33" font-family="system-ui" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">THE GARLIC MELLOWS OUT</text>
    <text x="202" y="564" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.45s">Raw garlic burns. Fermented garlic turns sweet.</text>

    <g>
      <rect x="34" y="578" width="337" height="68" rx="13" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
      <text x="202" y="602" text-anchor="middle" font-size="12" font-weight="900" fill="#a01e52" font-family="system-ui">The colour comes from betalain</text>
      <text x="202" y="620" text-anchor="middle" font-size="11" font-weight="600" fill="#8a7284" font-family="system-ui">It leaks out of the beet and paints everything</text>
      <text x="202" y="638" text-anchor="middle" font-size="11" font-weight="600" fill="#8a7284" font-family="system-ui">purple — the onion trick, beetroot style</text>
    </g>
  </svg></div></div><div class="cell"><div class="lbl">CENA 6</div><div class="box"><svg class="scene" id="s6" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fbf1f6"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#a8899a" font-family="system-ui" letter-spacing="2">HOW LONG · IN WEEKS</text>

    <!-- clock -->
    <g transform="translate(202,208)">
      <circle r="108" fill="#fff" stroke="#e6d4de" stroke-width="3"/>
      <circle r="98" fill="none" stroke="#f2e4ec" stroke-width="1.4"/>
      <g stroke="#c9a8bc" stroke-width="2.4" stroke-linecap="round">
        <path d="M0,-88 L0,-78"/><path d="M0,88 L0,78"/><path d="M-88,0 L-78,0"/><path d="M88,0 L78,0"/>
      </g>
      <g stroke="#a01e52" stroke-width="6" stroke-linecap="round" style="animation:clockTick 2.2s ease-in-out infinite; transform-origin:0 0">
        <path d="M0,0 L0,-56"/>
      </g>
      <g stroke="#3d1f33" stroke-width="5" stroke-linecap="round" style="animation:clockTick 5.4s ease-in-out infinite; transform-origin:0 0">
        <path d="M0,0 L44,22"/>
      </g>
      <circle r="7" fill="#3d1f33"/>
      <text y="52" text-anchor="middle" font-size="15" font-weight="900" fill="#a01e52" font-family="system-ui">WEEKS</text>
    </g>

    <!-- timeline in weeks -->
    <g transform="translate(0,378)">
      <line x1="52" y1="40" x2="353" y2="40" stroke="#eedce6" stroke-width="4" stroke-linecap="round"/>
      <line x1="52" y1="40" x2="353" y2="40" stroke="#a01e52" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="301" stroke-dashoffset="301" style="animation:drawLine 2.6s ease-out .4s forwards"/>

      <g style="animation:popInSeq .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.5s">
        <circle cx="52" cy="40" r="11" fill="#fff" stroke="#a01e52" stroke-width="3.4"/>
        <text x="52" y="76" text-anchor="middle" font-size="11" font-weight="900" fill="#3d1f33" font-family="system-ui">WEEK 1</text>
        <text x="52" y="94" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8a7284" font-family="system-ui">counter</text>
      </g>
      <g style="animation:popInSeq .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.95s">
        <circle cx="202" cy="40" r="11" fill="#fff" stroke="#a01e52" stroke-width="3.4"/>
        <text x="202" y="76" text-anchor="middle" font-size="11" font-weight="900" fill="#3d1f33" font-family="system-ui">WEEK 2</text>
        <text x="202" y="94" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8a7284" font-family="system-ui">fridge</text>
      </g>
      <g style="animation:popInSeq .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay:1.4s">
        <circle cx="353" cy="40" r="11" fill="#a01e52" stroke="#a01e52" stroke-width="3.4"/>
        <text x="353" y="76" text-anchor="middle" font-size="11" font-weight="900" fill="#3d1f33" font-family="system-ui">WEEK 3+</text>
        <text x="353" y="94" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8a7284" font-family="system-ui">months</text>
      </g>
    </g>

    <text x="202" y="502" text-anchor="middle" font-size="16" font-weight="900" fill="#3d1f33" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.3s">READY IN 1 TO 2 WEEKS</text>
    <text x="202" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.5s">One week on the counter, one week in the fridge</text>

    <g>
      <rect x="34" y="538" width="337" height="76" rx="13" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
      <text x="202" y="564" text-anchor="middle" font-size="12" font-weight="900" fill="#3d1f33" font-family="system-ui">Week 1: room temperature, 18-22 °C</text>
      <text x="202" y="586" text-anchor="middle" font-size="11" font-weight="600" fill="#8a7284" font-family="system-ui">Keep everything under the liquid. Burp the jar daily.</text>
      <text x="202" y="606" text-anchor="middle" font-size="11" font-weight="600" fill="#8a7284" font-family="system-ui">Week 2: taste it — then move it to the fridge.</text>
