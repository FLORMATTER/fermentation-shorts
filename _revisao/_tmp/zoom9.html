<!DOCTYPE html><html><head><meta charset="utf-8"><style>

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow:hidden; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh;
  }

  /* ══ THE FRAME — native 1080x1920, full bleed, NO rounded corners, NO shadow ══
     This IS the recording canvas: exactly what YouTube wants for a Short.
     In an OBS Browser Source set to 1080x1920 the scale below resolves to 1
     and you record pixel for pixel. On a normal monitor it only shrinks so
     you can preview it. Nothing else changes. */
  #stage {
    position:relative; width:1080px; height:1920px;
    background:#f7f0f4; overflow:hidden;
    transform-origin:center center;
    flex:none;
  }

  /* the inner SVGs keep the series' 405x720 coordinate space and are drawn
     into the full 1080x1920 frame — vector, so it stays razor sharp.
     405x720 and 1080x1920 are the same 9:16 ratio: nothing is stretched. */
  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:11px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#a01e52; transition:width .2s linear; }

  .tag {
    position:absolute; top:59px; left:0; right:0; text-align:center;
    font-size:27px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:48px; right:43px; font-size:24px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:219px; left:0; right:0; display:flex;
        justify-content:center; gap:24px; z-index:40; opacity:0; transition:opacity .3s; }
  /* controls appear on mouse move and fade out by themselves, so a hands-off
     recording never has buttons on top of the drawing */
  #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:31px;
    font-weight:700; font-family:inherit; padding:21px 40px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.62);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:43px; }
  .cover.hide { display:none; }
  .cover button { width:208px; height:208px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:72px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:13px; }
  .cover p { color:#fff; font-size:32px; font-weight:700; letter-spacing:.08em; opacity:.9;
             text-transform:uppercase; text-align:center; line-height:1.7; }
  .cover p b { color:#f0a8c8; }
  .cover .hint { font-size:24px; font-weight:600; opacity:.55; letter-spacing:.04em; text-transform:none; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:37px 59px 45px; font-size:43px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:32px; font-weight:500; opacity:.72; margin-top:11px; letter-spacing:.01em; }

  /* ══ keyframes — declared once, shared by every inline SVG scene ══ */
  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-8px) rotate(1.4deg) }
  }
  @keyframes holdSteady {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-5px) }
  }
  @keyframes chopDown {
    0%   { transform: translateY(-20px) rotate(-15deg) }
    50%  { transform: translateY(8px) rotate(5deg) }
    100% { transform: translateY(-20px) rotate(-15deg) }
  }
  @keyframes pressDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(15px) }
  }
  @keyframes pourSalt {
    0%,100% { transform: translateY(-14px) rotate(-20deg) }
    34%     { transform: translateY(4px) rotate(-4deg) }
    64%     { transform: translateY(1px) rotate(1deg) }
  }
  @keyframes saltFall {
    0%   { transform: translateY(0) translateX(0); opacity: 0 }
    15%  { opacity: .95 }
    100% { transform: translateY(118px) translateX(6px); opacity: 0 }
  }
  @keyframes liquidRise {
    0%   { transform: translateY(56px); opacity: 0 }
    100% { transform: translateY(0); opacity: .82 }
  }
  @keyframes bubbleRise {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    28%  { opacity: .9 }
    100% { transform: translateY(-96px) scale(1.25); opacity: 0 }
  }
  @keyframes soakStain {
    0%   { opacity: 0; transform: scaleX(.7) }
    100% { opacity: .9; transform: scaleX(1) }
  }
  @keyframes spin3d {
    0%   { transform: rotateY(0deg) }
    100% { transform: rotateY(360deg) }
  }
  @keyframes spinFlat {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(360deg) }
  }
  @keyframes spinRev {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(-360deg) }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.6); opacity: .7 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes clockTick {
    0%,100% { transform: rotate(0deg) }
    50%     { transform: rotate(30deg) }
  }
  @keyframes floatJar {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-9px) rotate(1.2deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes drawLine {
    0%   { stroke-dashoffset: 301 }
    100% { stroke-dashoffset: 0 }
  }
