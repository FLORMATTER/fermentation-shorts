<title>Shorts animado — Cucumber with garlic (fermented)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#f4faf3; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .18s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:5px; background:rgba(0,0,0,.1); z-index:40; }
  #progress { height:100%; width:0; background:#1d9e75; transition:width .1s linear; }

  .tag {
    position:absolute; top:26px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; opacity:.45; z-index:30; color:#04342c;
  }
  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.7; margin-top:4px; }

  .wm { position:absolute; top:22px; right:18px; font-size:10px; font-weight:800;
        letter-spacing:.1em; opacity:.3; z-index:35; text-transform:uppercase; color:#04342c; }

  .speed-badge {
    position:absolute; top:52px; left:18px; z-index:36;
    background:#d97706; color:#fff;
    font-size:11px; font-weight:800; letter-spacing:.1em;
    padding:5px 11px; border-radius:999px;
    animation:pulseBadge 1.1s ease-in-out infinite;
  }
  @keyframes pulseBadge { 0%,100%{opacity:1} 50%{opacity:.55} }

  .ui { position:absolute; bottom:86px; left:0; right:0; display:flex;
        justify-content:center; gap:10px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.78); color:#fff; font-size:12px;
    font-weight:700; font-family:inherit; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; }
  .cover.hide { display:none; }
  .cover button { width:80px; height:80px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:28px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }

  @keyframes chop2x { 0%,100%{transform:rotate(-16deg)} 50%{transform:rotate(8deg)} }
  @keyframes pour2x { 0%{transform:translateY(-30px) scaleY(.6);opacity:0} 100%{transform:translateY(0) scaleY(1);opacity:1} }
  @keyframes riseFast { 0%{transform:translateY(0);opacity:0} 25%{opacity:.9} 100%{transform:translateY(-110px);opacity:0} }
  @keyframes wobble { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2.5deg)} }
  @keyframes tick { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
</style>
</head>

<script>
const scenes = [
  { id:'s0', ms:5800, tag:'CUCUMBER+GARLIC 1 / 7', cap:'It is not spoiled', sub:'blue garlic is a reaction, not mould', color:'#3a8fb0' },
  { id:'s1', ms:6200, tag:'CUCUMBER+GARLIC 2 / 7', cap:'One jar, two directions', sub:'the cucumber floats, the garlic sinks', color:'#639922' },
  { id:'s2', ms:6600, tag:'CUCUMBER+GARLIC 3 / 7', cap:'Stronger than cabbage', sub:'and the reason is all that water', color:'#8a6a2f' },
  { id:'s3', ms:6600, tag:'CUCUMBER+GARLIC 4 / 7', cap:'The garlic is not just flavour', sub:'it carries the culture in with it', color:'#1d9e75' },
  { id:'s4', ms:6800, tag:'CUCUMBER+GARLIC 5 / 7', cap:'Why the garlic does not stop it', sub:'the defence is only temporary', color:'#d9b872' },
  { id:'s5', ms:6600, tag:'CUCUMBER+GARLIC 6 / 7', cap:'This is the good sign', sub:'the colour arrives with the acid', color:'#1f5f7d' },
  { id:'s6', ms:6400, tag:'CUCUMBER+GARLIC 7 / 7', cap:'One last thing', sub:'trim the blossom end before you start', color:'#2f5c0d' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 50;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Watch';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
