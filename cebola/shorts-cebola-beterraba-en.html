<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animação — Fermentação de Cebola com Beterraba</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdf6fa; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#a01e52; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; text-align:center; line-height:1.6; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; letter-spacing:.01em; }

  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-7px) rotate(1.4deg) }
  }
  @keyframes knifeChop {
    0%,100% { transform: translateY(-26px) rotate(-14deg) }
    42%     { transform: translateY(10px) rotate(3deg) }
  }
  @keyframes pourSalt {
    0%,100% { transform: translateY(-13px) rotate(-20deg) }
    34%     { transform: translateY(3px) rotate(-4deg) }
    64%     { transform: translateY(0) rotate(1deg) }
  }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0); opacity: 0 }
    15%  { opacity: .95 }
    100% { transform: translateY(98px) translateX(6px); opacity: 0 }
  }
  @keyframes massageL {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(13px,-6px) scale(.93,1.05) }
  }
  @keyframes massageR {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(-13px,-6px) scale(.93,1.05) }
  }
  @keyframes bleedDown {
    0%   { transform: scaleY(0); opacity: 0 }
    30%  { opacity: .8 }
    100% { transform: scaleY(1); opacity: .68 }
  }
  @keyframes spin3d {
    0%   { transform: rotateY(0deg) }
    100% { transform: rotateY(360deg) }
  }
  @keyframes spinFlat {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(360deg) }
  }
  @keyframes spinRev {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(-360deg) }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.6); opacity: .75 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes clockTick {
    0%,100% { transform: rotate(0deg) }
    50%     { transform: rotate(30deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes slideUp {
    0%   { transform: translateY(24px); opacity: 0 }
    100% { transform: translateY(0); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes riseSlow {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    30%  { opacity: .8 }
    100% { transform: translateY(-118px) scale(1.3); opacity: 0 }
  }
  @keyframes drawLine {
    0%   { stroke-dashoffset: 301 }
    100% { stroke-dashoffset: 0 }
  }
  @keyframes barFill {
    0%   { width: 60px }
    100% { width: 320px }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">ONION+BEET 1 / 8</div>
  <div class="wm">@yourchannel</div>

  <!-- ══════════ CENA 1 — OS DOIS JUNTOS ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bOnion" cx="36%" cy="28%" r="76%">
        <stop offset="0%" stop-color="#e0a8c8"/>

        <stop offset="78%" stop-color="#7c2f63"/>

      </radialGradient>
      <radialGradient id="bBeet" cx="36%" cy="28%" r="76%">
        <stop offset="0%" stop-color="#e0709e"/>
        <stop offset="50%" stop-color="#a52a5a"/>
        <stop offset="100%" stop-color="#6d1436"/>
      </radialGradient>
      <linearGradient id="bSkin" x1="0%" y1="0%" x2="100%" y2="60%">
        <stop offset="0%" stop-color="#f4d4a6"/>

        <stop offset="100%" stop-color="#b8843f"/>

    </defs>
    <rect width="405" height="720" fill="#fdf6fa"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">ONION + BEET</text>
    <ellipse cx="202" cy="518" rx="168" ry="44" fill="#ead4e0" opacity=".5"/>

    <!-- onion (left) -->
    <g transform="translate(124,382)"><g style="animation:floatUpDown 3.4s ease-in-out infinite">
      <g stroke="#c9a86e" stroke-width="1.6" stroke-linecap="round" opacity=".8">

        <ellipse rx="54" ry="54"/><ellipse rx="42" ry="43"/><ellipse rx="30" ry="31"/>
      </g>

        <path d="M18,-60 Q22,0 16,55"/>
      </g>
      <path d="M-63,8 Q-72,-30 -43,-55 Q-52,-15 -49,27Z" fill="url(#bSkin)" opacity=".9"/>
      <ellipse cy="-66" rx="11" ry="8" fill="#c9a86e"/>
      <path d="M0,-72 Q-2,-88 -1,-96" stroke="#c9a86e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-25" cy="-25" rx="19" ry="13" fill="#f0bcd8" opacity=".32" transform="rotate(-28 -25 -25)"/>
    </g></g>

    <!-- beet (right) -->
    <g transform="translate(282,388)"><g style="animation:floatUpDown 3.4s ease-in-out infinite; animation-delay:.5s">
      <ellipse rx="62" ry="66" fill="url(#bBeet)"/>
      <g fill="none" stroke="#4a0e26" stroke-width="1.3" opacity=".45">
        <ellipse rx="50" ry="54"/><ellipse rx="36" ry="40"/>
      </g>
      <g fill="none" stroke="#e88cb4" stroke-width="2.8" opacity=".4" stroke-linecap="round">
        <path d="M-34,-50 Q-40,0 -32,48"/>
        <path d="M-12,-62 Q-16,0 -11,58"/>
        <path d="M14,-62 Q18,0 13,56"/>
      </g>
      <!-- leaves -->
      <path d="M-6,-64 Q-30,-96 -16,-118" stroke="#5f8a34" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M6,-64 Q30,-96 20,-120" stroke="#6f9a3e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0,-66 Q2,-100 0,-124" stroke="#7aa844" stroke-width="4.4" fill="none" stroke-linecap="round"/>
      <path d="M-16,-118 Q-30,-124 -34,-112 Q-24,-106 -16,-118Z" fill="#6f9a3e"/>
      <path d="M20,-120 Q34,-126 38,-114 Q28,-108 20,-120Z" fill="#7aa844"/>
      <ellipse cx="-24" cy="-26" rx="18" ry="12" fill="#f0a8c8" opacity=".3" transform="rotate(-28 -24 -26)"/>
    </g></g>

    <!-- plus sign -->
    <g transform="translate(202,382)">
      <circle r="22" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
      <path d="M-9,0 L9,0 M0,-9 L0,9" stroke="#a01e52" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="202" y="584" text-anchor="middle" font-size="25" font-weight="900" fill="#3d1f33" font-family="system-ui" letter-spacing="-.6" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.25s">ONION + BEET</text>
    <text x="202" y="612" text-anchor="middle" font-size="13" font-weight="700" fill="#a01e52" font-family="system-ui" letter-spacing="2.6" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">THE PRETTIEST COMBINATION</text>
    <text x="202" y="638" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.7s">One gives the colour. The other gives the crunch.</text>
  </svg>

  <!-- ══════════ CENA 2 — CORTES DIFERENTES ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bSlice" cx="45%" cy="40%" r="62%">
        <stop offset="0%" stop-color="#fdf4f9"/>
        <stop offset="55%" stop-color="#f2d4e6"/>
        <stop offset="100%" stop-color="#c77aa8"/>
      </radialGradient>
      <radialGradient id="bCube" cx="36%" cy="28%" r="72%">
        <stop offset="0%" stop-color="#d0517f"/>
        <stop offset="55%" stop-color="#a52a5a"/>
        <stop offset="100%" stop-color="#6d1436"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf6fa"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">STEP 1 · TWO DIFFERENT CUTS</text>

    <!-- cutting board -->
    <rect x="42" y="392" width="321" height="32" rx="10" fill="#e8d5bd" stroke="#d3bb9c" stroke-width="1.8"/>

    <!-- LEFT: onion slices (thin) -->
    <g transform="translate(122,300)">
      <text y="-46" text-anchor="middle" font-size="11" font-weight="900" fill="#8e3a68" font-family="system-ui">ONION</text>
      <text y="-30" text-anchor="middle" font-size="10" font-weight="700" fill="#b08a9c" font-family="system-ui">thin slice · 3 mm</text>
      <g transform="translate(-18,10) rotate(-8)"><ellipse rx="34" ry="11" fill="url(#bSlice)" stroke="#a8478a" stroke-width="1.8"/></g>
      <g transform="translate(22,26) rotate(9)"><ellipse rx="34" ry="11" fill="url(#bSlice)" stroke="#8e3a68" stroke-width="1.8"/></g>
      <g transform="translate(-14,44) rotate(-4)"><ellipse rx="34" ry="11" fill="url(#bSlice)" stroke="#a8478a" stroke-width="1.8"/></g>
      <g transform="translate(24,60) rotate(12)"><ellipse rx="32" ry="10.5" fill="url(#bSlice)" stroke="#7c2f63" stroke-width="1.8"/></g>
    </g>

    <!-- RIGHT: beet cubes (pseudo-3D) -->
    <g transform="translate(284,300)">
      <text y="-46" text-anchor="middle" font-size="11" font-weight="900" fill="#8e3a68" font-family="system-ui">BEET</text>
      <text y="-30" text-anchor="middle" font-size="10" font-weight="700" fill="#b08a9c" font-family="system-ui">cube · 2 cm</text>
      <!-- cube 1 -->
      <g transform="translate(-20,6)">
        <polygon points="0,-20 26,-8 0,4 -26,-8" fill="#c94d78"/>
        <polygon points="-26,-8 0,4 0,30 -26,18" fill="#8f2450"/>
        <polygon points="26,-8 0,4 0,30 26,18" fill="#6d1436"/>
        <polygon points="0,-20 26,-8 0,4 -26,-8" fill="url(#bCube)" opacity=".35"/>
      </g>
      <!-- cube 2 -->
      <g transform="translate(24,28)">
        <polygon points="0,-20 26,-8 0,4 -26,-8" fill="#d05884"/>
        <polygon points="-26,-8 0,4 0,30 -26,18" fill="#96284f"/>
        <polygon points="26,-8 0,4 0,30 26,18" fill="#741636"/>
      </g>
      <!-- cube 3 -->
      <g transform="translate(-16,50)">
        <polygon points="0,-20 26,-8 0,4 -26,-8" fill="#c94d78"/>
        <polygon points="-26,-8 0,4 0,30 -26,18" fill="#8f2450"/>
        <polygon points="26,-8 0,4 0,30 26,18" fill="#6d1436"/>
      </g>
    </g>

    <!-- knife animating between them -->
    <g style="animation:knifeChop 1.6s ease-in-out infinite">
      <path d="M180,168 L262,168 L270,214 L172,214Z" fill="#d8dce0"/>
      <path d="M180,168 L262,168 L264,180 L178,180Z" fill="#eef1f4"/>
      <path d="M172,214 L270,214 L270,222 L172,222Z" fill="#8a6a4a"/>
    </g>

    <text x="202" y="452" text-anchor="middle" font-size="21" font-weight="900" fill="#3d1f33" font-family="system-ui" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">DIFFERENT CUTS</text>
    <text x="202" y="474" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a01e52" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.45s">Thin onion and beet in cubes — do not cut them the same</text>

    <rect x="40" y="494" width="325" height="110" rx="14" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
    <text x="202" y="520" text-anchor="middle" font-size="12.5" font-weight="900" fill="#3d1f33" font-family="system-ui">WHY DIFFERENT?</text>
    <text x="202" y="544" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui">Thin onion absorbs the colour fast and goes soft.</text>
    <text x="202" y="564" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui">Beet in cubes keeps its shape and its sweetness.</text>
    <text x="202" y="584" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a01e52" font-family="system-ui">Together: a contrast of texture in every bite.</text>

    <text x="202" y="632" text-anchor="middle" font-size="12" font-weight="700" fill="#b08a9c" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.6s">500 g in total: 300 g of onion + 200 g of beet</text>
  </svg>

  <!-- ══════════ CENA 3 — O SAL ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bBowl" cx="40%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f4ecf1"/>
        <stop offset="100%" stop-color="#e0d2dc"/>

    </defs>
    <rect width="405" height="720" fill="#fdf6fa"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">STEP 2 · THE SALT</text>
    <ellipse cx="202" cy="516" rx="164" ry="42" fill="#ecd8e4" opacity=".55"/>

    <path d="M78,404 Q202,392 326,404 Q316,516 202,534 Q88,516 78,404Z" fill="url(#bBowl)" stroke="#d8c6d2" stroke-width="2"/>
    <ellipse cx="202" cy="404" rx="124" ry="30" fill="#fdf8fb" stroke="#d8c6d2" stroke-width="2"/>

    <!-- mixed slices and cubes in bowl -->
    <g>
      <g transform="translate(150,410) rotate(-10)"><ellipse rx="30" ry="10" fill="#f2d4e6" stroke="#a8478a" stroke-width="1.6"/></g>
      <g transform="translate(214,406) rotate(8)">
        <polygon points="0,-13 17,-5 0,3 -17,-5" fill="#c94d78"/>
        <polygon points="-17,-5 0,3 0,20 -17,12" fill="#8f2450"/>
        <polygon points="17,-5 0,3 0,20 17,12" fill="#6d1436"/>
      </g>
      <g transform="translate(178,428) rotate(14)"><ellipse rx="30" ry="10" fill="#f0c6dd" stroke="#8e3a68" stroke-width="1.6"/></g>
      <g transform="translate(240,432) rotate(-7)">
        <polygon points="0,-13 17,-5 0,3 -17,-5" fill="#d05884"/>
        <polygon points="-17,-5 0,3 0,20 -17,12" fill="#96284f"/>
        <polygon points="17,-5 0,3 0,20 17,12" fill="#741636"/>
      </g>
      <g transform="translate(144,442) rotate(5)"><ellipse rx="30" ry="10" fill="#f2d4e6" stroke="#a8478a" stroke-width="1.6"/></g>
      <g transform="translate(200,456) rotate(-13)"><ellipse rx="31" ry="10" fill="#f0c6dd" stroke="#8e3a68" stroke-width="1.6"/></g>
    </g>

    <!-- salt hand -->
    <g style="animation:pourSalt 2.4s ease-in-out infinite">
      <ellipse cx="300" cy="200" rx="34" ry="27" fill="#f2b992" transform="rotate(-16 300 200)"/>
      <ellipse cx="300" cy="200" rx="34" ry="27" fill="none" stroke="#d38f66" stroke-width="1.5" transform="rotate(-16 300 200)"/>
      <ellipse cx="272" cy="180" rx="13" ry="9" fill="#f0b58e" transform="rotate(-42 272 180)"/>
      <ellipse cx="292" cy="174" rx="13" ry="9" fill="#f0b58e" transform="rotate(-24 292 174)"/>
      <ellipse cx="312" cy="176" rx="13" ry="9" fill="#f0b58e" transform="rotate(-6 312 176)"/>
      <ellipse cx="330" cy="188" rx="13" ry="9" fill="#f0b58e" transform="rotate(14 330 188)"/>
      <ellipse cx="290" cy="192" rx="19" ry="7" fill="#fff" opacity=".97"/>
      <ellipse cx="290" cy="188" rx="14" ry="6" fill="#fff"/>
      <ellipse cx="290" cy="185" rx="8" ry="3.6" fill="#fff"/>
    </g>

    <!-- salt crystals -->
    <g fill="#fff" stroke="#e0d2dc" stroke-width=".7">
      <rect x="284" y="204" width="7" height="7" rx="1.6" style="animation:fall 1.5s ease-in infinite"/>
      <rect x="296" y="204" width="6" height="6" rx="1.4" style="animation:fall 1.5s ease-in infinite; animation-delay:.2s"/>
      <rect x="306" y="206" width="7" height="7" rx="1.6" style="animation:fall 1.5s ease-in infinite; animation-delay:.42s"/>
      <rect x="290" y="208" width="6" height="6" rx="1.4" style="animation:fall 1.5s ease-in infinite; animation-delay:.65s"/>
      <rect x="300" y="209" width="7" height="7" rx="1.6" style="animation:fall 1.5s ease-in infinite; animation-delay:.88s"/>
      <rect x="280" y="208" width="6" height="6" rx="1.4" style="animation:fall 1.5s ease-in infinite; animation-delay:1.1s"/>
    </g>

    <rect x="40" y="542" width="325" height="76" rx="14" fill="#fff" stroke="#e6d4de" stroke-width="2"/>
    <text x="202" y="566" text-anchor="middle" font-size="17" font-weight="900" fill="#3d1f33" font-family="system-ui">500 g = 10 g of salt</text>
    <text x="202" y="587" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a01e52" font-family="system-ui">2% of the total weight — no more, no less</text>
    <text x="202" y="607" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui">Non-iodized salt. Iodine kills the ferment.</text>

    <text x="202" y="636" text-anchor="middle" font-size="12" font-weight="700" fill="#b08a9c" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.45s">Weigh both together — the salt is on the final weight</text>
  </svg>

  <!-- ══════════ CENA 4 — MASSAGEAR ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bBowl2" cx="40%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f4ecf1"/>
        <stop offset="100%" stop-color="#e0d2dc"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf6fa"/>

<script>
const scenes = [
  { id:'s0', ms:5500, tag:'ONION+BEET 1 / 8', cap:'Onion with beet', sub:'one gives the colour, the other gives the crunch', color:'#a01e52' },
  { id:'s1', ms:7000, tag:'ONION+BEET 2 / 8', cap:'Two different cuts', sub:'thin onion · beet in cubes', color:'#a01e52' },
  { id:'s2', ms:6500, tag:'ONION+BEET 3 / 8', cap:'500 g = 10 g of salt', sub:'2% of the weight, non-iodized', color:'#a8478a' },
  { id:'s3', ms:7000, tag:'ONION+BEET 4 / 8', cap:'Massage for 5 minutes', sub:'with no water added', color:'#c2551f' },
  { id:'s4', ms:7500, tag:'ONION+BEET 5 / 8', cap:'Build it in layers', sub:'one finger at a time', color:'#8f2450' },
  { id:'s5', ms:7000, tag:'ONION+BEET 6 / 8', cap:'The onion turns shocking pink', sub:'betalain dyes everything', color:'#0f6e56' },
  { id:'s6', ms:6500, tag:'ONION+BEET 7 / 8', cap:'Ready in 5 to 7 days', sub:'2 days on the counter, then the fridge', color:'#3d1f33' },
  { id:'s7', ms:6500, tag:'ONION+BEET 8 / 8', cap:'Pink, crunchy, ready', sub:'the prettiest pair in the series', color:'#3d1f33' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Watch';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
