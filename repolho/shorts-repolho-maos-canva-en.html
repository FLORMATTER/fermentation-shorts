<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animação — Chucrute em 7 dias (só as mãos, sem rosto)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#f4efe4; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#3b6d11; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85;
    text-transform:uppercase; text-align:center; line-height:1.6; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; }

  @keyframes swayLeaf {
    0%,100% { transform: translate(0,0) rotate(0deg) }
    50%     { transform: translate(3px,-4px) rotate(4deg) }
  }
  @keyframes washRock {
    0%,100% { transform: translate(-15px,3px) rotate(-6deg) }
    50%     { transform: translate(15px,-5px) rotate(6deg) }
  }
  @keyframes pressDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(16px) }
  }
  @keyframes holdSteady {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-5px) }
  }
  @keyframes chopDown {
    0%   { transform: translateY(-18px) rotate(-16deg) }
    50%  { transform: translateY(7px) rotate(5deg) }
    100% { transform: translateY(-18px) rotate(-16deg) }
  }
  @keyframes slideCut {
    0%   { transform: translate(0,0) rotate(-3deg) }
    100% { transform: translate(-26px,12px) rotate(-24deg) }
  }
  @keyframes massageL {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(12px,-6px) scale(.91,1.07) }
  }
  @keyframes massageR {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(-12px,-6px) scale(.91,1.07) }
  }
  @keyframes pourSalt {
    0%,100% { transform: translateY(-15px) rotate(-24deg) }
    35%     { transform: translateY(5px) rotate(-5deg) }
    65%     { transform: translateY(1px) rotate(3deg) }
  }
  @keyframes saltFall {
    0%   { transform: translateY(0) translateX(0); opacity: 0 }
    16%  { opacity: .95 }
    100% { transform: translateY(98px) translateX(7px); opacity: 0 }
  }
  @keyframes soakStain {
    0%   { opacity: 0; transform: scaleX(.7) }
    100% { opacity: .9; transform: scaleX(1) }
  }
  @keyframes dropFall {
    0%   { transform: translateY(0) scaleY(.6); opacity: 0 }
    22%  { opacity: .9 }
    100% { transform: translateY(104px) scaleY(1.4); opacity: 0 }
  }
  @keyframes bubbleRise {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    28%  { opacity: .9 }
    100% { transform: translateY(-96px) scale(1.25); opacity: 0 }
  }
  @keyframes liquidRise {
    0%   { transform: translateY(60px); opacity: 0 }
    100% { transform: translateY(0); opacity: .86 }
  }
  @keyframes floatJar {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-9px) rotate(1.2deg) }
  }
  @keyframes counterTurn {
    0%,100% { transform: rotate(0deg) }
    50%     { transform: rotate(180deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes drawLine {
    0%   { stroke-dashoffset: 301 }
    100% { stroke-dashoffset: 0 }
  }
</style>
</head>

    <button onclick="play()">▶</button>

<script>
const scenes = [
  { id:'s0', ms:6000, tag:'SAUERKRAUT 1 / 8', cap:'Hands only. No face.', sub:'1 cabbage, 7 days of waiting', color:'#2c2c2a' },
  { id:'s1', ms:6000, tag:'SAUERKRAUT 2 / 8', cap:'Wash and pull the outer leaves', sub:'cold water, no soap', color:'#2b6a80' },
  { id:'s2', ms:6500, tag:'SAUERKRAUT 3 / 8', cap:'Cut it thin, 2 to 3 mm', sub:'too thick stays tough', color:'#3b6d11' },
  { id:'s3', ms:7500, tag:'SAUERKRAUT 4 / 8', cap:'Massage for 10 minutes', sub:'no water — it comes out of the cabbage', color:'#d85a30' },
  { id:'s4', ms:7000, tag:'SAUERKRAUT 5 / 8', cap:'30 g of salt, measured in your hand', sub:'2% of the weight, always non-iodized', color:'#ba7517' },
  { id:'s5', ms:6000, tag:'SAUERKRAUT 6 / 8', cap:'The hand presses it down', sub:'the liquid has to cover everything', color:'#0f6e56' },
  { id:'s6', ms:6500, tag:'SAUERKRAUT 7 / 8', cap:'Flip the jar every day', sub:'so the salt does not sit only at the bottom', color:'#0f6e56' },
  { id:'s7', ms:6500, tag:'SAUERKRAUT 8 / 8', cap:'7 days and it is ready', sub:'keep it in the fridge for months', color:'#3b6d11' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Watch';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
