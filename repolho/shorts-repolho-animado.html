<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts animado — Repolho fermentado</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#f7f5ef; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .5s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.1); z-index:40; }
  #progress { height:100%; width:0; background:#3b6d11; transition:width .2s linear; }

  .tag {
    position:absolute; top:26px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; opacity:.45; z-index:30; color:#2c2c2a;
  }
  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.82); color:#fff;
    padding:14px 22px 17px; font-size:15px; font-weight:700;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.7; margin-top:4px; }

  .wm { position:absolute; top:22px; right:18px; font-size:10px; font-weight:800;
        letter-spacing:.1em; opacity:.3; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:86px; left:0; right:0; display:flex;
        justify-content:center; gap:10px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.78); color:#fff; font-size:12px;
    font-weight:700; font-family:inherit; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; }
  .cover.hide { display:none; }
  .cover button { width:80px; height:80px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:28px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }

  @keyframes drop { 0%{transform:translateY(-14px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  @keyframes rise { 0%{transform:translateY(0);opacity:0} 30%{opacity:.9} 100%{transform:translateY(-95px);opacity:0} }
  @keyframes chop { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(4deg)} }
  @keyframes squish { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.06,.92)} }
  @keyframes wobble { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2.5deg)} }
  @keyframes pulse { 0%,100%{opacity:.9} 50%{opacity:.4} }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">CENA 1 / 6</div>
  <div class="wm">@seucanal</div>

  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#eaf3de"/>
    <circle cx="202" cy="300" r="140" fill="#c0dd97" opacity=".55"/>
    <g transform="translate(202,300)">
      <ellipse cx="0" cy="0" rx="105" ry="88" fill="#eaf3de"/>
      <ellipse cx="0" cy="0" rx="92" ry="77" fill="#d4e8b8"/>
      <path d="M0,-77 Q38,-38 0,0 Q-38,-38 0,-77Z" fill="#97c459" opacity=".85"/>
      <path d="M0,0 Q38,38 0,77 Q-38,38 0,0Z" fill="#97c459" opacity=".85"/>
      <path d="M-92,0 Q-42,-30 0,0 Q-42,30 -92,0Z" fill="#97c459" opacity=".85"/>
      <path d="M92,0 Q42,-30 0,0 Q42,30 92,0Z" fill="#97c459" opacity=".85"/>
      <ellipse cx="0" cy="0" rx="26" ry="22" fill="#c0dd97"/>
      <ellipse cx="-34" cy="-30" rx="26" ry="15" fill="#fff" opacity=".4"/>
    </g>
    <g transform="translate(300,196)">
      <rect x="-5" y="0" width="10" height="52" rx="4" fill="#5f5e5a" style="animation:chop 1.1s ease-in-out infinite"/>
      <path d="M-4,52 L4,52 L6,120 L-6,120Z" fill="#b4b2a9" style="animation:chop 1.1s ease-in-out infinite"/>
    </g>
  </svg>

  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#e1f5ee"/>
    <g transform="translate(202,290)">
      <ellipse cx="0" cy="90" rx="150" ry="26" fill="#9fe1cb" opacity=".5"/>
      <ellipse cx="0" cy="0" rx="112" ry="82" fill="#f4fbf8" stroke="#1d9e75" stroke-width="3"/>
      <path d="M-92,-24 Q0,-56 92,-24" stroke="#5dcaa5" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-96,4 Q0,-28 96,4" stroke="#5dcaa5" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-88,32 Q0,0 88,32" stroke="#5dcaa5" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-70,58 Q0,30 70,58" stroke="#5dcaa5" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <g style="animation:drop 1.3s ease-out infinite">
      <circle cx="196" cy="120" r="4" fill="#fff"/>
      <circle cx="214" cy="108" r="3.4" fill="#fff"/>
      <circle cx="180" cy="106" r="3" fill="#fff"/>
      <circle cx="228" cy="128" r="3.6" fill="#fff"/>
    </g>
  </svg>

  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#faeeda"/>
    <ellipse cx="202" cy="440" rx="160" ry="34" fill="#fac775" opacity=".55"/>
    <g transform="translate(120,250)">
      <ellipse cx="0" cy="0" rx="78" ry="62" fill="#eaf3de"/>
      <ellipse cx="0" cy="0" rx="66" ry="52" fill="#d4e8b8"/>
      <path d="M0,-52 Q26,-26 0,0 Q-26,-26 0,-52Z" fill="#97c459" opacity=".8"/>
      <path d="M-66,0 Q-30,-20 0,0 Q-30,20 -66,0Z" fill="#97c459" opacity=".8"/>
      <text x="0" y="8" text-anchor="middle" font-size="30" font-weight="700" fill="#3b6d11" font-family="system-ui">1,5</text>
      <text x="0" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#3b6d11" font-family="system-ui">kg</text>
    </g>
    <text x="222" y="262" text-anchor="middle" font-size="46" font-weight="800" fill="#ba7517" font-family="system-ui">=</text>
    <g transform="translate(300,250)">
      <path d="M-52,-34 L52,-34 L44,52 Q0,66 -44,52Z" fill="#f7f5ef" stroke="#ba7517" stroke-width="3.5"/>
      <rect x="-46" y="-24" width="92" height="14" rx="4" fill="#fac775"/>
      <text x="0" y="22" text-anchor="middle" font-size="28" font-weight="800" fill="#854f0b" font-family="system-ui">30</text>
      <text x="0" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#854f0b" font-family="system-ui">gramas</text>
    </g>
    <g style="animation:drop 1.2s ease-out infinite">
      <circle cx="300" cy="150" r="3.6" fill="#fff" stroke="#ef9f27" stroke-width="1.4"/>
      <circle cx="288" cy="134" r="3" fill="#fff" stroke="#ef9f27" stroke-width="1.4"/>
      <circle cx="312" cy="130" r="3.2" fill="#fff" stroke="#ef9f27" stroke-width="1.4"/>
      <circle cx="322" cy="150" r="2.8" fill="#fff" stroke="#ef9f27" stroke-width="1.4"/>
    </g>
  </svg>

  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#faece7"/>
    <ellipse cx="202" cy="500" rx="175" ry="40" fill="#f0997b" opacity=".4"/>
    <g transform="translate(202,300)">
      <ellipse cx="0" cy="0" rx="132" ry="100" fill="#f5c4b3"/>
      <ellipse cx="0" cy="-6" rx="118" ry="88" fill="#faece7"/>
      <g transform="translate(-42,-38)">
        <path d="M-24,0 Q0,-22 24,0 Q0,22 -24,0Z" fill="#f0997b" style="animation:squish 1.1s ease-in-out infinite"/>
      </g>
      <g transform="translate(42,-38)">
        <path d="M-24,0 Q0,-22 24,0 Q0,22 -24,0Z" fill="#f0997b" style="animation:squish 1.1s ease-in-out infinite"/>
      </g>
      <path d="M-40,52 Q0,78 40,52" stroke="#d85a30" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5"/>
      <path d="M-52,70 Q0,98 52,70" stroke="#d85a30" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".35"/>
      <circle cx="0" cy="30" r="7" fill="#d85a30" opacity=".45" style="animation:pulse 1.2s ease-in-out infinite"/>
      <circle cx="-26" cy="44" r="5" fill="#d85a30" opacity=".4" style="animation:pulse 1.5s ease-in-out infinite"/>
      <circle cx="30" cy="40" r="6" fill="#d85a30" opacity=".4" style="animation:pulse 1.3s ease-in-out infinite"/>
    </g>
  </svg>

  <svg class="scene" id="s4" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#eeedfe"/>
    <ellipse cx="202" cy="530" rx="150" ry="34" fill="#cecbf6" opacity=".5"/>
    <g transform="translate(202,300)">
      <path d="M-104,110 L-104,-40 Q-104,-58 -86,-58 L86,-58 Q104,-58 104,-40 L104,110 Z"
            fill="#f7f5ef" stroke="#7f77dd" stroke-width="4"/>
      <rect x="-104" y="-58" width="208" height="24" rx="6" fill="#cecbf6" stroke="#7f77dd" stroke-width="4"/>
      <path d="M-104,40 L-104,-14 Q-104,-30 -86,-30 L86,-30 Q104,-30 104,-14 L104,40 Z" fill="#c0dd97" opacity=".9"/>
      <path d="M-92,26 Q0,-2 92,26 Q0,54 -92,26Z" fill="#97c459" opacity=".85"/>
      <g style="animation:rise 2.1s ease-out infinite">
        <circle cx="-58" cy="30" r="5" fill="#fff" opacity=".8"/>
        <circle cx="-24" cy="40" r="4" fill="#fff" opacity=".8"/>
        <circle cx="18" cy="34" r="4.5" fill="#fff" opacity=".8"/>
        <circle cx="54" cy="42" r="3.6" fill="#fff" opacity=".8"/>
      </g>
      <g style="animation:rise 2.1s ease-out .7s infinite">
        <circle cx="-40" cy="44" r="4" fill="#fff" opacity=".7"/>
        <circle cx="4" cy="48" r="5" fill="#fff" opacity=".7"/>
        <circle cx="42" cy="44" r="3.4" fill="#fff" opacity=".7"/>
      </g>
    </g>
  </svg>

  <svg class="scene" id="s5" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#f1efe8"/>
    <circle cx="202" cy="310" r="132" fill="#d3d1c7" opacity=".45"/>
    <g transform="translate(202,310)">
      <g style="animation:wobble 2.4s ease-in-out infinite">
        <circle cx="0" cy="0" r="96" fill="#f7f5ef" stroke="#5f5e5a" stroke-width="4"/>
        <path d="M0,-96 L0,0 L70,66" stroke="#5f5e5a" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M0,0 L-62,-58" stroke="#888780" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <circle cx="0" cy="0" r="7" fill="#5f5e5a"/>
      </g>
      <text x="0" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#444441" font-family="system-ui">7 dias</text>
    </g>
    <g transform="translate(202,132)">
      <circle cx="0" cy="0" r="26" fill="#eaf3de" stroke="#639922" stroke-width="3"/>
      <path d="M0,-13 L0,13 M-13,0 L13,0" stroke="#3b6d11" stroke-width="4" stroke-linecap="round" style="animation:pulse 1.6s ease-in-out infinite"/>
    </g>
  </svg>

  <div class="cap" id="cap">Vou fermentar esse repolho<small>e só volto aqui no dia 7</small></div>

  <div class="ui">
    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pausar</button>
    <button onclick="next()">▶</button>
  </div>

  <div class="cover" id="cover"><button onclick="play()">▶</button></div>
</div>

<script>
const scenes = [
  { id:'s0', ms:4400, tag:'CENA 1 / 6', cap:'Vou fermentar esse repolho', sub:'e só volto aqui no dia 7', color:'#3b6d11' },
  { id:'s1', ms:4400, tag:'CENA 2 / 6', cap:'Sal, repolho e paciência', sub:'não precisa de mais nada', color:'#1d9e75' },
  { id:'s2', ms:4600, tag:'CENA 3 / 6', cap:'Sal é 2% do peso', sub:'1,5 kg de repolho = 30 g de sal', color:'#ba7517' },
  { id:'s3', ms:5200, tag:'CENA 4 / 6', cap:'Massageia 10 minutos', sub:'a água sai sozinha do repolho', color:'#d85a30' },
  { id:'s4', ms:5000, tag:'CENA 5 / 6', cap:'Prensa tudo pra baixo', sub:'o líquido precisa cobrir tudo', color:'#7f77dd' },
  { id:'s5', ms:5000, tag:'CENA 6 / 6', cap:'Agora é só esperar', sub:'volta no dia 7 pra ver', color:'#5f5e5a' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick = null, elapsed = 0;
const RES = 80;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick);
  tick = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() {
  if (i > 0) { i--; elapsed = 0; render(); }
}
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pausar';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Assistir';
  clearInterval(tick);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

</body>
</html>
