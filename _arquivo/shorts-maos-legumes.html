<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animação — Mãos de criança trabalhando nos legumes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#f3ece0; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#d85a30; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; }

  @keyframes chopHand {
    0%   { transform: translateY(-16px) rotate(-18deg) }
    50%  { transform: translateY(6px) rotate(4deg) }
    100% { transform: translateY(-16px) rotate(-18deg) }
  }
  @keyframes holdStable {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-4px) }
  }
  @keyframes massageL {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(11px,-5px) scale(.92,1.06) }
  }
  @keyframes massageR {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(-11px,-5px) scale(.92,1.06) }
  }
  @keyframes pressDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(15px) }
  }
  @keyframes rub {
    0%,100% { transform: translateX(-9px) rotate(-3deg) }
    50%     { transform: translateX(9px) rotate(3deg) }
  }
  @keyframes pourSalt {
    0%,100% { transform: translateY(-14px) rotate(-22deg) }
    35%     { transform: translateY(4px) rotate(-4deg) }
    65%     { transform: translateY(0) rotate(2deg) }
  }
  @keyframes riseF {
    0%   { transform: translateY(0); opacity: 0 }
    30%  { opacity: .85 }
    100% { transform: translateY(-88px); opacity: 0 }
  }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0); opacity: 0 }
    15%  { opacity: .95 }
    100% { transform: translateY(96px) translateX(6px); opacity: 0 }
  }
  @keyframes waterFlow {
    0%   { transform: translateY(0) scaleY(.6); opacity: 0 }
    20%  { opacity: .85 }
    100% { transform: translateY(120px) scaleY(1.5); opacity: 0 }
  }
  @keyframes washMove {
    0%,100% { transform: translate(-16px, 4px) rotate(-6deg) }
    50%     { transform: translate(16px, -6px) rotate(6deg) }
  }
  @keyframes spinSlight {
    0%,100% { transform: rotate(-9deg) }
    50%     { transform: rotate(9deg) }
  }
  @keyframes squeeze { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.05,.93)} }
  @keyframes fadeSlide { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes tapHint { 0%,100%{opacity:.25} 50%{opacity:.8} }
</style>
</head>

  <div class="ui">
    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pausar</button>
    <button onclick="next()">▶</button>

  <div class="cover" id="cover">
    <button onclick="play()">▶</button>
    <p>Mãos de criança · 7 cenas · 44s</p>
  </div>

<script>
const scenes = [
  { id:'s0', ms:6000, tag:'MÃOS DE CRIANÇA 1 / 7', cap:'Lavando o repolho', sub:'água fria, sem sabão', color:'#2b6a80' },
  { id:'s1', ms:5000, tag:'MÃOS DE CRIANÇA 2 / 7', cap:'Segurando o repolho', sub:'as duas mãos pequenas', color:'#3b6d11' },
  { id:'s2', ms:5000, tag:'MÃOS DE CRIANÇA 3 / 7', cap:'Cortando o repolho', sub:'fino, tipo 3 milímetros', color:'#3b6d11' },
  { id:'s3', ms:6500, tag:'MÃOS DE CRIANÇA 4 / 7', cap:'Massageando 10 minutos', sub:'até a água sair do repolho', color:'#d85a30' },
  { id:'s4', ms:5500, tag:'MÃOS DE CRIANÇA 5 / 7', cap:'Jogando o sal', sub:'2% do peso, sem iodo', color:'#ba7517' },
  { id:'s5', ms:5500, tag:'MÃOS DE CRIANÇA 6 / 7', cap:'Prensando no pote', sub:'o líquido cobre tudo', color:'#0f6e56' },
  { id:'s6', ms:5500, tag:'MÃOS DE CRIANÇA 7 / 7', cap:'Teste do ponto', sub:'caindo água = pronto', color:'#2c2c2a' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pausar';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Assistir';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>
