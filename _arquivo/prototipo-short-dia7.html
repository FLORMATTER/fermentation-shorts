<style>

    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;

  #stage {
    position:relative; width:405px; height:720px;
    background:#fff; overflow:hidden; border-radius:16px;

  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .4s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#534ab7; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .recdot {
    position:absolute; top:20px; left:18px; z-index:36;
    display:flex; align-items:center; gap:5px;
    font-size:9px; font-weight:800; letter-spacing:.12em; color:#a32d2d;
  }
  .recdot i {
    width:7px; height:7px; border-radius:50%; background:#e24b4a; display:block;
    animation:blinkRec 1.1s ease-in-out infinite;
  }
  @keyframes blinkRec { 0%,100%{opacity:1} 50%{opacity:.25} }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; }

  @keyframes riseF { 0%{transform:translateY(0);opacity:0} 30%{opacity:.9} 100%{transform:translateY(-96px);opacity:0} }

  @keyframes fadeSlide { 0%{opacity:0;transform:translateY(9px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes zoomPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }

  @keyframes static2s { 0%,100%{opacity:.94} 33%{opacity:.97} 66%{opacity:.95} }
  @keyframes slideLeft { 0%{transform:translateX(60px);opacity:0} 100%{transform:translateX(0);opacity:1} }
  @keyframes glowPulse { 0%,100%{opacity:.5} 50%{opacity:1} }

        <rect x="-70" y="6" width="20" height="70" rx="9" transform="rotate(-8 -60 41)"/>
        <rect x="-38" y="-4" width="20" height="80" rx="9" transform="rotate(6 -28 36)"/>
        <rect x="-6" y="4" width="20" height="72" rx="9" transform="rotate(-3 4 40)"/>
        <rect x="26" y="-6" width="20" height="82" rx="9" transform="rotate(8 36 35)"/>
      </g>
      <g style="animation:riseF 2.4s ease-out infinite">
        <circle cx="-48" cy="52" r="5" fill="#fff" opacity=".6"/>
        <circle cx="-8" cy="64" r="4.4" fill="#fff" opacity=".6"/>
        <circle cx="32" cy="56" r="4.8" fill="#fff" opacity=".6"/>
      </g>
    </g>
    <g style="animation:fadeSlide .6s ease-out .3s both">
      <rect x="34" y="546" width="337" height="54" rx="6" fill="#26215c" opacity=".95"/>
      <text x="202" y="572" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" font-family="system-ui">QUAL VEGETAL AGORA?</text>
      <text x="202" y="592" text-anchor="middle" font-size="15" font-weight="800" fill="#cecbf6" font-family="system-ui">COMENTA QUE EU FERMENTO</text>
    </g>
    <text x="202" y="626" text-anchor="middle" font-size="13" font-weight="600" fill="#5f5e5a" font-family="system-ui" opacity=".75">volta pro plano do pote = replay automático</text>
  </svg>

  <div class="ui">
    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pausar</button>
    <button onclick="next()">▶</button>
  </div>

  <div class="cover" id="cover">
    <button onclick="play()">▶</button>
    <p>Protótipo · Dia 7 · 7 cenas · 50s</p>
  </div>
</div>

<script>
const scenes = [
  { id:'s0', ms:4500, tag:'CENA 1 / 7 · ABERTURA',    color:'#2c2c2a' },
  { id:'s1', ms:7000, tag:'CENA 2 / 7 · REVELAÇÃO',   color:'#3b6d11' },
  { id:'s2', ms:5000, tag:'CENA 3 / 7 · PROVA',       color:'#ba7517' },
  { id:'s3', ms:5500, tag:'CENA 4 / 7 · FLASHBACK',   color:'#2c2c2a' },
  { id:'s4', ms:5000, tag:'CENA 5 / 7 · GELADEIRA',   color:'#185fa5' },
  { id:'s5', ms:5000, tag:'CENA 6 / 7 · GANCHO FINAL',color:'#26215c' },
  { id:'s6', ms:5500, tag:'CENA 7 / 7 · LOOP',        color:'#26215c' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pausar';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Assistir';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

</body>
