<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation — Fermented Onions (EN)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdf7f9; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#8e3a68; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; text-align:center; line-height:1.6; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; letter-spacing:.01em; }

  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-7px) rotate(1.4deg) }
  }
  @keyframes peelStrip {
    0%   { transform: translate(0,0) rotate(0deg) scaleY(1); opacity: 0 }
    22%  { opacity: .95 }
    100% { transform: translate(-40px,68px) rotate(-42deg) scaleY(1.4); opacity: 0 }
  }
  @keyframes peelTwist {
    0%,100% { transform: translate(0,0) rotate(0deg) }
    38%     { transform: translate(3px,-3px) rotate(-7deg) }
    72%     { transform: translate(-2px,2px) rotate(6deg) }
  }
  @keyframes sliceDrop {
    0%   { transform: translateY(-38px) scale(.85); opacity: 0 }
    22%  { opacity: 1 }
    100% { transform: translateY(0) scale(1); opacity: 1 }
  }
  @keyframes knifeChop {
    0%,100% { transform: translateY(-26px) rotate(-14deg) }
    42%     { transform: translateY(10px) rotate(3deg) }
  }
  @keyframes massageL {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(13px,-6px) scale(.93,1.05) }
  }
  @keyframes massageR {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(-13px,-6px) scale(.93,1.05) }
  }
  @keyframes pressDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(15px) }
  }
  @keyframes pourSalt {
    0%,100% { transform: translateY(-13px) rotate(-20deg) }
    34%     { transform: translateY(3px) rotate(-4deg) }
    64%     { transform: translateY(0) rotate(1deg) }
  }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0); opacity: 0 }
    15%  { opacity: .95 }
    100% { transform: translateY(98px) translateX(6px); opacity: 0 }
  }
  @keyframes riseF {
    0%   { transform: translateY(0) scale(.7); opacity: 0 }
    25%  { opacity: .9 }
    100% { transform: translateY(-96px) scale(1.2); opacity: 0 }
  }
  @keyframes riseSlow {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    30%  { opacity: .8 }
    100% { transform: translateY(-118px) scale(1.3); opacity: 0 }
  }
  @keyframes spin3d {
    0%   { transform: rotateY(0deg) }
    100% { transform: rotateY(360deg) }
  }
  @keyframes spinFlat {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(360deg) }
  }
  @keyframes spinRev {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(-360deg) }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.6); opacity: .75 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes clockTick {
    0%,100% { transform: rotate(0deg) }
    50%     { transform: rotate(30deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes slideUp {
    0%   { transform: translateY(24px); opacity: 0 }
    100% { transform: translateY(0); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes drawLine {
    0%   { stroke-dashoffset: 301 }
    100% { stroke-dashoffset: 0 }
  }
  @keyframes colorBleed {
    0%   { transform: scaleY(0); opacity: 0 }
    25%  { opacity: .85 }
    100% { transform: scaleY(1); opacity: .7 }
  }
  @keyframes barFill {
    0%   { width: 60px }
    100% { width: 320px }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">ONION 1 / 8</div>
  <div class="wm">@yourhandle</div>

  <!-- ══════════ SCENE 1 — THE ONION ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="oBody" cx="36%" cy="28%" r="76%">
        <stop offset="0%" stop-color="#e0a8c8"/>
        <stop offset="42%" stop-color="#a8478a"/>
        <stop offset="78%" stop-color="#7c2f63"/>
        <stop offset="100%" stop-color="#5c2049"/>
      </radialGradient>
      <linearGradient id="oSkin" x1="0%" y1="0%" x2="100%" y2="60%">
        <stop offset="0%" stop-color="#f4d4a6"/>
        <stop offset="45%" stop-color="#dcae72"/>
        <stop offset="100%" stop-color="#b8843f"/>
      </linearGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf7f9"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">FERMENTED RED ONION</text>
    <ellipse cx="202" cy="512" rx="166" ry="44" fill="#e8d4de" opacity=".5"/>

    <g transform="translate(202,368)" style="animation:floatUpDown 3.3s ease-in-out infinite">
      <!-- root tassel -->
      <g stroke="#c9a86e" stroke-width="1.8" stroke-linecap="round" opacity=".85">
        <path d="M-12,88 Q-16,102 -18,112"/>
        <path d="M0,92 Q0,106 1,116"/>
        <path d="M12,88 Q16,102 19,112"/>
      </g>
      <!-- onion body -->
      <ellipse rx="88" ry="86" fill="url(#oBody)"/>
      <!-- concentric skin rings -->
      <g fill="none" stroke="#4a1a3b" stroke-width="1.5" opacity=".55">
        <ellipse rx="72" ry="72"/>
        <ellipse rx="56" ry="57"/>
        <ellipse rx="40" ry="42"/>
      </g>
      <!-- vertical highlight bands -->
      <g fill="none" stroke="#dc9ec2" stroke-width="3" opacity=".45" stroke-linecap="round">
        <path d="M-52,-64 Q-62,0 -50,62"/>
        <path d="M-22,-80 Q-28,0 -20,76"/>
        <path d="M24,-80 Q30,0 22,74"/>
      </g>
      <!-- dried outer skin flaking -->
      <path d="M-84,10 Q-96,-40 -58,-74 Q-70,-20 -66,36Z" fill="url(#oSkin)" opacity=".9"/>
      <path d="M84,6 Q96,-42 60,-76 Q72,-22 68,32Z" fill="url(#oSkin)" opacity=".75"/>
      <!-- stem top -->
      <ellipse cy="-88" rx="15" ry="10" fill="#c9a86e"/>
      <path d="M0,-96 Q-3,-116 -1,-128" stroke="#c9a86e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M0,-96 Q-3,-116 -1,-128" stroke="#e2c493" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- papery shine -->
      <ellipse cx="-34" cy="-34" rx="26" ry="18" fill="#f0bcd8" opacity=".35" transform="rotate(-28 -34 -34)"/>
    </g>

    <text x="202" y="596" text-anchor="middle" font-size="26" font-weight="900" fill="#3d1f33" font-family="system-ui" letter-spacing="-.5" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.25s">FERMENTED ONION</text>
    <text x="202" y="624" text-anchor="middle" font-size="13" font-weight="700" fill="#8e3a68" font-family="system-ui" letter-spacing="3" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">TURNS PINK IN 5 DAYS</text>
    <text x="202" y="660" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.7s">The fastest, prettiest pickle you can make</text>
  </svg>

  <!-- ══════════ SCENE 2 — SLICE THIN ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="oSlice" cx="45%" cy="40%" r="62%">
        <stop offset="0%" stop-color="#fdf4f9"/>
        <stop offset="55%" stop-color="#f2d4e6"/>
        <stop offset="100%" stop-color="#c77aa8"/>
      </radialGradient>
      <linearGradient id="oEdge" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a8478a"/>
        <stop offset="100%" stop-color="#5c2049"/>
      </linearGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf7f9"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">STEP 1 · SLICE THIN</text>
    <ellipse cx="202" cy="486" rx="170" ry="48" fill="#eedbe6" opacity=".55"/>

    <!-- cutting board -->
    <rect x="46" y="400" width="313" height="34" rx="11" fill="#e8d5bd" stroke="#d3bb9c" stroke-width="1.8"/>

    <!-- onion half being sliced -->
    <g transform="translate(202,340)">
      <path d="M-72,26 Q-72,-58 0,-70 Q72,-58 72,26 Q0,42 -72,26Z" fill="url(#oEdge)"/>
      <path d="M-62,22 Q-62,-50 0,-60 Q62,-50 62,22 Q0,36 -62,22Z" fill="#fdf4f9"/>
      <g fill="none" stroke="#c77aa8" stroke-width="1.6" opacity=".75">
        <path d="M-48,18 Q-48,-40 0,-48 Q48,-40 48,18"/>
        <path d="M-32,14 Q-32,-30 0,-36 Q32,-30 32,14"/>
        <path d="M-16,10 Q-16,-20 0,-24 Q16,-20 16,10"/>
      </g>
    </g>

    <!-- knife -->
    <g style="animation:knifeChop 1.5s ease-in-out infinite">
      <path d="M132,150 L262,150 L272,214 L122,214Z" fill="#d8dce0"/>
      <path d="M132,150 L262,150 L264,166 L130,166Z" fill="#eef1f4"/>
      <path d="M122,214 L272,214 L272,224 L122,224Z" fill="#8a6a4a"/>
      <path d="M186,158 L272,158 L272,220 L186,220Z" fill="#f4f7fa" opacity=".55"/>
    </g>

    <!-- slices falling and landing -->
    <g>
      <g transform="translate(120,452)"><ellipse rx="40" ry="13" fill="url(#oSlice)" stroke="#a8478a" stroke-width="2" style="animation:sliceDrop 1.9s ease-out infinite; animation-delay:0s"/></g>
      <g transform="translate(180,468)"><ellipse rx="40" ry="13" fill="url(#oSlice)" stroke="#8e3a68" stroke-width="2" style="animation:sliceDrop 1.9s ease-out infinite; animation-delay:.35s"/></g>
      <g transform="translate(240,458)"><ellipse rx="40" ry="13" fill="url(#oSlice)" stroke="#a8478a" stroke-width="2" style="animation:sliceDrop 1.9s ease-out infinite; animation-delay:.7s"/></g>
      <g transform="translate(150,488)"><ellipse rx="40" ry="13" fill="url(#oSlice)" stroke="#7c2f63" stroke-width="2" style="animation:sliceDrop 1.9s ease-out infinite; animation-delay:1.05s"/></g>
      <g transform="translate(214,498)"><ellipse rx="40" ry="13" fill="url(#oSlice)" stroke="#8e3a68" stroke-width="2" style="animation:sliceDrop 1.9s ease-out infinite; animation-delay:1.4s"/></g>
    </g>

    <text x="202" y="596" text-anchor="middle" font-size="21" font-weight="900" fill="#3d1f33" font-family="system-ui" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">SLICE IT THIN</text>
    <text x="202" y="628" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8e3a68" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.45s">About 3 mm — thin slices drink the brine fast</text>
    <text x="202" y="650" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.6s">Red onion gives the most color. White works too.</text>
  </svg>

  <!-- ══════════ SCENE 3 — THE SALT ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="oBowl" cx="40%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f2eaf0"/>
        <stop offset="100%" stop-color="#ded0da"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf7f9"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">STEP 2 · THE SALT</text>
    <ellipse cx="202" cy="516" rx="164" ry="42" fill="#ead6e2" opacity=".55"/>

    <!-- bowl -->
    <path d="M78,404 Q202,392 326,404 Q316,516 202,534 Q88,516 78,404Z" fill="url(#oBowl)" stroke="#d6c4d0" stroke-width="2"/>
    <ellipse cx="202" cy="404" rx="124" ry="30" fill="#fdf7fa" stroke="#d6c4d0" stroke-width="2"/>

    <!-- onion slices in the bowl -->
    <g>
      <g transform="translate(158,414) rotate(-12)"><ellipse rx="34" ry="11" fill="#f2d4e6" stroke="#a8478a" stroke-width="1.8"/></g>
      <g transform="translate(216,420) rotate(9)"><ellipse rx="34" ry="11" fill="#f5dcea" stroke="#8e3a68" stroke-width="1.8"/></g>
      <g transform="translate(186,436) rotate(16)"><ellipse rx="34" ry="11" fill="#efcbe0" stroke="#a8478a" stroke-width="1.8"/></g>
      <g transform="translate(238,440) rotate(-8)"><ellipse rx="32" ry="10.5" fill="#f2d4e6" stroke="#7c2f63" stroke-width="1.8"/></g>
      <g transform="translate(146,444) rotate(6)"><ellipse rx="32" ry="10.5" fill="#efcbe0" stroke="#8e3a68" stroke-width="1.8"/></g>
      <g transform="translate(196,458) rotate(-14)"><ellipse rx="33" ry="11" fill="#f5dcea" stroke="#a8478a" stroke-width="1.8"/></g>
    </g>

    <!-- salt hand -->
    <g style="animation:pourSalt 2.4s ease-in-out infinite">
      <ellipse cx="300" cy="200" rx="34" ry="27" fill="#f2b992" transform="rotate(-16 300 200)"/>
      <ellipse cx="300" cy="200" rx="34" ry="27" fill="none" stroke="#d38f66" stroke-width="1.5" transform="rotate(-16 300 200)"/>
      <ellipse cx="272" cy="180" rx="13" ry="9" fill="#f0b58e" transform="rotate(-42 272 180)"/>
      <ellipse cx="292" cy="174" rx="13" ry="9" fill="#f0b58e" transform="rotate(-24 292 174)"/>
      <ellipse cx="312" cy="176" rx="13" ry="9" fill="#f0b58e" transform="rotate(-6 312 176)"/>
      <ellipse cx="330" cy="188" rx="13" ry="9" fill="#f0b58e" transform="rotate(14 330 188)"/>
      <!-- salt mound on palm -->
      <ellipse cx="290" cy="192" rx="19" ry="7" fill="#ffffff" opacity=".97"/>
      <ellipse cx="290" cy="188" rx="14" ry="6" fill="#ffffff"/>
      <ellipse cx="290" cy="185" rx="8" ry="3.6" fill="#ffffff"/>
    </g>

    <!-- salt crystals falling -->
    <g fill="#ffffff" stroke="#ddd0da" stroke-width=".7">
      <rect x="284" y="204" width="7" height="7" rx="1.6" style="animation:fall 1.5s ease-in infinite"/>
      <rect x="296" y="204" width="6" height="6" rx="1.4" style="animation:fall 1.5s ease-in infinite; animation-delay:.2s"/>
      <rect x="306" y="206" width="7" height="7" rx="1.6" style="animation:fall 1.5s ease-in infinite; animation-delay:.42s"/>
      <rect x="290" y="208" width="6" height="6" rx="1.4" style="animation:fall 1.5s ease-in infinite; animation-delay:.65s"/>
      <rect x="300" y="209" width="7" height="7" rx="1.6" style="animation:fall 1.5s ease-in infinite; animation-delay:.88s"/>
      <rect x="280" y="208" width="6" height="6" rx="1.4" style="animation:fall 1.5s ease-in infinite; animation-delay:1.1s"/>
    </g>

    <rect x="40" y="576" width="325" height="96" rx="14" fill="#ffffff" stroke="#e6d2de" stroke-width="2"/>
    <text x="202" y="608" text-anchor="middle" font-size="17" font-weight="900" fill="#3d1f33" font-family="system-ui">500 g onion = 10 g salt</text>
    <text x="202" y="632" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8e3a68" font-family="system-ui">That is 2% of the weight — no more, no less</text>
    <text x="202" y="652" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui">Non-iodized salt only. Iodine stops the ferment.</text>
  </svg>

  <!-- ══════════ SCENE 4 — MASSAGE ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="oBowl2" cx="40%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f2eaf0"/>
        <stop offset="100%" stop-color="#ded0da"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf7f9"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">STEP 3 · MASSAGE AND WAIT</text>

    <!-- bowl -->
    <path d="M74,392 Q202,380 330,392 Q320,516 202,534 Q84,516 74,392Z" fill="url(#oBowl2)" stroke="#d6c4d0" stroke-width="2"/>
    <ellipse cx="202" cy="392" rx="128" ry="31" fill="#fdf7fa" stroke="#d6c4d0" stroke-width="2"/>

    <!-- slices inside -->
    <g>
      <g transform="translate(152,404) rotate(-10)"><ellipse rx="35" ry="11" fill="#f2cfe3" stroke="#a8478a" stroke-width="1.8"/></g>
      <g transform="translate(220,410) rotate(12)"><ellipse rx="35" ry="11" fill="#f0c6dd" stroke="#8e3a68" stroke-width="1.8"/></g>
      <g transform="translate(184,428) rotate(18)"><ellipse rx="35" ry="11" fill="#f2cfe3" stroke="#a8478a" stroke-width="1.8"/></g>
      <g transform="translate(240,436) rotate(-9)"><ellipse rx="33" ry="10.5" fill="#f0c6dd" stroke="#7c2f63" stroke-width="1.8"/></g>
      <g transform="translate(142,440) rotate(5)"><ellipse rx="33" ry="10.5" fill="#f2cfe3" stroke="#8e3a68" stroke-width="1.8"/></g>
      <g transform="translate(198,456) rotate(-15)"><ellipse rx="34" ry="11" fill="#eebfda" stroke="#a8478a" stroke-width="1.8"/></g>
    </g>

    <!-- brine forming -->
    <g opacity=".9">
      <ellipse cx="202" cy="470" rx="88" ry="24" fill="#c9648f" opacity=".55"/>
      <ellipse cx="202" cy="466" rx="66" ry="16" fill="#d97ba5" opacity=".6"/>
      <ellipse cx="175" cy="452" rx="14" ry="6" fill="#e49ab8" opacity=".7"/>
      <ellipse cx="232" cy="458" rx="12" ry="5" fill="#e49ab8" opacity=".7"/>
    </g>

    <!-- two hands massaging -->
    <g style="animation:massageL 1.5s ease-in-out infinite">
      <ellipse cx="126" cy="264" rx="46" ry="33" fill="#f2b992" transform="rotate(-22 126 264)"/>
      <ellipse cx="126" cy="264" rx="46" ry="33" fill="none" stroke="#d38f66" stroke-width="1.5" transform="rotate(-22 126 264)"/>
      <ellipse cx="88" cy="248" rx="14" ry="10" fill="#f0b58e" transform="rotate(-46 88 248)"/>
      <ellipse cx="110" cy="238" rx="14" ry="10" fill="#f0b58e" transform="rotate(-28 110 238)"/>
      <ellipse cx="134" cy="236" rx="14" ry="10" fill="#f0b58e" transform="rotate(-10 134 236)"/>

    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pause</button>
    <button onclick="next()">▶</button>

  <div class="cover" id="cover">
    <button onclick="play()">▶</button>
    <p>Fermented onion · 8 scenes · 55s<br>English version</p>
  </div>

<script>
const scenes = [
  { id:'s0', ms:5500, tag:'ONION 1 / 8', cap:'Fermented red onion', sub:'the prettiest pickle you can make', color:'#8e3a68' },
  { id:'s1', ms:6000, tag:'ONION 2 / 8', cap:'Slice it thin', sub:'about 3 mm — no thicker', color:'#8e3a68' },
  { id:'s2', ms:7000, tag:'ONION 3 / 8', cap:'500 g = 10 g of salt', sub:'2% of the weight, non-iodized', color:'#a8478a' },
  { id:'s3', ms:7000, tag:'ONION 4 / 8', cap:'Squeeze for 5 minutes', sub:'it makes its own brine — no water', color:'#c2551f' },
  { id:'s4', ms:7000, tag:'ONION 5 / 8', cap:'The pink trick: 1 beet slice', sub:'same recipe, way more color', color:'#c02a62' },
  { id:'s5', ms:7500, tag:'ONION 6 / 8', cap:'Same crunch, no more bite', sub:'sharp on day 1, mild on day 5', color:'#0f6e56' },
  { id:'s6', ms:6500, tag:'ONION 7 / 8', cap:'Ready in 5 days', sub:'2 days on the counter, then fridge', color:'#3d1f33' },
  { id:'s7', ms:6500, tag:'ONION 8 / 8', cap:'Pink, crunchy, done', sub:'the best beginner ferment', color:'#3d1f33' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Play';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>
