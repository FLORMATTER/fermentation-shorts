<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation — 3 ferments that change color (garlic, onion, beetroot)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdfaf5; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#8e1a51; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; text-align:center; line-height:1.6; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; letter-spacing:.01em; }

  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-7px) rotate(1.4deg) }
  }
  @keyframes floatSoft {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-6px) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes slideUp {
    0%   { transform: translateY(24px); opacity: 0 }
    100% { transform: translateY(0); opacity: 1 }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.55); opacity: .7 }
    100% { transform: scale(1.85); opacity: 0 }
  }
  @keyframes bleedSpread {
    0%   { transform: scale(.15); opacity: .9 }
    100% { transform: scale(1.7); opacity: 0 }
  }
  @keyframes riseSlow {
    0%   { transform: translateY(0) scale(.6); opacity: 0 }
    30%  { opacity: .8 }
    100% { transform: translateY(-110px) scale(1.3); opacity: 0 }
  }
  @keyframes turnBlue {
    0%, 25% { fill: #f4ebd8 }
    100%    { fill: #7ea9c6 }
  }
  @keyframes turnGreen {
    0%, 25% { fill: #f4ebd8 }
    100%    { fill: #8fbf9a }
  }
  @keyframes swayLeaf {
    0%,100% { transform: rotate(-5deg) }
    50%     { transform: rotate(5deg) }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">3 COLORS 1 / 8</div>
  <div class="wm">@yourchannel</div>

  <!-- ══════════ CENA 1 — OS TRÊS JUNTOS ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s0Honey" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e8b558"/><stop offset="100%" stop-color="#c08a2e"/>
      </linearGradient>
      <linearGradient id="s0Pink" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e07cb4"/><stop offset="100%" stop-color="#b23a7e"/>
      </linearGradient>
      <linearGradient id="s0Mag" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#c62a68"/><stop offset="100%" stop-color="#7d1245"/>
      </linearGradient>
      <linearGradient id="s0Glass" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity=".2"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".55"/>
      </linearGradient>
    </defs>
    <rect width="405" height="720" fill="#fdfaf5"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">GARLIC · ONION · BEETROOT</text>
    <ellipse cx="202" cy="500" rx="176" ry="42" fill="#e9e2d4" opacity=".5"/>

    <!-- jar 1 · garlic in honey -->
    <g transform="translate(76,372)"><g style="animation:floatSoft 3.4s ease-in-out infinite">
      <rect x="-34" y="-72" width="68" height="144" rx="15" fill="url(#s0Glass)" stroke="#ded6c6" stroke-width="2"/>
      <rect x="-31" y="-34" width="62" height="103" rx="12" fill="url(#s0Honey)" opacity=".92"/>
      <g fill="#f6ecd6">
        <ellipse cx="-9" cy="6" rx="10" ry="15"/><ellipse cx="9" cy="14" rx="9" ry="14"/>
        <ellipse cx="-4" cy="34" rx="9" ry="13"/><ellipse cx="11" cy="46" rx="8" ry="12"/>
      </g>
      <rect x="-36" y="-80" width="72" height="12" rx="6" fill="#c8bda6"/>
      <rect x="-26" y="-64" width="7" height="112" rx="4" fill="#ffffff" opacity=".38"/>
    </g></g>
    <text x="76" y="474" text-anchor="middle" font-size="10.5" font-weight="900" fill="#8a6a1e" font-family="system-ui" letter-spacing="1.2">GARLIC</text>

    <!-- jar 2 · red onion -->
    <g transform="translate(202,372)"><g style="animation:floatSoft 3.4s ease-in-out infinite; animation-delay:.35s">
      <rect x="-34" y="-72" width="68" height="144" rx="15" fill="url(#s0Glass)" stroke="#ded6c6" stroke-width="2"/>
      <rect x="-31" y="-40" width="62" height="109" rx="12" fill="url(#s0Pink)" opacity=".9"/>
      <g fill="none" stroke="#fbd0e6" stroke-width="2" opacity=".8">
        <ellipse cx="0" cy="18" rx="22" ry="14"/><ellipse cx="0" cy="18" rx="12" ry="7"/>
      </g>
      <g fill="none" stroke="#f7bcd8" stroke-width="1.8" opacity=".7">
        <ellipse cx="-8" cy="-8" rx="16" ry="10"/><ellipse cx="10" cy="42" rx="14" ry="9"/>
      </g>
      <rect x="-36" y="-80" width="72" height="12" rx="6" fill="#c8bda6"/>
      <rect x="-26" y="-64" width="7" height="112" rx="4" fill="#ffffff" opacity=".38"/>
    </g></g>
    <text x="202" y="474" text-anchor="middle" font-size="10.5" font-weight="900" fill="#a01e52" font-family="system-ui" letter-spacing="1.2">ONION</text>

    <!-- jar 3 · beetroot -->
    <g transform="translate(328,372)"><g style="animation:floatSoft 3.4s ease-in-out infinite; animation-delay:.7s">
      <rect x="-34" y="-72" width="68" height="144" rx="15" fill="url(#s0Glass)" stroke="#ded6c6" stroke-width="2"/>
      <rect x="-31" y="-38" width="62" height="107" rx="12" fill="url(#s0Mag)" opacity=".93"/>
      <g fill="#e4557f" opacity=".85">
        <path d="M-16,0 L0,-14 L16,0 L0,14Z"/><path d="M-12,36 L2,24 L14,38 L0,48Z"/>
      </g>
      <g fill="none" stroke="#7aa844" stroke-width="3" stroke-linecap="round">
        <path d="M0,-58 Q-14,-74 -8,-86"/><path d="M4,-58 Q16,-74 12,-86"/>
      </g>
      <rect x="-36" y="-80" width="72" height="12" rx="6" fill="#c8bda6"/>
      <rect x="-26" y="-64" width="7" height="112" rx="4" fill="#ffffff" opacity=".38"/>
    </g></g>
    <text x="328" y="474" text-anchor="middle" font-size="10.5" font-weight="900" fill="#8e1a51" font-family="system-ui" letter-spacing="1.2">BEETROOT</text>

    <text x="202" y="546" text-anchor="middle" font-size="26" font-weight="900" fill="#2f2a22" font-family="system-ui" letter-spacing="-.6" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.3s">THESE 3 TURN COLOR</text>
    <text x="202" y="576" text-anchor="middle" font-size="12" font-weight="800" fill="#8e1a51" font-family="system-ui" letter-spacing="2.2" style="animation:popInSeq .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.55s">AND NONE OF THEM IS SPOILED</text>
    <text x="202" y="606" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a8272" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.8s">Three ferments. Three colors. Three reasons.</text>
  </svg>

  <!-- ══════════ CENA 2 — BETERRABA ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="s1Beet" cx="36%" cy="26%" r="78%">
        <stop offset="0%" stop-color="#e0709e"/>
        <stop offset="50%" stop-color="#a52a5a"/>
        <stop offset="100%" stop-color="#6d1436"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf2f7"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">1 OF 3 · BEETROOT</text>
    <ellipse cx="202" cy="486" rx="164" ry="42" fill="#f0d4e2" opacity=".6"/>

    <!-- color spreading out of the beet -->
    <g fill="#c62a68" opacity=".5">
      <circle cx="202" cy="352" r="76" style="animation:bleedSpread 3.4s ease-out infinite"/>
      <circle cx="202" cy="352" r="76" style="animation:bleedSpread 3.4s ease-out infinite; animation-delay:1.15s"/>
      <circle cx="202" cy="352" r="76" style="animation:bleedSpread 3.4s ease-out infinite; animation-delay:2.3s"/>
    </g>

    <g transform="translate(202,342)">
      <g style="animation:floatUpDown 3.6s ease-in-out infinite">
        <!-- leaves -->
        <g style="animation:swayLeaf 4.2s ease-in-out infinite">
          <path d="M-8,-74 Q-34,-108 -18,-134" stroke="#5f8a34" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M8,-74 Q34,-108 22,-136" stroke="#6f9a3e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M0,-76 Q2,-112 0,-140" stroke="#7aa844" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>
        <ellipse rx="80" ry="84" fill="url(#s1Beet)"/>
        <g fill="none" stroke="#4a0e26" stroke-width="1.4" opacity=".4">
          <ellipse rx="66" ry="70"/><ellipse rx="50" ry="54"/>
        </g>
        <g fill="none" stroke="#f0a8c8" stroke-width="3" opacity=".5" stroke-linecap="round">
          <path d="M-46,-62 Q-54,0 -42,60"/>
          <path d="M-18,-78 Q-23,0 -16,74"/>
          <path d="M20,-78 Q25,0 18,72"/>
        </g>
        <ellipse cx="-30" cy="-32" rx="22" ry="15" fill="#fbc4dc" opacity=".35" transform="rotate(-28 -30 -32)"/>
      </g>
    </g>

    <g style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">
      <rect x="128" y="470" width="148" height="32" rx="16" fill="#8e1a51"/>
      <text x="202" y="491" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff" font-family="system-ui" letter-spacing="2">BETALAIN</text>
    </g>

    <text x="202" y="546" text-anchor="middle" font-size="22" font-weight="900" fill="#3d1f33" font-family="system-ui" letter-spacing="-.4" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">BEETROOT TURNS MAGENTA</text>
    <text x="202" y="576" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.65s">A pigment that dissolves. It dyes the brine</text>
    <text x="202" y="596" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.75s">and your hands. Nothing you can do about it.</text>
    <text x="202" y="626" text-anchor="middle" font-size="12" font-weight="800" fill="#8e1a51" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.9s">That is the pigment leaving the beet.</text>
  </svg>

  <!-- ══════════ CENA 3 — CEBOLA ROXA ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="s2Onion" cx="36%" cy="28%" r="76%">
        <stop offset="0%" stop-color="#e0a8c8"/>
        <stop offset="42%" stop-color="#a8478a"/>
        <stop offset="78%" stop-color="#7c2f63"/>
        <stop offset="100%" stop-color="#5c2049"/>
      </radialGradient>
    </defs>
    <rect width="405" height="720" fill="#fbf2f6"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#b08a9c" font-family="system-ui" letter-spacing="2">2 OF 3 · RED ONION</text>
    <ellipse cx="202" cy="486" rx="164" ry="42" fill="#eedae6" opacity=".6"/>

    <g transform="translate(202,344)">
      <g style="animation:floatUpDown 3.4s ease-in-out infinite">
        <g stroke="#c9a86e" stroke-width="1.6" stroke-linecap="round" opacity=".8">
          <path d="M-10,80 Q-13,94 -15,104"/><path d="M0,84 Q0,98 1,108"/><path d="M10,80 Q13,94 15,104"/>
        </g>
        <ellipse rx="78" ry="76" fill="url(#s2Onion)"/>
        <g fill="none" stroke="#4a1a3b" stroke-width="1.4" opacity=".5">
          <ellipse rx="64" ry="64"/><ellipse rx="50" ry="51"/><ellipse rx="36" ry="37"/>
        </g>
        <g fill="none" stroke="#dc9ec2" stroke-width="2.8" opacity=".45" stroke-linecap="round">
          <path d="M-46,-56 Q-54,0 -44,54"/>
          <path d="M-19,-70 Q-25,0 -18,66"/>
          <path d="M21,-70 Q26,0 19,64"/>
        </g>
        <path d="M-74,10 Q-84,-34 -50,-64 Q-60,-18 -57,32Z" fill="#dcae72" opacity=".9"/>
        <ellipse cy="-78" rx="13" ry="9" fill="#c9a86e"/>
        <path d="M0,-84 Q-2,-102 -1,-112" stroke="#c9a86e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="-30" cy="-30" rx="22" ry="15" fill="#f0bcd8" opacity=".32" transform="rotate(-28 -30 -30)"/>
      </g>
    </g>

    <!-- acid turning it brighter -->
    <g>
      <circle cx="300" cy="250" r="17" fill="#e0a8c8" opacity=".55" style="animation:bleedSpread 3s ease-out infinite"/>
      <circle cx="300" cy="250" r="17" fill="#e0a8c8" opacity=".55" style="animation:bleedSpread 3s ease-out infinite; animation-delay:1s"/>
      <circle cx="300" cy="250" r="17" fill="#e0a8c8" opacity=".55" style="animation:bleedSpread 3s ease-out infinite; animation-delay:2s"/>
    </g>

    <g style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">
      <rect x="122" y="470" width="160" height="32" rx="16" fill="#a01e52"/>
      <text x="202" y="491" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff" font-family="system-ui" letter-spacing="2">ANTHOCYANIN</text>
    </g>

    <text x="202" y="546" text-anchor="middle" font-size="20" font-weight="900" fill="#3d1f33" font-family="system-ui" letter-spacing="-.4" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">ONION TURNS SHOCKING PINK</text>
    <text x="202" y="576" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.65s">A pigment that reacts to acid. The more acid,</text>
    <text x="202" y="596" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7284" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.75s">the brighter it gets. Soft pink, or magenta.</text>
    <text x="202" y="626" text-anchor="middle" font-size="12" font-weight="800" fill="#a01e52" font-family="system-ui" style="animation:fadeSlide .6s ease both; animation-delay:.9s">One slice of beet decides which.</text>
  </svg>

  <!-- ══════════ CENA 4 — ALHO ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s3Honey" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e8b558"/><stop offset="100%" stop-color="#b8811f"/>
      </linearGradient>
      <linearGradient id="s3Glass" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity=".2"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".55"/>
      </linearGradient>
    </defs>
    <rect width="405" height="720" fill="#fdf8ee"/>
    <text x="202" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="#a89270" font-family="system-ui" letter-spacing="2">3 OF 3 · GARLIC IN HONEY</text>
    <ellipse cx="202" cy="486" rx="164" ry="42" fill="#ece0c8" opacity=".55"/>

    <!-- the jar, garlic turning blue -->
    <g transform="translate(202,336)">
      <rect x="-70" y="-124" width="140" height="248" rx="24" fill="url(#s3Glass)" stroke="#ded6c6" stroke-width="2.2"/>
      <rect x="-64" y="-42" width="128" height="160" rx="20" fill="url(#s3Honey)" opacity=".9"/>
      <rect x="-76" y="-136" width="152" height="16" rx="8" fill="#c8bda6"/>
      <rect x="-52" y="-104" width="12" height="196" rx="6" fill="#ffffff" opacity=".32"/>

      <!-- cloves: one still cream, one ALREADY blue, one ALREADY green.
           A cor tem que aparecer no quadro parado — se as quatro comecarem
           creme, quem so olhar a capa nao ve o que o texto promete. -->
      <g>
        <ellipse cx="-34" cy="-8" rx="15" ry="23" fill="#f4ebd8"/>
        <ellipse cx="-34" cy="-26" rx="11" ry="15" fill="#fbf6e8"/>
        <ellipse cx="30" cy="0" rx="14" ry="22" fill="#7ea9c6"/>
        <ellipse cx="30" cy="-17" rx="10" ry="14" fill="#a8c8dc"/>
        <ellipse cx="-30" cy="52" rx="14" ry="21" fill="#8fbf9a"/>
        <ellipse cx="-30" cy="36" rx="10" ry="14" fill="#b6d6bd"/>
        <ellipse cx="30" cy="62" rx="13" ry="20" fill="#f4ebd8" style="animation:turnBlue 4.6s ease-in-out infinite alternate"/>
        <ellipse cx="30" cy="47" rx="9" ry="13" fill="#fbf6e8"/>
        <ellipse cx="0" cy="94" rx="12" ry="19" fill="#f4ebd8" style="animation:turnGreen 4.6s ease-in-out infinite alternate; animation-delay:.8s"/>
        <ellipse cx="0" cy="80" rx="9" ry="13" fill="#fbf6e8"/>
      </g>

      <!-- bubbles -->
      <g fill="#fff8e2" opacity=".8">
        <circle cx="-8" cy="86" r="4" style="animation:riseSlow 2.6s ease-out infinite"/>
        <circle cx="12" cy="92" r="3.4" style="animation:riseSlow 2.6s ease-out infinite; animation-delay:.9s"/>
        <circle cx="0" cy="90" r="3" style="animation:riseSlow 2.6s ease-out infinite; animation-delay:1.7s"/>
      </g>
    </g>

    <g style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.45s">
      <rect x="128" y="470" width="148" height="32" rx="16" fill="#3f6f92"/>
      <text x="202" y="491" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff" font-family="system-ui" letter-spacing="2">NOT A PIGMENT</text>
    </g>

    <text x="202" y="546" text-anchor="middle" font-size="19" font-weight="900" fill="#3d3222" font-family="system-ui" letter-spacing="-.4" style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:.2s">GARLIC TURNS BLUE OR GREEN</text>

<script>
const scenes = [
  { id:'s0', ms:5500, tag:'3 COLORS 1 / 8', cap:'3 ferments that change color', sub:'garlic, onion and beetroot', color:'#8e1a51' },
  { id:'s1', ms:7000, tag:'3 COLORS 2 / 8', cap:'Beetroot: the pigment bleeds', sub:'betalain · it dyes everything it touches', color:'#c62a68' },
  { id:'s2', ms:7000, tag:'3 COLORS 3 / 8', cap:'Red onion: acid turns it pink', sub:'anthocyanin · one beet slice = magenta', color:'#c04a8e' },
  { id:'s3', ms:7000, tag:'3 COLORS 4 / 8', cap:'Garlic: blue is normal', sub:'a reaction, not mold', color:'#3f6f92' },
  { id:'s4', ms:7000, tag:'3 COLORS 5 / 8', cap:'Three colors, three reasons', sub:'a pigment, a pigment, and a reaction', color:'#7d1245' },
  { id:'s5', ms:6500, tag:'3 COLORS 6 / 8', cap:'The color means it is working', sub:'not a sign that it went bad', color:'#2f7d55' },
  { id:'s6', ms:7000, tag:'3 COLORS 7 / 8', cap:'The one color that IS bad', sub:'fuzz on the surface, not color inside', color:'#c2551f' },
  { id:'s7', ms:6500, tag:'3 COLORS 8 / 8', cap:'Which one are you trying first?', sub:'beetroot · onion · garlic', color:'#3d1f33' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Watch';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
