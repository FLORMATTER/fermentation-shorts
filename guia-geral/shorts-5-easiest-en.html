<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow:hidden; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh;
  }

  /* ══ THE FRAME — native 1080x1920, full bleed, NO rounded corners, NO shadow ══
     This is the recording canvas. It is exactly what YouTube wants for a Short.
     In an OBS Browser Source set to 1080x1920 the scale below resolves to 1
     and you record pixel for pixel. On a normal monitor it shrinks to fit
     so you can preview it. Nothing else changes. */
  #stage {
    position:relative; width:1080px; height:1920px;
    background:#fdf8ee; overflow:hidden;
    transform-origin:center center;
    flex:none;
  }

  /* the inner SVGs stay in the series' 405x720 coordinate space and are
     stretched to the full 1080x1920 frame — vector, so it stays razor sharp */
  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:11px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#2c2c2a; transition:width .2s linear; }

  .tag {
    position:absolute; top:59px; left:0; right:0; text-align:center;
    font-size:27px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:48px; right:43px; font-size:24px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:219px; left:0; right:0; display:flex;
        justify-content:center; gap:24px; z-index:40; opacity:0; transition:opacity .3s; }
  /* the controls only appear when the mouse moves, then fade out by themselves —
     so a hands-off recording never has buttons on top of the drawing */
  #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:31px;
    font-weight:700; font-family:inherit; padding:21px 40px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.62);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:43px; }
  .cover.hide { display:none; }
  .cover button { width:208px; height:208px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:72px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:13px; }
  .cover p { color:#fff; font-size:32px; font-weight:700; letter-spacing:.08em; opacity:.9;
             text-transform:uppercase; text-align:center; line-height:1.7; }
  .cover p b { color:#f0c846; }
  .cover .hint { font-size:24px; font-weight:600; opacity:.55; letter-spacing:.04em; text-transform:none; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:37px 59px 45px; font-size:43px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:32px; font-weight:500; opacity:.72; margin-top:11px; letter-spacing:.01em; }

  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) rotate(0deg) }
    50%     { transform: translateY(-9px) rotate(1.4deg) }
  }
  @keyframes wobble {
    0%,100% { transform: rotate(-2.5deg) }
    50%     { transform: rotate(2.5deg) }
  }
  @keyframes popInSeq {
    0%   { transform: scale(.4); opacity: 0 }
    60%  { transform: scale(1.08); opacity: 1 }
    100% { transform: scale(1); opacity: 1 }
  }
  @keyframes fadeSlide {
    0%   { opacity: 0; transform: translateY(8px) }
    100% { opacity: 1; transform: translateY(0) }
  }
  @keyframes slideUp {
    0%   { transform: translateY(24px); opacity: 0 }
    100% { transform: translateY(0); opacity: 1 }
  }
  @keyframes saltFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0 }
    15%  { opacity: .95 }
    100% { transform: translateY(190px) rotate(180deg); opacity: 0 }
  }
  @keyframes riseF {
    0%   { transform: translateY(0) scale(.7); opacity: 0 }
    25%  { opacity: .9 }
    100% { transform: translateY(-96px) scale(1.2); opacity: 0 }
  }
  @keyframes shimmer {
    0%,100% { opacity: .3 }
    50%     { opacity: .8 }
  }
  @keyframes spinFlat {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(360deg) }
  }
  @keyframes spinRev {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(-360deg) }
  }
  @keyframes pulseRing {
    0%   { transform: scale(.62); opacity: .7 }
    100% { transform: scale(1.55); opacity: 0 }
  }
  @keyframes pulseSoft {
    0%,100% { transform: scale(1) }
    50%     { transform: scale(1.045) }
  }
  @keyframes barGrow {
    0%   { transform: scaleX(0) }
    100% { transform: scaleX(1) }
  }
  @keyframes drawLine {
    0%   { stroke-dashoffset: 300 }
    100% { stroke-dashoffset: 0 }
  }
</style>
</head>

    <g style="animation:fadeSlide .6s ease both; animation-delay:1.8s">
      <text x="202" y="546" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3d3222" font-family="system-ui">Start with radish. It is the fastest of the five.</text>
      <text x="202" y="572" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a7a5e" font-family="system-ui">Cut thin · weigh the salt · press it down</text>
    </g>

    <g style="animation:popInSeq .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay:2s">
      <rect x="72" y="592" width="261" height="40" rx="20" fill="#f3ece0" stroke="#ddd0b8" stroke-width="2"/>
      <text x="202" y="617" text-anchor="middle" font-size="12.5" font-weight="900" fill="#3d3222" font-family="system-ui">Which one are you trying first? 👇</text>
    </g>
  </svg>

  <div class="cap" id="cap">The 5 easiest to ferment<small>One rule: 2% salt · 5 to 9 days</small></div>

  <div class="ui">
    <button onclick="prev()">◀</button>
    <button onclick="toggle()" id="btnPlay">⏸ Pause</button>
    <button onclick="next()">▶</button>
  </div>

  <div class="cover" id="cover">
    <button onclick="play()">▶</button>
    <p>Fermentation · beginner chart<br>8 scenes · 49s<br><b>1080 × 1920</b> · ready to record</p>
    <p class="hint">Click ▶ to start. Space = play / pause.<br>Add <b>?play</b> to the URL to auto-start.</p>
  </div>
</div>

<script>
const scenes = [
  { id:'s0', ms:5500, tag:'GUIDE 1 / 8', cap:'The 5 easiest to ferment',   sub:'start with any of these',              color:'#2c2c2a' },
  { id:'s1', ms:6500, tag:'GUIDE 2 / 8', cap:'2% salt — the only rule',    sub:'1 kg of vegetable → 20 g of salt',     color:'#2c2c2a' },
  { id:'s2', ms:6000, tag:'GUIDE 3 / 8', cap:'Red cabbage · 2% salt',      sub:'7 days · the classic',                 color:'#8e3a68' },
  { id:'s3', ms:6000, tag:'GUIDE 4 / 8', cap:'Beetroot · 2% salt',         sub:'9 days · the slowest of the five',     color:'#8c1f47' },
  { id:'s4', ms:6000, tag:'GUIDE 5 / 8', cap:'Carrots · 2% salt',          sub:'6 days · top it up with brine',        color:'#c06018' },
  { id:'s5', ms:6000, tag:'GUIDE 6 / 8', cap:'Radish · 2% salt',           sub:'6 days · the fastest to start with',   color:'#c1272d' },
  { id:'s6', ms:6000, tag:'GUIDE 7 / 8', cap:'Cucumber · 3% brine',        sub:'5 days · the only exception',          color:'#0f6e56' },
  { id:'s7', ms:7000, tag:'GUIDE 8 / 8', cap:'The full chart',             sub:'save it and pick one',                 color:'#2c2c2a' }
];

const stage    = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl    = document.getElementById('cap');
const tagEl    = document.getElementById('tag');
const btnPlay  = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

/* ── Fit the 1080x1920 frame to the window ──────────────────────────────
   Inside an OBS Browser Source set to 1080x1920 the viewport IS 1080x1920,
   so k = 1 and the recording is pixel for pixel.
   On a normal landscape monitor it only shrinks, so you can preview it.  */
function fit() {
  const k = Math.min(1, window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit);

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pause';
  document.getElementById('cover').classList.add('hide');
  stage.classList.remove('touched');   /* controls stay out of the recording */
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Play';
  clearInterval(tick0);
}
function toggle() { playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

/* controls: show on mouse move, hide again after 2.2s of stillness */
let uiTimer = null;
stage.addEventListener('mousemove', () => {
  stage.classList.add('touched');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => stage.classList.remove('touched'), 2200);
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') next();
  if (e.code === 'ArrowLeft') prev();
});

fit();
render();

/* ?play in the URL = auto-start 1.5s after load (handy for OBS recording) */
if (/[?&]play\b/.test(location.search)) setTimeout(play, 1500);
</script>

<script>
/* ?rec = modo gravacao.
   Sem ?rec na URL, nada muda: e o short normal.
   Com ?rec, o quadro preenche 1080x1920 (1920x1080 no video longo),
   a capa e os botoes somem e a animacao comeca sozinha. */
(function () {
  if (location.search.indexOf('rec') < 0) return;
  var css = '#cover{display:none!important}.ui{display:none!important}'
          + '#stage{border-radius:0!important;box-shadow:none!important}';
  var st = document.getElementById('stage');
  if (st) {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (w && h) {
      css += '#stage{transform:scale(' + ((h > w ? 1920 : 1080) / h)
           + ')!important;transform-origin:center center!important}';
    }
  }
  if (document.getElementById('frame')) {
    css += '#frame{transform:scale(1)!important;left:0!important;top:0!important}';
  }
  var tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
  if (typeof showChapters === 'function') showChapters(false);
  setTimeout(function () { if (typeof play === 'function') play(); }, 500);
})();
</script>
