<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animação — Fermentação de Rabanete</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #stage {
    position:relative; width:405px; height:720px;
    background:#fdf2f2; overflow:hidden; border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  @media (max-height:790px){ #stage{ transform:scale(.86);} }
  @media (max-height:700px){ #stage{ transform:scale(.72);} }

  svg.scene {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; visibility:hidden; transition:opacity .42s ease;
  }
  svg.scene.on { opacity:1; visibility:visible; }

  .bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,.12); z-index:40; }
  #progress { height:100%; width:0; background:#c1272d; transition:width .2s linear; }

  .tag {
    position:absolute; top:22px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; opacity:.5; z-index:30; color:#2c2c2a;
  }
  .wm { position:absolute; top:18px; right:16px; font-size:9px; font-weight:800;
        letter-spacing:.1em; opacity:.35; z-index:35; text-transform:uppercase; color:#2c2c2a; }

  .ui { position:absolute; bottom:82px; left:0; right:0; display:flex;
        justify-content:center; gap:9px; z-index:40; opacity:0; transition:opacity .25s; }
  #stage:hover .ui, #stage.touched .ui { opacity:1; }
  .ui button { border:none; background:rgba(15,14,12,.8); color:#fff; font-size:11.5px;
    font-weight:700; font-family:inherit; padding:8px 15px; border-radius:999px; cursor:pointer; }
  .ui button:hover { background:#000; }

  .cover { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .cover.hide { display:none; }
  .cover button { width:78px; height:78px; border-radius:50%; border:none;
    background:rgba(255,255,255,.95); color:#111; font-size:27px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:5px; }
  .cover p { color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; opacity:.85; text-transform:uppercase; }

  .cap {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(15,14,12,.86); color:#fff;
    padding:14px 22px 17px; font-size:16px; font-weight:800;
    text-align:center; z-index:30; line-height:1.35;
  }
  .cap small { display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:4px; }

  @keyframes chopHand {
    0%   { transform: translateY(-18px) rotate(-16deg) }
    50%  { transform: translateY(8px) rotate(4deg) }
    100% { transform: translateY(-18px) rotate(-16deg) }
  }
  @keyframes sliceDrop {
    0%   { transform: translateY(-22px) scale(.7); opacity: 0 }
    35%  { opacity: 1 }
    100% { transform: translateY(0) scale(1); opacity: 1 }
  }
  @keyframes massageL {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(12px,-6px) scale(.93,1.05) }
  }
  @keyframes massageR {
    0%,100% { transform: translate(0,0) scale(1,1) }
    50%     { transform: translate(-12px,-6px) scale(.93,1.05) }
  }
  @keyframes riseF {
    0%   { transform: translateY(0); opacity: 0 }
    30%  { opacity: .85 }
    100% { transform: translateY(-88px); opacity: 0 }
  }
  @keyframes spinFlat {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(360deg) }
  }
  @keyframes spinRev {
    0%   { transform: rotate(0deg) }
    100% { transform: rotate(-360deg) }
  }
  @keyframes floatUpDown {
    0%,100% { transform: translateY(0) }
    50%     { transform: translateY(-7px) }
  }
  @keyframes fadeSlide { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes pulseRing {
    0%   { transform: scale(.55); opacity: .7 }
    100% { transform: scale(1.9); opacity: 0 }
  }
  @keyframes clockTick { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(24deg)} }
</style>
</head>
<body>

<div id="stage">
  <div class="bar"><div id="progress"></div></div>
  <div class="tag" id="tag">RABANETE 1 / 7</div>
  <div class="wm">@seucanal</div>

  <!-- ══════════ CENA 1 — O RABANETE INTEIRO ══════════ -->
  <svg class="scene on" id="s0" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="radBody" cx="34%" cy="28%" r="80%">
        <stop offset="0%"  stop-color="#ff8fa3"/>
        <stop offset="32%" stop-color="#f0455f"/>
        <stop offset="70%" stop-color="#c1272d"/>
        <stop offset="100%" stop-color="#8a0f1e"/>
      </radialGradient>
      <linearGradient id="radLeaf" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"  stop-color="#3f6b1e"/>
        <stop offset="60%" stop-color="#68a02f"/>
        <stop offset="100%" stop-color="#9ed14e"/>
      </linearGradient>
      <radialGradient id="radFloor" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#e2a8ae" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#e2a8ae" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="405" height="720" fill="#fef8f8"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b89a9c" font-family="system-ui" letter-spacing="2">VISTA DE CIMA · O RABANETE</text>
    <ellipse cx="202" cy="510" rx="176" ry="56" fill="url(#radFloor)"/>

    <g transform="translate(202,392)"><g style="animation:floatUpDown 3.2s ease-in-out infinite">
      <!-- folhas -->
      <g stroke="url(#radLeaf)" fill="none" stroke-linecap="round">
        <path d="M-6,-62 Q-54,-108 -50,-172" stroke-width="15"/>
        <path d="M0,-64 Q14,-124 4,-190" stroke-width="16"/>
        <path d="M6,-62 Q56,-106 58,-166" stroke-width="15"/>
      </g>
      <g stroke="#8fc245" fill="none" stroke-linecap="round" opacity=".8">
        <path d="M-6,-62 Q-54,-108 -50,-172" stroke-width="3"/>
        <path d="M0,-64 Q14,-124 4,-190" stroke-width="3.2"/>
        <path d="M6,-62 Q56,-106 58,-166" stroke-width="3"/>
      </g>
      <!-- pecíolos -->
      <path d="M-11,-52 L-8,-20 L-2,-20 L-4,-52Z" fill="#e05a72"/>
      <path d="M3,-54 L2,-20 L9,-20 L9,-54Z" fill="#c1272d"/>

      <!-- corpo: rabanete é mais alongado -->
      <ellipse cx="0" cy="34" rx="66" ry="72" fill="url(#radBody)"/>
      <!-- raiz fina -->
      <path d="M0,102 Q2,140 0,164" stroke="#a81626" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M0,102 Q2,140 0,164" stroke="#d94e63" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <!-- brilho -->
      <ellipse cx="-24" cy="0" rx="22" ry="18" fill="#ffffff" opacity=".22" transform="rotate(-26 -24 0)"/>
      <ellipse cx="-17" cy="-12" rx="10" ry="7" fill="#ffffff" opacity=".28" transform="rotate(-26 -17 -12)"/>
      <!-- pontinhos (rabanete tem textura) -->
      <g fill="#8a0f1e" opacity=".28">
        <circle cx="-30" cy="52" r="2.2"/>
        <circle cx="-8" cy="64" r="2"/>
        <circle cx="20" cy="56" r="2.2"/>
        <circle cx="-22" cy="76" r="1.9"/>
        <circle cx="14" cy="80" r="2"/>
      </g>
    </g></g>

    <g style="animation:fadeSlide .6s ease-in-out .25s both">
      <rect x="34" y="576" width="337" height="52" rx="6" fill="#c1272d" opacity=".95"/>
      <text x="202" y="598" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="system-ui">RABANETE FERMENTADO</text>
      <text x="202" y="619" text-anchor="middle" font-size="16" font-weight="800" fill="#ffe2e6" font-family="system-ui">O MAIS RÁPIDO DE TODOS</text>
    </g>
  </svg>

  <!-- ══════════ CENA 2 — CORTANDO EM RODELAS ══════════ -->
  <svg class="scene" id="s1" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sliceEdge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#f0455f"/>
        <stop offset="100%" stop-color="#a01628"/>
      </linearGradient>
      <radialGradient id="sliceCenter" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#fff5f6"/>
        <stop offset="70%" stop-color="#ffd4da"/>
        <stop offset="100%" stop-color="#f7b8c2"/>
      </radialGradient>
    </defs>

    <rect width="405" height="720" fill="#fdf4f4"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b89a9c" font-family="system-ui" letter-spacing="2">RODELAS FINAS · 3 MM</text>
    <ellipse cx="202" cy="520" rx="168" ry="46" fill="#e2a8ae" opacity=".35"/>

    <!-- tábua -->
    <rect x="46" y="398" width="313" height="126" rx="14" fill="#e5d6c0" stroke="#cdb9a0" stroke-width="3"/>

    <!-- r odelas empilhadas (elipses = rodela vista de cima) -->
    <g transform="translate(202,448)">
      <g style="animation:sliceDrop 2.4s ease-out infinite">
        <ellipse cx="-84" cy="0" rx="30" ry="30" fill="url(#sliceEdge)"/>
        <ellipse cx="-84" cy="0" rx="25" ry="25" fill="url(#sliceCenter)"/>
        <ellipse cx="-84" cy="0" rx="15" ry="15" fill="#ffffff" opacity=".5"/>
      </g>
      <g style="animation:sliceDrop 2.4s ease-out .35s infinite">
        <ellipse cx="-42" cy="0" rx="30" ry="30" fill="url(#sliceEdge)"/>
        <ellipse cx="-42" cy="0" rx="25" ry="25" fill="url(#sliceCenter)"/>
        <ellipse cx="-42" cy="0" rx="15" ry="15" fill="#ffffff" opacity=".5"/>
      </g>
      <g style="animation:sliceDrop 2.4s ease-out .7s infinite">
        <ellipse cx="0" cy="0" rx="30" ry="30" fill="url(#sliceEdge)"/>
        <ellipse cx="0" cy="0" rx="25" ry="25" fill="url(#sliceCenter)"/>
        <ellipse cx="0" cy="0" rx="15" ry="15" fill="#ffffff" opacity=".5"/>
      </g>
      <g style="animation:sliceDrop 2.4s ease-out 1.05s infinite">
        <ellipse cx="42" cy="0" rx="30" ry="30" fill="url(#sliceEdge)"/>
        <ellipse cx="42" cy="0" rx="25" ry="25" fill="url(#sliceCenter)"/>
        <ellipse cx="42" cy="0" rx="15" ry="15" fill="#ffffff" opacity=".5"/>
      </g>
      <g style="animation:sliceDrop 2.4s ease-out 1.4s infinite">
        <ellipse cx="84" cy="0" rx="30" ry="30" fill="url(#sliceEdge)"/>
        <ellipse cx="84" cy="0" rx="25" ry="25" fill="url(#sliceCenter)"/>
        <ellipse cx="84" cy="0" rx="15" ry="15" fill="#ffffff" opacity=".5"/>
      </g>
    </g>

    <!-- faca fatiando -->
    <g transform="translate(300,314)"><g style="animation:chopHand .88s ease-in-out infinite">
      <rect x="-6" y="-92" width="12" height="50" rx="5" fill="#4a4a48"/>
      <path d="M-7,-44 L7,-44 L10,26 L-10,26Z" fill="#cfcdc6"/>
      <path d="M-7,-44 L7,-44 L8,-4 L-8,-4Z" fill="#eceae4"/>
      <!-- mão de criança segurando a faca -->
      <ellipse cx="-14" cy="-100" rx="8.5" ry="14" fill="#6b4636" transform="rotate(-30 -14 -100)"/>
      <ellipse cx="-13.5" cy="-107" rx="4.5" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="-108" rx="8.5" ry="14" fill="#6b4636" transform="rotate(-12 0 -108)"/>
      <ellipse cx="0" cy="-115" rx="4.5" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="14" cy="-101" rx="8.5" ry="14" fill="#6b4636" transform="rotate(18 14 -101)"/>
      <ellipse cx="15.5" cy="-108" rx="4.5" ry="5.2" fill="#e8c9b8" opacity=".92"/>
      <ellipse cx="0" cy="-86" rx="21" ry="17" fill="#6b4636"/>
      <ellipse cx="0" cy="-86" rx="21" ry="17" fill="none" stroke="#4e3125" stroke-width="1.5"/>
    </g></g>

    <g style="animation:fadeSlide .6s ease-in-out .25s both">
      <rect x="34" y="576" width="337" height="52" rx="6" fill="#a01628" opacity=".95"/>
      <text x="202" y="598" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="system-ui">RODELAS BEM FINAS</text>
      <text x="202" y="619" text-anchor="middle" font-size="16" font-weight="800" fill="#ffe2e6" font-family="system-ui">3 MM. FINAS ENTRA O SAL.</text>
    </g>
  </svg>

  <!-- ══════════ CENA 3 — SAL 2% ══════════ -->
  <svg class="scene" id="s2" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="salBag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#e8e4d8"/>
      </linearGradient>
      <radialGradient id="salGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#c1272d" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#c1272d" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="405" height="720" fill="#fdf4f4"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b89a9c" font-family="system-ui" letter-spacing="2">SAL 2% DO PESO · SEM IODO</text>

    <g transform="translate(202,332)">
      <ellipse cx="0" cy="120" rx="140" ry="72" fill="url(#salGlow)"/>
      <ellipse cx="0" cy="70" rx="118" ry="26" fill="#dcc9cc"/>
      <rect x="-110" y="44" width="220" height="28" rx="10" fill="#f4ecee" stroke="#d0bdbf" stroke-width="2"/>
      <ellipse cx="0" cy="44" rx="110" ry="23" fill="#fdf6f7" stroke="#d0bdbf" stroke-width="2"/>

      <!-- tigela com rodelas -->
      <g>
        <ellipse cx="0" cy="36" rx="80" ry="21" fill="#fdf4f4"/>
        <ellipse cx="-56" cy="26" rx="22" ry="22" fill="#e8435c"/>
        <ellipse cx="-56" cy="26" rx="14" ry="14" fill="#fff0f2"/>
        <ellipse cx="-8" cy="20" rx="22" ry="22" fill="#e8435c"/>
        <ellipse cx="-8" cy="20" rx="14" ry="14" fill="#fff0f2"/>
        <ellipse cx="44" cy="26" rx="22" ry="22" fill="#e8435c"/>
        <ellipse cx="44" cy="26" rx="14" ry="14" fill="#fff0f2"/>
        <ellipse cx="-32" cy="44" rx="20" ry="20" fill="#d62f47"/>
        <ellipse cx="-32" cy="44" rx="13" ry="13" fill="#fff0f2"/>
        <ellipse cx="20" cy="46" rx="20" ry="20" fill="#d62f47"/>
        <ellipse cx="20" cy="46" rx="13" ry="13" fill="#fff0f2"/>
      </g>

      <rect x="-66" y="86" width="132" height="38" rx="6" fill="#2c2c2a"/>
      <text x="0" y="114" text-anchor="middle" font-size="25" font-weight="900" fill="#ff8fa3" font-family="monospace">250 g</text>
      <rect x="-17" y="132" width="34" height="14" rx="4" fill="#d0bdbf"/>

      <g transform="translate(-94,10) rotate(28)" style="">
        <path d="M-30,-40 L30,-40 L34,32 Q0,42 -34,32Z" fill="url(#salBag)" stroke="#cfc7b6" stroke-width="2"/>
        <rect x="-24" y="-48" width="48" height="12" rx="5" fill="#e3ded0" stroke="#cfc7b6" stroke-width="2"/>
        <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="900" fill="#8a8577" font-family="system-ui">SAL</text>
      </g>
    </g>

    <g>
      <circle cx="124" cy="318" r="3.4" fill="#fff" stroke="#cfc7b6" stroke-width="1" style="animation:riseF 1.1s ease-out infinite"/>
      <circle cx="140" cy="328" r="2.8" fill="#fff" stroke="#cfc7b6" stroke-width="1" style="animation:riseF 1.1s ease-out .32s infinite"/>
      <circle cx="156" cy="318" r="3.2" fill="#fff" stroke="#cfc7b6" stroke-width="1" style="animation:riseF 1.1s ease-out .64s infinite"/>
      <circle cx="116" cy="332" r="2.4" fill="#fff" stroke="#cfc7b6" stroke-width="1" style="animation:riseF 1.1s ease-out .86s infinite"/>
    </g>

    <g style="animation:fadeSlide .6s ease-in-out .25s both">
      <rect x="34" y="576" width="337" height="52" rx="6" fill="#ba7517" opacity=".95"/>
      <text x="202" y="598" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="system-ui">250 g = 5 g DE SAL</text>
      <text x="202" y="619" text-anchor="middle" font-size="16" font-weight="800" fill="#faeeda" font-family="system-ui">SÓ 2%. SEM IODO.</text>
    </g>
  </svg>

  <!-- ══════════ CENA 4 — MASSAGEANDO (rápido, só 3 min) ══════════ -->
  <svg class="scene" id="s3" viewBox="0 0 405 720" xmlns="http://www.w3.org/2000/svg">
    <rect width="405" height="720" fill="#fdeef0"/>
    <text x="202" y="56" text-anchor="middle" font-size="10" font-weight="800" fill="#b8919a" font-family="system-ui" letter-spacing="2">SÓ 3 MINUTOS · RÁPIDO</text>
    <ellipse cx="202" cy="512" rx="172" ry="46" fill="#d9a5ac" opacity=".38"/>

    <g transform="translate(202,392)">
      <ellipse cx="0" cy="10" rx="104" ry="58" fill="#fdf4f4" opacity=".95"/>
      <ellipse cx="0" cy="10" rx="90" ry="48" fill="#f8e6e9"/>
      <g>
        <ellipse cx="-44" cy="4" rx="24" ry="24" fill="#e8435c"/>
        <ellipse cx="-44" cy="4" rx="15" ry="15" fill="#fff0f2"/>
        <ellipse cx="38" cy="0" rx="24" ry="24" fill="#e8435c"/>
        <ellipse cx="38" cy="0" rx="15" ry="15" fill="#fff0f2"/>
        <ellipse cx="-2" cy="-20" rx="22" ry="22" fill="#d62f47"/>
        <ellipse cx="-2" cy="-20" rx="14" ry="14" fill="#fff0f2"/>
        <ellipse cx="-16" cy="26" rx="22" ry="22" fill="#e8435c"/>
        <ellipse cx="-16" cy="26" rx="14" ry="14" fill="#fff0f2"/>
        <ellipse cx="22" cy="28" rx="21" ry="21" fill="#d62f47"/>
        <ellipse cx="22" cy="28" rx="13" ry="13" fill="#fff0f2"/>
      </g>

      <!-- mãos de criança -->
      <g transform="translate(-72,-50)"><g style="animation:massageL 1.05s ease-in-out infinite">
        <ellipse cx="-24" cy="-22" rx="11" ry="18" fill="#6b4636" transform="rotate(-28 -24 -22)"/>
        <ellipse cx="-23" cy="-29" rx="5.2" ry="5.8" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="-30" cy="-2" rx="10" ry="17" fill="#6b4636" transform="rotate(-16 -30 -2)"/>
        <ellipse cx="-29" cy="-9" rx="5" ry="5.4" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="-27" cy="18" rx="9" ry="15" fill="#6b4636" transform="rotate(-6 -27 18)"/>
        <ellipse cx="-26" cy="11" rx="4.6" ry="5" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="#6b4636"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="none" stroke="#4e3125" stroke-width="1.5"/>
        <ellipse cx="14" cy="-28" rx="12" ry="10" fill="#6b4636" transform="rotate(20 14 -28)"/>
        <ellipse cx="17" cy="-34" rx="6" ry="5" fill="#e8c9b8" opacity=".92"/>
      </g></g>
      <g transform="translate(72,-50)"><g style="animation:massageR 1.05s ease-in-out .5s infinite">
        <ellipse cx="24" cy="-22" rx="11" ry="18" fill="#6b4636" transform="rotate(28 24 -22)"/>
        <ellipse cx="23" cy="-29" rx="5.2" ry="5.8" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="30" cy="-2" rx="10" ry="17" fill="#6b4636" transform="rotate(16 30 -2)"/>
        <ellipse cx="29" cy="-9" rx="5" ry="5.4" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="27" cy="18" rx="9" ry="15" fill="#6b4636" transform="rotate(6 27 18)"/>
        <ellipse cx="26" cy="11" rx="4.6" ry="5" fill="#e8c9b8" opacity=".92"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="#6b4636"/>
        <ellipse cx="0" cy="0" rx="36" ry="31" fill="none" stroke="#4e3125" stroke-width="1.5"/>
        <ellipse cx="-14" cy="-28" rx="12" ry="10" fill="#6b4636" transform="rotate(-20 -14 -28)"/>
        <ellipse cx="-17" cy="-34" rx="6" ry="5" fill="#e8c9b8" opacity=".92"/>
      </g></g>

      <g style="animation:riseF 1.3s ease-out infinite">
        <circle cx="-56" cy="64" r="5.6" fill="#f7a0b0" opacity=".85"/>
        <circle cx="-12" cy="78" r="5" fill="#f7a0b0" opacity=".85"/>
        <circle cx="28" cy="70" r="5.4" fill="#f7a0b0" opacity=".85"/>
      </g>
    </g>

    <g style="animation:fadeSlide .6s ease-in-out .25s both">

    <button onclick="toggle()" id="btnPlay">⏸ Pausar</button>
    <button onclick="next()">▶</button>

    <button onclick="play()">▶</button>

<script>
const scenes = [
  { id:'s0', ms:5000, tag:'RABANETE 1 / 7', cap:'Rabanete fermentado', sub:'o mais rápido de todos', color:'#c1272d' },
  { id:'s1', ms:5500, tag:'RABANETE 2 / 7', cap:'Rodelas bem finas', sub:'3 mm. finas entra o sal.', color:'#a01628' },
  { id:'s2', ms:5500, tag:'RABANETE 3 / 7', cap:'250 g = 5 g de sal', sub:'só 2%. sem iodo.', color:'#ba7517' },
  { id:'s3', ms:5500, tag:'RABANETE 4 / 7', cap:'Só 3 minutos de massagem', sub:'rabanete solta água rápido', color:'#d85a30' },
  { id:'s4', ms:6000, tag:'RABANETE 5 / 7', cap:'Dá pra pôr pimenta', sub:'pimenta = picante. opcional.', color:'#0f6e56' },
  { id:'s5', ms:6500, tag:'RABANETE 6 / 7', cap:'3 vezes mais rápido', sub:'menos água que o repolho', color:'#3b6d11' },
  { id:'s6', ms:6500, tag:'RABANETE 7 / 7', cap:'5 a 7 dias', sub:'prova no dia 3. se gostar, para.', color:'#2c2c2a' }
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const capEl = document.getElementById('cap');
const tagEl = document.getElementById('tag');
const btnPlay = document.getElementById('btnPlay');

let i = 0, playing = false, tick0 = null, elapsed = 0;
const RES = 70;

function render() {
  scenes.forEach((s, n) => {
    const el = document.getElementById(s.id);
    el.classList.remove('on');
    if (n === i) el.classList.add('on');
  });
  tagEl.textContent = scenes[i].tag;
  capEl.innerHTML = scenes[i].cap + '<small>' + scenes[i].sub + '</small>';
  progress.style.background = scenes[i].color;
  progress.style.width = '0%';
}

function loop() {
  clearInterval(tick0);
  tick0 = setInterval(() => {
    if (!playing) return;
    elapsed += RES;
    const total = scenes[i].ms;
    progress.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    if (elapsed >= total) {
      if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
      else { stop(); progress.style.width = '100%'; }
    }
  }, RES);
}

function next() {
  if (i < scenes.length - 1) { i++; elapsed = 0; render(); }
  else { stop(); progress.style.width = '100%'; }
}
function prev() { if (i > 0) { i--; elapsed = 0; render(); } }
function play() {
  playing = true; elapsed = 0;
  btnPlay.textContent = '⏸ Pausar';
  document.getElementById('cover').classList.add('hide');
  stage.classList.add('touched');
  render(); loop();
}
function stop() {
  playing = false;
  btnPlay.textContent = '▶ Assistir';
  clearInterval(tick0);
}
function toggle(){ playing ? stop() : play(); }

stage.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (playing) toggle();
});

render();
</script>
